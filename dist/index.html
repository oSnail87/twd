  if(rf()<.5)news(`${fullName(p)} got back up.`,"bad",[p.id]);return false})}

// ---------- camps take people in ----------
// leaders, or whoever talks best, go out and bring people back when the camp can feed them
function recruitHour(c){if(c.h!==10&&c.h!==15)return;
  for(const g of c.groups){if(g.leader==="you")continue;const L=P(g.leader);if(!L)continue;const n=groupSize(g.id);const days=g.stock.food/Math.max(1,n);
    const want=(n<10?1:n<16?.5:.15)*(L.tr.kind*.6+L.tr.ambit*.6)*(days>2?1:.3);if(rf()>want*.35)continue;
    const rec=[L,...members(g.id).filter(q=>q.age>=18&&q.tr.social>.6&&q.role!=="guard")].sort((a,b)=>b.tr.social+b.sk.speak*.1-a.tr.social-a.sk.speak*.1)[0];
    const homes=Object.entries(c.byHome).filter(([bid,qs])=>qs.some(q=>q.age>=16)&&!qs.some(q=>q.hh==="you"||q.fam.you||q.rej&&q.rej[g.id]&&S.t-q.rej[g.id]<DAY*2));if(!homes.length)continue;
    const [bid,qs]=pick(homes);const head=qs.filter(q=>q.age>=16).sort((a,b)=>b.tr.ambit-a.tr.ambit)[0];const N=needs(head,c);
    placeTo(rec,{x:BMAP[bid].x+rnd(-3,3),z:BMAP[bid].z+rnd(-3,3)});rec.act=`recruiting in town for ${g.name}`;rec.expo=.8;
    const will=8+head.fear*.3+N.food*26+N.water*18+head.tr.social*10+relGet(head,rec)/5+(rec.sk.speak*2)-head.tr.ambit*10+rf()*14;
    if(will>34&&joinVerdict(g,qs)){bringIn(g,qs);news(`${fullName(rec)} went door to door for ${g.name} and came back with the ${head.sur||head.name} household.`,"good",[rec.id,head.id])}
    else{mem(head,`${rec.name} came by asking us to join ${g.name}. We said no, for now.`,1,rec.id);relAdd(head,rec,2)}}}

// ---------- the dead, near you: seeing them, running, fighting back ----------
function barkSee(p,mode){if(p.age<13)return pick(["*screams*","Help! HELP!","Mom! Dad!"]);if(mode==="fight")return pick(["Get behind me!","Come on, then.","I got this one.","Stay back!","Head. Go for the head."]);return pick(["They're here!","Run!","Oh God. Oh God.","Get inside! Get inside!","No, no, no..."])}
function protectee(p,z){for(const q of W3.npcNear||[]){if(q===p||!q.alive)continue;if((q.age<13&&q.home===p.home||p.partner===q.id||p.fam[q.id])&&dist(q.x,q.z,z.x,z.z)<dist(p.x,p.z,z.x,z.z)+1&&dist(q.x,q.z,p.x,p.z)<8)return q}return null}
function fleeSpot(p,z,R){const ax=p.x-z.x,az=p.z-z.z,al=Math.hypot(ax,az)||1;const home=p.home&&BMAP[p.home];let best=null,bs=-1e9;
  for(const b of BUILDINGS){const bd=dist(b.x,b.z,p.x,p.z);if(b!==home&&bd>16||bd>28||!b.exits.length||b.type==="mill")continue;const e=b.exits[0].p[b.exits[0].outSide];const dx=e.x-p.x,dz=e.z-p.z,dl=Math.hypot(dx,dz)||1;
    const toward=(dx*-ax+dz*-az)/(dl*al);if(S.zeds.some(q=>Math.abs(q.x-b.x)<b.w/2&&Math.abs(q.z-b.z)<b.d/2))continue;const s=(b===home?7:0)-dl*.4-toward*9;if(s>bs){bs=s;best=b}}
  if(best&&bs>-9){const q=insidePos(best);R.fx=q.x;R.fz=q.z;R.inB=best.id;return}
  for(let i=0;i<10;i++){const a=Math.atan2(ax,az)+(rf()-.5)*1.4,r=7+rf()*5;const x=p.x+Math.sin(a)*r,zz=p.z+Math.cos(a)*r;if(free(x,zz,.3,"npc")){R.fx=x;R.fz=zz;R.inB=null;return}}
  R.fx=p.x+ax/al*6;R.fz=p.z+az/al*6;R.inB=null}
function npcSwing(p,z){const arm=npcArm(p);const gun=npcGun(p);const R=p._r;
  if(gun){if(rf()<.15)packTake(p,"ammo");noise(p.x,p.z,40)}
  if(rf()<.55+p.sk.fight*.05+(arm?.08:0)){z.hp-=2+arm*.9+p.sk.fight*.6;z.stun=.4;const kx=z.x-p.x,kz=z.z-p.z,l=Math.hypot(kx,kz)||1;step(z,kx/l*.4,kz/l*.4,.3,"zed");
    if(z.hp<=0){killZed(z,false);p.kills=(p.kills||0)+1;if(R&&R.bark<=0&&rf()<.5){R.bark=6;bubble(p,styleSay(p,pick(["Stay down.","Got it.","That's one.","...God forgive me."])),1.6)}}}}
// returns a speed multiplier if fear or a fight is moving them this frame, or 0 if they go about their business
function npcReact(p,dt){const R=p._r||(p._r={t:rf()*.3,mode:null,zid:null,fx:0,fz:0,cd:0,bark:0,pt:0,path:null,pi:0,seen:0});R.t-=dt;R.cd-=dt;R.bark-=dt;
  if(R.t<=0){R.t=.28+rf()*.14;const sr=p.lie?3.5:(W3.night?6:9)*(R.mode?1.6:1);let best=null,bd=sr;
    for(const z of W3.zAct||S.zeds){if(Math.abs(z.x-p.x)>bd||Math.abs(z.z-p.z)>bd)continue;const d=dist(z.x,z.z,p.x,p.z);if(d<bd&&(d<1.6||losClear(p.x,p.z,z.x,z.z))){bd=d;best=z}}
    if(best){if(R.zid!==best.id)p.fear=Math.min(100,Math.max(p.fear||0,55)+10);R.zid=best.id;R.seen=performance.now();p.seen=S.t;if(p.lie){p.lie=false;p.lieRot=null}
      const arm=npcArm(p);const brave=p.tr.brave+(p.fear>85?-.15:0);const fightOK=p.age>=15&&p.health>40&&(arm>=4||p.sk.fight>=4)&&brave>.42;
      const kid=protectee(p,best);const mode=fightOK||kid&&p.age>=16&&brave>.25&&p.health>30?"fight":"flee";R.lzx=best.x;R.lzz=best.z;
      // too close to run clean: shove it off first
      if(mode==="flee"&&bd<1.3&&p.age>=13&&R.cd<=0){R.cd=1.4;best.stun=Math.max(best.stun||0,.8);const kx=best.x-p.x,kz=best.z-p.z,l=Math.hypot(kx,kz)||1;step(best,kx/l*.5,kz/l*.5,.3,"zed")}
      if(mode!==R.mode){R.mode=mode;R.path=null;if(R.bark<=0){R.bark=8;bubble(p,styleSay(p,barkSee(p,mode)),2)}if(mode==="flee")fleeSpot(p,best,R)}
      else if(mode==="flee"&&dist(p.x,p.z,R.fx,R.fz)<1.2)fleeSpot(p,best,R)}
    else if(R.mode&&performance.now()-R.seen>(R.mode==="flee"?7000:2500)){const was=R.mode;R.mode=null;R.zid=null;p.path=null;const pl=p.plan;
      if(pl&&pl.dest&&pl.st!=="do"){if(was==="flee"&&pl.out&&pl.st==="go"&&dist(pl.dest.x,pl.dest.z,R.lzx??1e9,R.lzz??1e9)<14){pl.st="back";pl.until=S.t+180;goHome(p);setAct(p,"heading home",.6)}else{p.tx=pl.dest.x;p.tz=pl.dest.z}}
      if(R.inB){const b=BMAP[R.inB];if(b&&bldAt(p.x,p.z)===b){for(const d of b.exits){const D=d.door;if(D&&D.open&&!D.broken&&!doorBlocked(D)){D.open=false;D.auto=false;doorSave(D)}}p.tx=p.x;p.tz=p.z;
        if(p.fear>75&&!p.group&&p.age>=13&&b.id!==p.home)stay(p,"hole",`hiding in ${b.n}`,.05,null,{until:S.t+rnd(60,150),n:99})}R.inB=null}}}
  if(!R.mode)return 0;

  p.tx=R.fx;p.tz=R.fz;return 1.9}
// ================= the long sleep: waking in Limon Hospital a week after it began =================

const COMA_CAUSES={

  if(has("sleep_q")&&!has("how")){say(p.mood<35?pick(["Not really. Every noise is one of them.","I don't sleep. I lie there and listen."]):!S.flags.alarm?pick(["Fine. Why, do I look tired?","Like a rock. You?"]):pick(["A few hours. Better than nothing.","On and off. You?","Like the dead. ...Bad choice of words."]));R.da+=1;return finish(p,R,out)}
  if(has("dead")&&!S.flags.clinic){say(pick(["The dead? What are you talking about?","...Are you feeling okay?"]));return finish(p,R,out)}
  if(has("dead")){const lost=famList(p).find(([q])=>q.status==="turned");say(lost?`They took my ${lost[1]}. I still see ${lost[0].name}'s face on every one of them.`:p.tr.brave>.65?pick(["Aim for the head. Keep moving. Don't let them box you in.","They're slow. We're stupid. That's how people die.","I've put down eleven. I stopped counting after that."]):pick(["I can't look at them. They used to be our neighbors.","The noise. That noise they make. I hear it in my sleep.","Do you think they know? What they are?"]));return finish(p,R,out)}
  if(has("food")&&/\b(you|ya)\b/.test(low)&&/\b(eat|eaten|ate|hungry|starving|thirsty)\b/.test(low)){say(p.hunger>60?pick(["Yeah. I'm okay.","Had something this morning. I'm fine."]):p.hunger>30?pick(["A little. Not enough.","Some. I'm saving the rest."]):pick(["Not since yesterday.","*laughs without any humor* Eaten. That's a good one."]));if(p.hunger<30)R.ask="eat";return finish(p,R,out)}
  if(has("food")){const st=g?.stock;say(g?`We've got about ${Math.round(st.food)} food and ${Math.round(st.water)} water at ${g.name}, for ${groupSize(g.id)} people. ${st.food<groupSize(g.id)*2?"It's not enough.":"We're okay for now."}`:pick(["I've got a couple cans left. After that, who knows.","Everyone's raiding the grocery. Won't last."]));return finish(p,R,out)}
  if(has("plan")&&!S.flags.alarm){say(pick(["Plan? Get through the week. Same as always.","Work, dinner, bed. Why, what's yours?","Honestly? Coffee. Then we'll see."]));return finish(p,R,out)}
  if(has("plan")){say(isLeader?(g.pol.stance==="hostile"?"We take what we need. Nobody's handing it to us.":`Walls. Food. Water. In that order. ${dayOf(S.t)>12?"And get ready for winter.":""}`):g?`Ask ${g.leader==="you"?"yourself":fullName(P(g.leader)||p)}. I just do the work.`:pick(["Find people. Find walls. Find food.","Wait it out. The army'll come. Won't they?","Get out of town before it's too late."]));return finish(p,R,out)}
  if(has("news")){const ok=n=>!/household|joined|is old enough|went up at/.test(n.x);const recent=S.news.filter(n=>S.t-n.t<DAY*3&&ok(n));const known=recent.find(n=>(n.a||[]).some(id=>id!==p.id&&(p.rel[id]!==undefined||P(id)?.group===p.group)))||recent.find(n=>n.k==="big"||n.k==="bad")||recent[0];
    say(known?(/^Radio:/.test(known.x)?`The radio said ${known.x.replace(/^Radio:\s*/,"").replace(/^./,c=>c.toLowerCase())}`:/^Rumor:/.test(known.x)?`People are saying ${known.x.replace(/^Rumor:\s*/,"")}`:`Did you hear? ${known.x}`):"Nothing good. Nothing at all, really.");return finish(p,R,out)}
  if(has("joke")){say(p.tr.social>.4?pick(JOKES):"I don't do jokes.");R.da+=1;return finish(p,R,out)}

  if(has("greet")||has("yes")||has("no")){const hh=hourOf(S.t);const tt=hh>=5&&hh<12?"Morning":hh>=18&&hh<23?"Evening":"Hey";
    const old=p.age>=55;const G1={hostile:["What.","Keep walking.","You've got a lot of nerve."],cold:[`${pn}.`,"Yeah?","Need something?"],neutral:old?[`${tt}.`,`${tt}, ${pn}.`,"Well, hello."]:[`${tt}.`,`Hey, ${pn}.`,"Hey."],friendly:old?[`Well, look who it is.`,`${tt}, ${pn}. Good to see you in one piece.`,"There you are."]:[`Hey, ${pn}! Good to see you in one piece.`,"There you are.",`${tt}, ${pn}.`],close:p.style==="folksy"&&pl.age<=p.age-15?[`Come here, ${petName(p)}. *hugs you* Don't scare me like that.`,`There you are, ${petName(p)}.`]:[`${pn}! *hugs you* Don't scare me like that again.`,"Hey, you.","There's my favorite person."]}[t];
    say(pick(G1));if(p.want&&feel(p)>-10&&rf()<.8){out.push(`Listen... ${p.want.text}`);p.want.told=true;R.ask="help";R.facts=true}else if(t!=="hostile"&&rf()<.35){R.ask=pick(["okay","town"]);out.push(R.ask==="okay"?"You doing alright?":"You been into town?")}return finish(p,R,out)}
  // fallback
  if(p.want&&rf()<.5){say(`I don't know about that. But listen... ${p.want.text}`);p.want.told=true;R.ask="help";R.facts=true;return finish(p,R,out)}
  say(pick([`I'm not sure what you mean.`,`Hm. ${p.tr.curious>.6?"Tell me more.":"If you say so."}`,`I don't know anything about that.`,`*shrugs*`,`${p.tr.social>.6?"Funny you'd ask me that.":"..."} Ask me something I can actually answer.`]));
  return finish(p,R,out)}
function toYou(x){const pn=S.player.name.split(" ")[0];return x.replace(new RegExp("\\b"+pn+"'s\\b","g"),"your").replace(new RegExp("\\b"+pn+"\\b","g"),"you").replace(/^you\b/,"You").replace(/\bthey were\b/g,"you were").replace(/\bthey are\b/g,"you are")}
function finish(p,R,out){R.text=out.map(s=>styleSay(p,s)).join(" ");if(R.ask&&!p.cv)p.cv={};if(R.ask)p.cv.q=R.ask;return R}

// ================= talking: apply =================
function applyTalk(p,r){const pl=S.player;p.chat.push({w:"them",x:r.text});if(p.chat.length>60)p.chat.splice(0,p.chat.length-60);
  p.trust=clamp(p.trust+r.dt*(1+pl.sk.speak*.03),-100,100);p.aff=clamp(p.aff+r.da,-100,100);if(r.memory)mem(p,r.memory,r.mv||0);skillUp("speak",.02);
  const note=x=>p.chat.push({w:"sys",x});const a=r.action||"";
  if(a.startsWith("note:"))note(a.slice(5));
  if(a==="follow"){p.follow=true;p.plan=null;if(p.cv)p.cv.q=null;note(`${p.name} is following you.`);bringAlong(p,note)}
  if(a.startsWith("bond:"))setTimeout(()=>{if(UI.talkTo===p.id)doBond(p,a.slice(5))},40);
  if(a==="stay"){p.follow=false;note(`${p.name} stops following you.`)}
  if(a==="trade")setTimeout(()=>openTrade(p.id),30);
  if(a==="attack"){const me=pl.sk.fight*8+(weapon()?ITEMS[weapon().id].dmg*3:0)+rnd(0,50),them=p.sk.fight*10+rnd(0,50);if(me>=them){p.health-=rnd(8,20);note(`${p.name} swings at you. You put them on the ground.`)}else{const armed=Object.keys(p.pack||{}).some(k=>ITEMS[k]&&ITEMS[k].tool==="knife");const w=hurtPlayer(rnd(6,16),armed?"knife":"fight");note(`${p.name} ${armed?"comes at you with a blade":"swings at you"} and lands it.${w?" "+hitLine(w):""}`)}for(const q of living())if(dist(q.x,q.z,pl.x,pl.z)<10&&q!==p)q.trust-=2}
  if(a==="romance_yes"){p.partner="you";pl.partner=p.id;note(`You and ${p.name} are together now.`);news(`${pl.name} and ${fullName(p)} are together.`,"good",[p.id])}
  if(a==="child_yes"){if((pl.sex==="F"&&p.sex==="M")||(pl.sex==="M"&&p.sex==="F")){pl.trying=true;note(`You and ${p.name} are trying for a child.`)}else note(`You talk about raising a child together. If a child ever loses their parents, you could take them in.`)}
  if(a==="break_up"){pl.partner=null;p.partner=null;pl.trying=false;note(`You and ${p.name} are no longer together.`);news(`${pl.name} and ${p.name} split up.`,"",[p.id])}
  if(a==="join_their"){const g=G(p.group);const old=pl.group;if(old&&G(old)?.leader==="you"){for(const q of members(old))joinGroup(q,g.id,true);G(old).dead=true;news(`${G(old).name} has merged into ${g.name}.`,"big")}
    pl.group=g.id;for(const q of S.people.filter(q=>q.alive&&q.follow&&!q.group))joinGroup(q,g.id,true);for(const q of members(g.id))if(q.met)q.trust+=3;note(`You're part of ${g.name} now.`);journal(`You joined ${groupAt(g)}.`,"big");news(`${pl.name} joined ${g.name}.`,"")}
  if(a==="join_mine"){let g=myGroup();if(!g){g=newGroup(`${pl.name.split(" ")[0]}'s people`,"you",null);pl.group=g.id;for(const q of S.people.filter(q=>q.alive&&q.follow&&!q.group&&q.id!==p.id))joinGroup(q,g.id,true);UI.afterTalkModal={type:"name_group"};news(`${pl.name} has started a group of their own.`,"big")}
    const fam=S.people.filter(q=>q.alive&&q.hh===p.hh&&q!==p&&q.hh&&q.hh!=="you"&&(q.group===p.group));joinGroup(p,g.id,true);if(!g.home)p.follow=true;for(const q of fam){joinGroup(q,g.id,true);if(!g.home)q.follow=true}
    note(`${p.name}${fam.length?` and ${fam.length} family member${fam.length>1?"s":""}`:""} joined ${g.name}.`);journal(`${p.name} joined your group${fam.length?", with family":""}.`,"good");if(g.home)for(const q of [p,...fam])placeTo(q,randIn(g.home,3))}
  if(a==="leave_mine"){const old=myGroup();pl.group=null;for(const q of S.people.filter(q=>q.alive&&q.fam.you&&q.group===old.id)){q.group=null;q.follow=true}note(`You left ${old.name}.`);journal(`You walked away from ${old.name}.`,"big")}
  if(a==="take_lead"){const g=G(p.group);g.leader="you";news(`${p.name} handed leadership of ${g.name} to ${pl.name}.`,"big");note(`You lead ${g.name} now.`)}
  if(a.startsWith("reunite:")){const q=P(a.slice(8));if(q&&q.alive){const tg=q.group||p.group;if(tg&&q.group!==p.group){const mover=q.group?p:q;joinGroup(mover,tg,true);if(G(tg).home)placeTo(mover,randIn(G(tg).home,3));news(`${fullName(p)} and ${q.name} found each other again, thanks to ${pl.name}.`,"good",[p.id,q.id])}relAdd(p,q,15)}}
  if(a==="end")note(`${p.name} turns back to what ${p.age<13?"they were":p.sex==="F"?"she was":"he was"} doing.`);
  if(UI.afterTalkModal&&!UI.modal){UI.modal=UI.afterTalkModal;UI.afterTalkModal=null}}

// ================= overheard conversations =================
function overhear(a,b){const r=relGet(a,b);const L=[];const s=(p,t)=>L.push(`${p.name}: ${styleSay(p,t)}`);
  const shared=a.mem.filter(m=>m.v<=-8&&m.a!=="you"&&b.mem.some(n=>n.a===m.a)).slice(-1)[0];
  if(a.age<13&&b.age<13){pick([()=>{s(a,"Do you think the monsters can swim?");s(b,"No. They'd sink. They're too heavy with dead.");s(a,"That's not how it works.");s(b,"You don't know how it works.")},
    ()=>{s(a,"I'm gonna be a soldier when I grow up. And kill all of them.");s(b,"I'm gonna be a vet. For dogs.");s(a,"Dogs don't need a vet anymore.");s(b,"Yes they do! *shoves you*")},
    ()=>{s(a,"Do you remember what pizza tastes like?");s(b,"Pepperoni.");s(a,"That's not a taste, that's a kind.");s(b,"It tastes like pepperoni, duh.")}])();return L}
  const teen=x=>x.age>=13&&x.age<18;
  if(teen(a)&&teen(b)){pick([()=>{s(a,"Do you think there's ever gonna be school again?");s(b,"God, I hope not.");s(a,"...I kind of miss it. Is that weird?");s(b,"Yeah. ...No. I miss it too.")},
    ()=>{s(a,"My phone's been dead for a week and I still reach for it.");s(b,"Same. I had like four hundred unread messages.");s(a,"From who?");s(b,"*quiet* ...Doesn't matter now.")},
    ()=>{s(a,"What do you think the adults are actually doing?");s(b,"Making it up. Same as us.");s(a,"That's not comforting.");s(b,"Wasn't supposed to be.")}])();return L}
  const little=a.age<13?a:b.age<13?b:null;if(little){const big=little===a?b:a;s(little,pick(["When can we go home?","Are the monsters gonna come here?","I'm hungry.","Can I sleep next to you tonight?"]));s(big,big.age<18?pick(["I don't know. Soon, maybe.","They won't. I won't let them.","Here. *hands over a cracker* Don't tell anyone."]):pick(["Soon, bud. I promise.","Not while I'm here.","I know. Me too. We'll find something."]));s(little,pick(["You said that yesterday.","Promise promise?","Okay."]));return L}
  if(a.partner===b.id){s(a,pick(["You sleep at all?","Come here. You're freezing.","I keep thinking about the house."]));s(b,pick(["A little. You?","I'm fine. Stop worrying.","We'll get a house again. A better one."]));s(a,"Promise me we stay together. Whatever happens.");s(b,"*takes their hand* Whatever happens.");return L}
  if(shared){const who=P(shared.a);s(a,`I keep thinking about ${who?who.name:"them"}.`);s(b,"Me too. Every time I close my eyes.");s(a,pick(["They didn't deserve that.","It should've been me.","Do you think they knew it was us at the end?"]));s(b,"*long silence* ...Get some sleep. I'll take your watch.");return L}
  if(r<-30){s(a,pick([`You took the last of the coffee again.`,`You were supposed to be on watch.`,`I saw you skimming from the store.`]));s(b,pick(["Prove it.","So report me.","Mind your own business for once."]));s(a,"One of these days, somebody's going to get hurt because of you.");s(b,"Is that a threat?");return L}
  const g=a.group?G(a.group):null;const L2=g&&g.leader!==a.id&&g.leader!=="you"?P(g.leader):null;
  const topics=[()=>{s(a,`What did you do, before?`);s(b,`${JOBS[b.job].n}. ${b.facts.bio?"":"Feels like a hundred years ago."}`);s(a,`I was a ${JOBS[a.job].n.toLowerCase()}. I hated it. I'd kill to go back.`);s(b,"*laughs* Wouldn't we all.")},
    ()=>{s(a,`What do you miss most?`);s(b,cap(b.facts.likes)+".");s(a,`For me it's ${a.facts.likes}.`);s(b,"Maybe we find some on the next run.")},
    ()=>{const n=S.news.find(n=>S.t-n.t<DAY*2);s(a,`Did you hear? ${n?n.x:"The radio's dead."}`);s(b,pick(["God help us.","Figures.","Doesn't surprise me.","I heard something different."]));s(a,"You think we're next?");s(b,pick(["Not if I can help it.","Everybody's next, eventually.","Don't say that."]))},
    ()=>{if(L2){const f=relGet(a,L2);s(a,`What do you make of ${L2.name}?`);s(b,relGet(b,L2)>20?"They're keeping us alive. That's enough for me.":"They're in over their head.");s(a,f>20?"I trust them.":"I'm not sure I do.")}else{s(a,"Who do you think's really in charge around here?");s(b,"Whoever has the food.")}},
    ()=>{s(a,`You ever think about ${S.player.name}?`);const f=feel(b);s(b,f>30?`I like them. They've got a good head.`:f<-20?`I don't trust them.`:`Don't know them well.`);s(a,feel(a)>30?"Same. I'd follow them.":"We'll see.")},
    ()=>{s(a,`What scares you most? Really.`);s(b,cap(b.facts.fear)+".");s(a,`Me, it's ${a.facts.fear}.`);s(b,"...We should stop talking about this.")}];
  pick(topics)();return L}

// ================= events (cards) =================
function queueEvent(id,loc,until,data={}){if(S.pending.some(e=>e.id===id))return;S.pending.push({id,loc,until,data})}
function checkPending(){if(!S||S.player.coma)return;for(const e of [...S.pending]){if(S.t>e.until){S.pending=S.pending.filter(x=>x!==e);const ev=EVENTS[e.id];if(ev.auto){const txt=ev.auto(e.data);if(txt)news(txt,"big")}}}
  if(!UI.modal&&!UI.inChoice){const r=here();const e=S.pending.find(e=>e.loc==="any"||e.loc===r);if(e&&e.until>=S.t&&(e.at||0)<=S.t){S.pending=S.pending.filter(x=>x!==e);UI.modal={type:"event",id:e.id,data:e.data};render()}}}
function speakCheck(d){return S.player.sk.speak*12+rnd(0,60)>=d}
function fightCheck(d){return S.player.sk.fight*8+(weapon()?ITEMS[weapon().id].dmg*3:0)+armor()*2+rnd(0,60)>=d}

      {t:"Stay out and see what's happening",go:()=>"You stay where you are and watch. People run past. Somebody is crying somewhere you can't see. The man with the dark shirt turns his head toward you, slowly, like he heard his name."},

  lead_offer:{title:"They're Asking for You",text:d=>`A few people find you after supper. "We've been talking. People listen to you. People trust you. ${fullName(P(G(d.gid).leader)||S.player)} has had their turn. Will you lead ${G(d.gid).name}?"`,
    choices:[{t:"Yes. I'll lead",go:d=>{const g=G(d.gid);const old=P(g.leader);g.leader="you";if(old){old.trust-=20;mem(old,`${S.player.name} took ${g.name} from me.`,-10)}news(`${S.player.name} now leads ${g.name}.`,"big");return"It's not a ceremony. It's just everyone looking at you a little differently. The group's orders and building plans are yours now (Group tab)."}},

      {t:"Walk out and talk",go:d=>{if(speakCheck(70)){G(d.att).rel[S.player.group]=-10;return`You walk out with your hands up and talk until your throat hurts. They take ten cans and leave. Nobody dies tonight.`}return resolveRaid(G(d.att),myGroup(),d.pow,defense(S.player.group)-5,false)}}],

// ================= you and the people around you: pull, company, closeness =================
// How much a word from you moves someone depends on how scared they are, how alone, how hungry, what they think of you,
// what you can offer, and who else they'd be leaving. In the first days of the outbreak most people will walk with anyone.

// ---------- will they come with you ----------
function pull(p,msg){const pl=S.player;const F=S.flags;const g=p.group?G(p.group):null;msg=msg||"";
  let s=feel(p)*.6+pl.sk.speak*3;
  if(!F.clinic)s-=45;else if(!F.alarm)s-=18+(p.seen&&S.t-p.seen<120?-14:0);
  else s+=Math.min(30,(p.fear||0)*.35)+(dayOf(S.t)<=3?8:2);
  if(p.seen&&S.t-p.seen<90)s+=10;
  const mates=S.people.filter(q=>q!==p&&q.alive&&q.home===p.home&&!q.group&&q.age>=16&&dist(q.x,q.z,p.x,p.z)<12);if(!mates.length)s+=10;
  const b=bldAt(p.x,p.z);if(!b||b.id!==p.home)s+=6;
  if(typeof weapon==="function"&&weapon())s+=6;
  const fol=(W3.followers||[]).length;s+=fol<=4?fol*3:12-(fol-4)*3; // safety in numbers, until it's a crowd
  const myG=myGroup();if(myG&&myG.home)s+=8;
  s+=(1-p.tr.ambit)*12+p.tr.social*6-(p.tr.brave>.75?6:0);
  if(p.hunger<35||(p.thirst??85)<35)s+=8;if(p.health<50)s+=6;
  if(g)s-=28+(g.leader!=="you"&&P(g.leader)?Math.max(0,relGet(p,P(g.leader)))/3:0)+members(g.id).filter(q=>relGet(p,q)>40).length*3;
  if(p.cv&&p.cv.q==="come")s+=30; // they asked you first
  // the reason you give, if it's one they need
  if(/\b(safe|safer|protect|look after|keep you)\b/.test(msg))s+=5+(p.fear||0)*.08;
  if(/\b(food|eat|water|supplies)\b/.test(msg)&&(p.hunger<55||(p.thirst??85)<55))s+=9;
  if(/\b(together|alone|by yourself|on your own|out here)\b/.test(msg))s+=mates.length?3:8;
  if(/\b(please|trust me|i promise|i swear)\b/.test(msg))s+=3;
  if(/\b(camp|group|people|church|school|farm)\b/.test(msg)&&myG&&myG.home)s+=5;
  return s}
// what they say when you ask them to come with you
function comeWith(p,msg,g,same){const F=S.flags;const kid=p.age<13;const fm=F.alarm?famMissing(p,{alarm:true,d:dayOf(S.t)}):null;const fq=fm&&fm.q!==S.player?fm.q:null;
  if(p.fam.you&&p.fam.you!=="roommate"||same&&feel(p)>=-10)return{ok:true,line:pick(["Lead the way.","Right behind you.","Okay. Let's go."])};
  if(!F.clinic)return{ok:false,line:pick(["Come with you where? It's a Tuesday.","I've got things to do today. Maybe later."])};
  const pv=pull(p,msg);const helpFind=/\b(find|look for|search for|help you)\b/.test(msg);
  if(fq&&!helpFind&&pv<60){const rel=p.fam[fq.id]||"family";return{ok:false,line:pick([`Not until I find my ${rel}. ${fq.name} is out there somewhere.`,`I can't. My ${rel} ${fq.name}... I have to find them first.`,`Not without ${fq.name}. If you'd help me look, maybe.`])}}
  if(pv>=24){const withFam=S.people.some(q=>q!==p&&q.alive&&!q.group&&!q.follow&&q.hh&&q.hh===p.hh&&dist(q.x,q.z,p.x,p.z)<15);
    const line=kid?pick(["*takes your hand* Okay.","Okay. Can we find my mom after?","Are you a good guy? ...Okay. I'll come."])
      :fq&&helpFind?pick([`You'd help me find ${fq.name}? ...Okay. Okay. Let's go.`,`Then let's go. ${fq.name} first, if we can.`])
      :withFam?pick(["We'll come. All of us.","Only if my family comes too. ...Okay. Let's go."])
      :(p.fear||0)>60?pick(["Oh, thank God. Yes. Don't leave me behind.","I've been hiding in here for hours. Yes. Let's go.","Yes. Please. I can't do this by myself anymore."])
      :p.hunger<40||(p.thirst??85)<40?pick(["If you know where there's food, I'm with you.","I haven't had water since yesterday. I'll follow you anywhere that has some."])
      :!F.alarm?pick(["After what happened at the hospital? ...Yeah. I'll come.","Okay. Something's very wrong today. Let's stick together."])
      :pick(["Better than waiting for them to find me. Let's go.","Alright. I'm with you.","Lead the way.","Yeah. Two of us is better than one."]);
    return{ok:true,line}}
  if(g)return{ok:false,line:pick([`I've got people at ${PLACES[g.home]?.n||"camp"}. I can't just leave them.`,`${g.name} took me in. I'm not walking out on them.`])};
  if(!F.alarm)return{ok:false,line:pick(["Because of the hospital? I'm sure the police have it handled.","I think I'll wait until we know more."])};
  if(feel(p)<-20)return{ok:false,line:pick(["With you? No.","I'd rather take my chances with them."])};
  if(p.tr.ambit>.7||p.tr.brave>.8)return{ok:false,line:pick(["I'm better off on my own.","I've got a plan of my own, thanks.","You go. I'll be fine."])};
  return{ok:false,line:pick(["I don't know you. Why would I follow you anywhere?","How do I know you won't get me killed?","Give me one good reason."])}}
// when someone agrees, the people who live with them come too

// frightened people near you ask to come along
function askAlong(){const pl=S.player;if(!S.flags.alarm||pl.alive===false||pl.coma||UI.talkTo||UI.modal)return;

// ---------- spending time together ----------
const BOND_ACTS=[
  {k:"hang",n:"Spend time",mins:45},{k:"meal",n:"Share a meal",mins:30},{k:"drink",n:"Share a drink",mins:40},{k:"cards",n:"Play cards",mins:60},
  {k:"comfort",n:"Comfort",mins:20},{k:"flirt",n:"Flirt",mins:10},{k:"date",n:"Ask them out",mins:90},{k:"together",n:"Ask to be together",mins:5},{k:"night",n:"Spend the night",mins:0}];
function adultsBoth(p){return S.player.age>=18&&p.age>=18}
function canRomance(p){const pl=S.player;return adultsBoth(p)&&!p.fam.you&&(!p.partner||p.partner==="you")&&(!pl.partner||pl.partner===p.id)}
function recentLoss(p){return p.mem.some(m=>m.v<=-8&&S.t-m.t<DAY*3&&m.a!=="you")}
function mealItem(){const inv=invMap();return Object.keys(inv).filter(k=>ITEMS[k].eat&&!ITEMS[k].eat.sick).sort((a,b)=>ITEMS[b].eat.food-ITEMS[a].eat.food)[0]||null}

  switch(k){case"hang":return true;case"meal":return!!mealItem();case"drink":return adultsBoth(p)&&(invHas("whiskey")||packHas(p,"whiskey"));
    case"cards":return p.age>=7&&(invHas("cards")||packHas(p,"cards"));case"comfort":return p.mood<45||recentLoss(p);
    case"flirt":return canRomance(p)&&p.partner!=="you";case"date":return canRomance(p)&&(p.rom||0)>=30&&p.partner!=="you";case"together":return canRomance(p)&&(p.rom||0)>=55&&p.partner!=="you";
    case"night":return p.partner==="you"&&adultsBoth(p)&&(hourOf(S.t)>=20||hourOf(S.t)<4)}return false}
// how close you are, in a word

  if((p.rom||0)>=55)return"More than friends";if((p.rom||0)>=30)return"Something there";if(f>=55)return"Close friend";if(f>=25)return"Friend";if(f<=-45)return"Enemy";if(f<=-15)return"Doesn't like you";return p.met?"Acquaintance":"Stranger"}

function onBondAct(a,v){if(a!=="bond")return false;const p=P(UI.talkTo);if(p&&p.alive)doBond(p,v);return true}
function gain(p,k,base){const log=p.bondLog||(p.bondLog={});const rep=log[k]&&S.t-log[k]<DAY*.5?.35:1;log[k]=S.t;return(base+p.tr.social*3+(feel(p)>0?1.5:0)+rf()*3)*rep}
// something true about them that you didn't know yet
function opensUp(p){const pz=persona(p);const t=p.told||(p.told={});const opts=[];
  if(!t.from)opts.push(["from",p.facts.from.startsWith("right here")?(p.age<18?`I've lived in ${TOWN} my whole life. I used to think it was the most boring place on earth.`:`I've lived in ${TOWN} my whole life. Never even wanted to leave. Funny, now.`):p.age<18?`We moved here from ${p.facts.from} ${p.age<13?"when I was little. I don't remember it much.":"a couple years ago. I hated it here at first."}`:`I grew up in ${p.facts.from}. Moved here for ${pick(p.age<30?["work","a girl","a guy","cheap rent","my mom"]:["work","a girl","a guy","the quiet","cheap rent","my mother"])}.`]);

      else{line=feel(p)>=40&&!p.told?.secret?opensUp(p)||"Here's to whoever's still out there.":pick(["Here's to whoever's still out there.","*coughs* God, that's awful. Give it here."]);memo=[`Shared a bottle with ${pl.name}.`,3]}break}
    case"cards":{const win=rf()<.45+p.tr.curious*.2;dA=gain(p,k,4)+(kid?3:0);dT=dA*.5;p.mood=clamp(p.mood+8,0,100);p.soc=clamp((p.soc??60)+25,0,100);

    const spd=Math.min(6,f.moving);f.phase+=dt*(zed?2.4:spd>3.5?11:7.5)*(spd>.15?1:0);const amp=spd>.15?(zed?.32:spd>3.5?.75:.5):0;f.walk+=(amp-f.walk)*Math.min(1,dt*8);

function addCorpse(src,kind){const f=figFor(kind,src);f.lk=kind==="zed"?zedLook(src):lookOf(src);f.dead=true;f.lie=1;f.x=src.x;f.z=src.z;const old=FIGMAP.get(src.id);if(old)f.ang=old.ang;FIG.corpses.push({f,t:kind==="zed"?70:150})}

// ================= playing: walking, doors, the dead, fighting, the camera, light and the loop =================
const SKY={clear:"#9fb4c4",overcast:"#8a949c",rain:"#6f7a84",snow:"#b8c0c8",fog:"#9aa098"};
const HOMES=["house","farmhouse","trailer","cabin"];

// can a line between two points be seen along: walls, rock and closed doors block it
function losClear(ax,az,bx,bz){const d=dist(ax,az,bx,bz);if(d<.4)return true;const n=Math.ceil(d/.33);const c=COL.c;
  for(let i=1;i<n;i++){const t=i/n;const x=ax+(bx-ax)*t,z=az+(bz-az)*t;const L=COL.m.get(ckey(Math.floor(x/c),Math.floor(z/c)));if(!L)continue;
    for(const q of L){if(x<q.x0||x>q.x1||z<q.z0||z>q.z1)continue;if(q.k==="wall"||q.k==="rock")return false;if(q.k==="door"&&!q.d.open&&!q.d.broken)return false}}return true}
function zedNear(r){const pl=S.player;for(const z of S.zeds){if(Math.abs(z.x-pl.x)>r||Math.abs(z.z-pl.z)>r)continue;const d=dist(z.x,z.z,pl.x,pl.z);if(d<r&&(d<r*.45||losClear(z.x,z.z,pl.x,pl.z)))return true}return false}

// ---------- doors: open, shut, locked, boarded, broken ----------
function doorBld(D){return BMAP[D.b]}
function houseLocked(D){if(!D.ext||!S.flags.alarm)return false;const b=doorBld(D);if(!isHome(b)||b.id===S.player.home)return false;if((D.welcome||0)>S.t)return false;
  const g=S.player.group&&G(S.player.group);if(g&&b.site&&g.home===b.site)return false;return residentsHome(b).some(p=>p.age>=14)}

// door state lives in S.doors so it survives a reload; only what differs from how the building was built is kept
function doorsIn(){for(const D of DOORS){if(D.lock0===undefined)D.lock0=D.lock;const s=S.doors[D.id];D.open=s?!!s.o:!D.ext&&!D.lock0;D.lock=s&&"l" in s?s.l:D.lock0;D.bar=s?s.b||0:0;D.hp=s?s.h??100:100;D.broken=!!(s&&s.x);D.welcome=s?s.w||0:0;D.refused=s?s.r||0:0;D.auto=false}}
function doorSave(D){const def=!D.ext&&!D.lock0;const s={};if(!!D.open!==def)s.o=D.open?1:0;if(D.lock!==D.lock0)s.l=D.lock;if(D.bar)s.b=D.bar;if(D.hp!==100)s.h=Math.round(D.hp);if(D.broken)s.x=1;if(D.welcome>S.t)s.w=D.welcome;if(D.refused&&S.t-D.refused<240)s.r=D.refused;

function lockedMsg(D){const k=doorLocked(D);return k==="bar"?(playerSide(D)==="in"?"The door's boarded up. Press E to take the boards down.":"Someone boarded this door from the inside."):k==="home"?"Locked. Someone's home. You could knock.":hasTool("pry")?"Locked. Your crowbar could open it.":"Locked. You could kick it in, but it'll be loud."}
function useDoor(D){const pl=S.player;if(!D||pl.alive===false)return;const lk=doorLocked(D);

function kickDoor(D){const pl=S.player;if(W3.cd>0)return;W3.cd=.9;W3.swing=.2;pl.energy=Math.max(0,pl.energy-1.2);noise(D.x,D.z,15);

// knocking on a door where people are home
function knock(b,D){const pl=S.player;const res=residentsHome(b);if(!res.length){toast("Nobody answers.");return}
  const head=res.filter(p=>p.age>=16).sort((a,c)=>feel(c)-feel(a))[0]||res[0];

    bubble(p,styleSay(p,pick(S.flags.alarm?["Whoa, whoa. Who let you in?","Get out of my house.","Are you bit? Stay back."]:["Uh, hello? Can I help you?","This is my house.","Did you knock?"])))}}

// ---------- timed things you do with your hands ----------

// ---------- noise draws the dead ----------
function noise(x,z,r){for(const zd of S.zeds){if(zd.st==="chase")continue;if(Math.abs(zd.x-x)>r||Math.abs(zd.z-z)>r)continue;const d=dist(zd.x,zd.z,x,z);if(d>r)continue;if(d>r*.5&&!losClear(zd.x,zd.z,x,z))continue;

// ---------- walking along a path of waypoints ----------
// returns 2 when the path is done, 1 after a step, 0 when blocked
function walkAlong(e,path,st,s,who,r){while(st.pi<path.length){const w=path[st.pi];const dx=w.x-e.x,dz=w.z-e.z,l=Math.hypot(dx,dz);const last=st.pi===path.length-1;

function cancelWalk(){W3.ptarget=null;W3.path=null;W3.talkOnArrive=null;W3.attackT=null;W3.useOnArrive=null}
function walkTo(x,z,keep){if(!keep){W3.talkOnArrive=null;W3.attackT=null;W3.useOnArrive=null}const pl=S.player;x=clamp(x,WB.x0+1,WB.x1-1);z=clamp(z,WB.z0+1,WB.z1-1);
  W3.ptarget={x,z};W3.path=navPath(pl.x,pl.z,x,z);W3.pst={pi:0};W3.repath=.6}

// ---------- townsfolk ----------
function moveNPCs(dt){const pl=S.player;const sp=1.45*Math.min(4,UI.speed);let idx=0;const now=performance.now();const near=[];const dead=S.flags.clinic;
  for(const p of S.people){if(!p.alive)continue;

  snapFollowers();cancelWalk()}

  if(!g){g=newGroup(`${pl.name.split(" ")[0]}'s people`,"you",null);pl.group=g.id;for(const q of S.people.filter(isFollower))joinGroup(q,g.id,true);news(`${pl.name} has started a group of their own.`,"big");UI.afterSettle=true}
  if(g.leader!=="you")return;g.home=k;for(const p of members(g.id)){p.follow=false;placeTo(p,randIn(k,3))}assignRoles(g);
  news(`${g.name} has settled at ${PLACES[k].n}.`,"big");journal(`You've claimed ${PLACES[k].n} for ${g.name}. Plan what gets built from the Group panel.`,"big");UI.panel="group";if(UI.afterSettle){UI.afterSettle=false;UI.modal={type:"name_group"}}}
function listenIn(){const ps=nearPeople(10).filter(p=>p.age>=6&&!isFollower(p));if(ps.length<2)return;const a=pick(ps);const rest=ps.filter(q=>q!==a);const b=rest.find(q=>a.partner===q.id)||rest.sort((x,y)=>Math.abs(relGet(a,y))-Math.abs(relGet(a,x)))[0];
  const lines=overhear(a,b);advance(10);UI.modal={type:"result",title:"Overheard",text:lines.join("\n")};save();render()}

function adopt(pid){const p=P(pid);const pl=S.player;if(!p||!orphan(p))return;pl.kids.push(p.id);p.parents.push("you");p.fam.you="guardian";pl.fam[p.id]="kid";p.trust=clamp(p.trust+25,-100,100);p.aff=clamp(p.aff+30,-100,100);
  mem(p,`${pl.name} said I could stay with them. For good.`,10);if(pl.group){if(p.group!==pl.group)joinGroup(p,pl.group,true)}else{p.group=null;p.follow=true}
  news(`${pl.name} took in ${p.name}.`,"good",[p.id]);journal(`${p.name} is yours to look after now. ${p.age<10?"They hold your hand and don't let go.":"They pretend not to care. They care."}`,"big")}

function canCraft(r){for(const [k,v] of Object.entries(r.need))if(!invHas(k,v))return`Missing ${ITEMS[k].n.toLowerCase()}`;if(r.tool&&!hasTool(r.tool))return`Needs a ${r.tool}`;if(r.at==="fire"&&!nearFire())return"Needs a fire";return true}
function craft(id){const r=RECIPES.find(x=>(x.key||x.id)===id);if(!r||canCraft(r)!==true)return;for(const [k,v] of Object.entries(r.need))invTake(k,v);act(r.h*60,{work:true});invAdd(r.id);skillUp("craft",.1);journal(r.key==="boil_bandage"?"You boil the bandage in a can over the fire and hang it to dry. Clean enough.":`You make: ${ITEMS[r.id].n.toLowerCase()}.`,"good");save();render()}
function gearStats(id){const it=ITEMS[id];const s=[];if(it.dmg)s.push(`damage ${it.dmg}`);if(it.gun)s.push("loud");if(it.reach)s.push("long reach");if(it.warm)s.push(`warmth ${it.warm}`);if(it.armor)s.push(`armor ${it.armor}`);if(it.grid)s.push(`holds ${it.grid[0]}×${it.grid[1]}`);return s.join(" · ")}
function craftHtml(){const fire=nearFire();return `<p class="mute">Making things takes time. Some recipes need a tool or a fire.${fire?' <span class="pos">There\'s a fire here.</span>':""}</p><div class="cards">${RECIPES.map(r=>{const it=ITEMS[r.id];const ok=canCraft(r);
  return `<div class="card"><div class="row">${typeof itemIcon==="function"?itemIcon(r.id,32):""}<b>${esc(r.verb||it.n)}</b></div><div class="mono mute">${Object.entries(r.need).map(([k,v])=>`${esc(ITEMS[k].n)} ×${v}`).join(", ")}${r.tool?` · a ${r.tool}`:""}${r.at?" · a fire":""} · ${r.h<1?Math.round(r.h*60)+" min":r.h+" h"}</div>${gearStats(r.id)?`<div class="mono mute">${gearStats(r.id)}</div>`:""}<button class="btn${ok===true?" pri":""}" data-act="craft" data-v="${r.key||r.id}"${ok===true?"":" disabled"}>Make it<small>${ok===true?"Ready":esc(ok)}</small></button></div>`}).join("")}</div>`}

function drawBigMap(){const c=$("bigmap");if(!c)return;const r=c.getBoundingClientRect();if(r.width<10)return;const dpr=Math.min(2,devicePixelRatio||1);const w=Math.round(r.width*dpr),h=Math.round(r.width/((WB.x1-WB.x0)/(WB.z1-WB.z0))*dpr);if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;c.style.height=(h/dpr)+"px";drawMap(c,{big:true,dpr})}

function wantSummary(p){const w=p.want;if(!w)return"";if(w.type==="fetch")return `Bring ${w.qty>1?w.qty+" × ":""}${ITEMS[w.item].n.toLowerCase()}.`;if(w.type==="find")return `Find their ${p.fam[w.about]||"family"}, ${P(w.about)?.name||"someone"}, and tell them where ${p.name} is.`;if(w.type==="mercy")return `Put their ${p.fam[w.about]||"loved one"}, ${P(w.about)?.name||"someone"}, to rest.`;return w.text}
function peopleHtml(){const f=UI.peopleFilter;

  ${UI.peopleSel&&P(UI.peopleSel)?profileHtml(P(UI.peopleSel)):""}<div id="plist">${peopleListHtml()}</div>`}

function profileHtml(p){const pl=S.player;const kn=pKnown(p);const g=kn&&p.group?G(p.group):null;const fam=famList(p).filter(([q])=>q.id!=="you");const mems=p.mem.filter(m=>m.a==="you"&&(kn||m.d<=1)).slice(-5).reverse();const open=feel(p)>25||p.fam.you;
  const sees=p.alive&&kn&&(isFollower(p)||(p.pseen||-1e9)>=S.t-10);const needs=[(p.hunger??80)<30&&"hungry",(p.thirst??80)<30&&"thirsty",(p.rest??80)<25&&"worn out",(p.fear||0)>60&&"scared",(p.health??100)<50&&"hurt"].filter(Boolean);
  const meter=(n,v)=>`<div class="meter"><span>${n}</span><div class="track"><i style="left:${v<0?50+v/2:50}%;width:${Math.abs(v)/2}%;background:${v<0?"var(--blood)":"var(--lichen)"}"></i></div><span>${Math.round(v)}</span></div>`;
  return `<div class="card profile"><div class="row" style="justify-content:space-between"><div><h3>${esc(fullName(p))}</h3><div class="mono mute">${p.age} · ${esc(JOBS[p.job]?.n||"")}${g?` · ${esc(g.name)}${p.role?" ("+esc(ROLES[p.role].n.toLowerCase())+")":""}`:""}${!kn?" · not seen since you woke":p.alive?"":" · "+esc(p.status==="turned"?"turned":p.status==="left"?"left town":"dead")}</div></div><button class="x" data-act="person" data-v="" aria-label="Close profile">×</button></div>

function siteHtml(g,lead){const k=g.home;const s=S.sites[k];const ss=PLACES[k].site;const sel=UI.buildSel;

function deposit(k){const g=myGroup();if(!g||!atHome())return;const n=invCount(k);if(!n||!DEPOSIT[k])return;const [s,m]=DEPOSIT[k];g.stock[s]+=n*m;invTake(k,n);const val=n*ITEMS[k].v;
  for(const p of shuffle(members(g.id).filter(p=>p.age>=12&&dist(p.x,p.z,S.player.x,S.player.z)<25)).slice(0,3)){p.trust=clamp(p.trust+Math.min(3,val/15),-100,100);if(val>=20&&rf()<.5)mem(p,`${S.player.name} brought supplies back for everyone.`,3)}
  journal(`You put ${ITEMS[k].n.toLowerCase()}${n>1?" ×"+n:""} in the stores.`)}
function withdraw(k){const g=myGroup();if(!g||!atHome())return;const [it,c]=WITHDRAW[k];if(g.stock[k]<c)return;g.stock[k]-=c;invAdd(it,1);
  if(g.leader!=="you"&&(k==="food"||k==="meds")&&g.stock[k]<groupSize(g.id)*1.5)for(const p of shuffle(members(g.id).filter(p=>p.age>=12)).slice(0,2)){p.trust=clamp(p.trust-3,-100,100);mem(p,`${S.player.name} took from the stores when we were short.`,-3)}}
function tileClick(i){const g=myGroup();if(!g||!g.home)return;const s=S.sites[g.home];const sel=UI.buildSel;const empty=!s.grid[i]&&!s.build.some(x=>x.tile===i);
  if(sel&&empty){const d=BLD[sel];const lead=g.leader==="you";
    if(lead){if(!canAfford(g,d.cost)){toast(`Not enough in the stores for a ${d.n.toLowerCase()}.`);return}startSite(g,sel,i,"you");assignRoles(g);journal(`You mark out a lot for a ${d.n.toLowerCase()}. ${members(g.id).some(p=>p.role==="builder")?"The builders will get to it.":"Someone needs to build it. You could help."}`)}
    else{if(!d.own)return;if(!Object.entries(d.cost).every(([kk,v])=>invHas(kk,v))){toast("You don't have the materials.");return}for(const [kk,v] of Object.entries(d.cost))invTake(kk,v);s.build.push({b:sel,tile:i,prog:0,by:"you"});journal("You start on a shelter of your own. The builders say they'll help when they can.")}

function demolish(i){const g=myGroup();if(!g||g.leader!=="you")return;const s=S.sites[g.home];const c=s.grid[i];if(!c)return;for(const [k,v] of Object.entries(BLD[c.b].cost))g.stock[k]+=Math.floor(v/2);s.grid[i]=null;if(S.player.hutTile&&S.player.hutTile.site===g.home&&S.player.hutTile.tile===i)S.player.hutTile=null;UI.tileSel=null;journal(`You have the ${BLD[c.b].n.toLowerCase()} torn down.`)}
function cancelBuild(i){const g=myGroup();if(!g||g.leader!=="you")return;const s=S.sites[g.home];const b=s.build.find(x=>x.tile===i);if(!b)return;for(const [k,v] of Object.entries(BLD[b.b].cost))g.stock[k]+=v;s.build=s.build.filter(x=>x!==b);UI.tileSel=null}
function kick(pid){const p=P(pid);const g=myGroup();if(!p||!g||g.leader!=="you")return;const fam=members(g.id).filter(q=>q.hh===p.hh&&q.hh&&q!==p&&q.hh!=="you");
  for(const q of [p,...fam]){q.group=null;q.role=null;q.follow=false;placeTo(q,randIn("town",3));q.trust=clamp(q.trust-30,-100,100);q.aff=clamp(q.aff-20,-100,100);mem(q,`${S.player.name} threw me out of ${g.name}.`,-12)}
  for(const q of members(g.id))if(relGet(q,p)>40){q.trust=clamp(q.trust-6,-100,100);mem(q,`${S.player.name} threw ${p.name} out.`,-4,p.id)}
  news(`${S.player.name} threw ${fullName(p)}${fam.length?" and their family":""} out of ${g.name}.`,"bad",[p.id]);journal(`You sent ${p.name} away.`,"bad")}
function leaveGroup(){const g=myGroup();if(!g)return;const pl=S.player;const wasLead=g.leader==="you";pl.group=null;
  for(const q of S.people.filter(q=>q.alive&&q.fam.you&&q.group===g.id)){q.group=null;q.role=null;q.follow=true}
  for(const q of members(g.id)){q.trust=clamp(q.trust-4,-100,100);mem(q,`${pl.name} left ${g.name}.`,-3)}
  if(wasLead){if(members(g.id).some(p=>p.age>=16))newLeader(g.id);else g.leader=null}
  journal(`You walked away from ${g.name}.`,"big");news(`${pl.name} left ${g.name}.`,"")}
function setRole(pid,r){const p=P(pid);if(!p||!ROLES[r])return;p.role=r;p.roleSet=true;save()}
function setPol(k,v){const g=myGroup();if(!g||g.leader!=="you")return;const old=g.pol[k];g.pol[k]=v;
  if(k==="ration"&&v==="half"&&old!=="half"){for(const p of members(g.id)){p.mood-=3;p.trust=clamp(p.trust-1,-100,100)}news(`${g.name} is on half rations.`,"")}
  if(k==="stance"&&v==="hostile"&&old!=="hostile"){for(const p of members(g.id))if(p.tr.kind>.65){p.trust=clamp(p.trust-5,-100,100);mem(p,`${S.player.name} wants us to take what we need from other people. I didn't sign up for that.`,-5)}for(const o of Object.values(S.groups))if(o.id!==g.id){o.rel[g.id]=(o.rel[g.id]||0)-5;g.rel[o.id]=(g.rel[o.id]||0)-5}}
  if(k==="stance"&&v==="friendly"&&old!=="friendly")for(const p of members(g.id))if(p.tr.kind>.6)p.trust=clamp(p.trust+2,-100,100);
  save();render()}

const QUICK=["How are you holding up?","Who are you?","What do you need?","Come with me.","Can I join your group?","Heard any news?"];
// small talk to get them going; it changes as the day goes on, and it's only a start: type anything
const SMALLTALK=["What did you do before all this?","Where are you from?","What do you miss most?","What's on your mind?","Sleep at all last night?","Tell me about your family.","What scares you most?","What are you hoping for?","What's your favorite food?","How'd you make it this far?"];
const KIDTALK=["Are you okay?","Where's your family?","What's your favorite animal?","Want to hear a joke?","Are you hungry?","What's your name?"];
const TEENTALK=["You doing okay?","What grade were you in?","What do you miss most?","What music do you like?","How'd you make it this far?","Where's your family?"];
function talkChips(p){const q=p.cv&&p.cv.q;if(q==="come")return["Yes. Stay close.","No. Not now.",...QUICK.slice(0,3)];if(q==="hang")return["Yes, I'll sit with you.","No, not now.",...QUICK.slice(0,3)];
  const out=[];if(q)out.push("Yes.","No.");const R=srng(hashStr(p.id+"/"+Math.floor(S.t/30)));
  out.push(!p.met?"Hi. Who are you?":p.age<13?"Hey, buddy. You okay?":"How are you holding up?");
  if(S.flags.wake&&S.t-S.flags.wake<DAY*2)out.push("What did I miss?");
  const pool=(p.age<13?KIDTALK:p.age<18?TEENTALK:SMALLTALK).filter(x=>!out.includes(x));for(let i=0;i<2&&pool.length;i++)out.push(pool.splice(Math.floor(R()*pool.length),1)[0]);
  if(p.met&&p.age>=13)out.push(p.want?"What do you need?":"Need anything?");
  if(p.follow)out.push("Wait here.");else if(p.age>=8&&p.met)out.push("Come with me.");
  const g=p.group&&G(p.group);if(g&&g.leader===p.id&&S.player.group!==g.id&&p.met)out.push("Can I join your group?");
  if(!(S.flags.wake&&S.t-S.flags.wake<DAY*2))out.push("Heard any news?");
  return out.slice(0,8)}
function openTalk(pid){const p=P(pid);if(!p||!p.alive)return;if(UI.panel&&UI.panel!=="inv")UI.panel=null;UI.talkTo=pid;UI.talkFresh=true;p.lastTalk=S.t;cancelWalk();
  const pl=S.player;W3.ang=Math.atan2(p.x-pl.x,p.z-pl.z);render();const box=$("talkbox");if(box&&matchMedia("(pointer:fine)").matches)box.focus({preventScroll:true})}
function closeTalk(quiet){if(!UI.talkTo)return false;if(typeof talkAbort==="function")talkAbort();UI.talkTo=null;UI.draft="";if(!quiet)render();else{const el=$("talk");if(el){el.hidden=true;el.innerHTML=""}}return true}
function talkHead(p){const g=p.group?G(p.group):null;return `<div class="who"><b>${esc(p.met?fullName(p):"A stranger")}</b><span class="mono mute">${p.age} · ${esc(p.met?JOBS[p.job]?.n||"":p.look||"")}${g?" · "+esc(g.name):""}${p.met?" · "+esc(relLabel(p)):""}${isFollower(p)?" · with you":""}</span></div>`}
function chatHtml(p){const L=p.chat.slice(-30);if(!L.length)return `<div class="msg sys">${p.met?`You know ${esc(p.name)}. Say something.`:"You haven't met. Say something."}</div>`;
  return L.map(m=>`<div class="msg ${m.w}${m.live?" live":""}">${esc(m.x)}${m.live&&!m.x?'<span class="dots"><i></i><i></i><i></i></span>':""}</div>`).join("")}
function renderTalk(){const el=$("talk");if(!el)return;const p=UI.talkTo?P(UI.talkTo):null;if(!p||!p.alive||S.player.alive===false||UI.modal&&UI.modal.type!=="trade"){if(UI.talkTo&&(!p||!p.alive))UI.talkTo=null;el.hidden=true;el.innerHTML="";return}
  const box=$("talkbox");const had=box&&document.activeElement===box;const sel=had?[box.selectionStart,box.selectionEnd]:null;
  const d=dist(p.x,p.z,S.player.x,S.player.z);const far=d>6&&!p.follow;const busy=!!UI.talkBusy;
  el.hidden=false;el.innerHTML=`<header>${talkHead(p)}<button class="x" data-act="endtalk" aria-label="Stop talking (Esc)">×</button></header>
  ${p.want&&p.met?`<div class="want"><span class="lbl">${esc(p.name)} asked you</span> ${esc(wantSummary(p))}</div>`:""}

  ${bondRow(p)}<div class="chips">${talkChips(p).map(q=>`<button class="chip" data-act="quick" data-v="${esc(q)}"${busy?" disabled":""}>${esc(q)}</button>`).join("")}</div>
  <footer><button class="tag" data-act="trade" data-v="${p.id}">Trade</button>${p.met?`<button class="tag" data-act="person" data-v="${p.id}">About ${esc(p.name)}</button>`:""}${typeof AI!=="undefined"&&AI.ns?`<button class="tag" id="aistate" data-act="aitoggle" title="${AI.on?"Switch to built-in lines (no Claude usage)":"Let Claude write what people say"}">${esc(aiStateText())}</button>`:""}</footer>`;

function renderTalkLog(){const p=UI.talkTo?P(UI.talkTo):null;const c=$("chat");if(!p||!c)return;const stick=c.scrollTop+c.clientHeight>=c.scrollHeight-30;c.innerHTML=chatHtml(p);if(stick)c.scrollTop=c.scrollHeight}
function positionTalk(force){const el=$("talk");const p=UI.talkTo?P(UI.talkTo):null;if(!el||el.hidden||!p||!W3.ok)return;const f=FIGMAP.get(p.id);const s=project(f?f.x:p.x,1.6*(f&&f.lk?f.lk.s:1),f?f.z:p.z);
  const W=innerWidth,H=innerHeight;const w=el.offsetWidth,h=el.offsetHeight;let x=s.x+34,y=s.y-h*.45;if(x+w>W-12)x=s.x-w-34;x=clamp(x,12,Math.max(12,W-w-12));y=clamp(y,64,Math.max(64,H-h-96));
  const k=Math.round(x)+","+Math.round(y);if(force||k!==UI.talkPos){UI.talkPos=k;el.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`}}

// ---------- trading ----------
function openTrade(pid){const p=P(pid);if(!p||!p.alive)return;if(dist(p.x,p.z,S.player.x,S.player.z)>6&&!p.follow){toast(`${p.met?p.name:"They"} can't trade from over there. Walk closer.`);return}UI.modal={type:"trade",pid,give:{},take:{}};render()}
function tradables(){const out={};const inv=invMap();for(const [k,n] of Object.entries(inv))if(ITEMS[k].v>0)out[k]=n;return out}
function valOf(k,p,mine){const it=ITEMS[k];if(!it)return 0;let v=it.v;if(p.want&&p.want.item===k)v*=mine?2:1.5;if(it.eat&&p.hunger<40)v*=mine?1.4:1.3;return v}
function tradeSums(){const m=UI.modal;const p=P(m.pid);let give=0,take=0;for(const [k,n] of Object.entries(m.give))give+=valOf(k,p,true)*n;for(const [k,n] of Object.entries(m.take))take+=valOf(k,p,false)*n;return{give,take}}
function tradeOk(){const {give,take}=tradeSums();const p=P(UI.modal.pid);const f=feel(p);const fair=f<-40?.7:f<0?.85:f<40?1:f<70?1.15:1.3;return take===0?give>0:give*fair>=take}
function tradeHtml(){const m=UI.modal;const p=P(m.pid);const mine=tradables();const theirs=Object.entries(p.pack||{}).filter(([k,n])=>n>0&&ITEMS[k]);const {give,take}=tradeSums();const ok=tradeOk();
  const row=(side,k,n,v)=>{const sel=m[side][k]||0;return `<tr><td>${typeof itemIcon==="function"?itemIcon(k,22):""} ${esc(ITEMS[k].n)} <span class="mute mono">×${n}</span></td><td class="num" title="Value">${Math.round(v)}</td><td class="qty"><button class="tag" data-act="tq" data-v="${side}|${k}|-1"${sel?"":" disabled"} aria-label="Less">−</button> <span class="mono">${sel}</span> <button class="tag" data-act="tq" data-v="${side}|${k}|1"${sel<n?"":" disabled"} aria-label="More">+</button></td></tr>`};
  return `<h2>Trade with ${esc(p.met?p.name:"a stranger")}</h2><p class="mute">${p.met?esc(p.name)+" "+tierWord(tier(p))+".":""} ${p.want&&p.want.type==="fetch"?`They asked you for ${esc(ITEMS[p.want.item].n.toLowerCase())}.`:""} Friends give better deals. What you get goes into your bags, or at your feet if there's no room.</p>
   <div class="fgrid"><div><div class="lbl">You give</div><div class="tscroll"><table><tbody>${Object.entries(mine).map(([k,n])=>row("give",k,n,valOf(k,p,true))).join("")||'<tr><td class="mute">Nothing to trade.</td></tr>'}</tbody></table></div></div>
   <div><div class="lbl">They give</div><div class="tscroll"><table><tbody>${theirs.map(([k,n])=>row("take",k,n,valOf(k,p,false))).join("")||'<tr><td class="mute">Nothing to spare.</td></tr>'}</tbody></table></div></div></div>
   <p class="mono">${give+take?`You give ${Math.round(give)} worth · you get ${Math.round(take)} worth · <span class="${ok?"pos":"neg"}">${take===0&&give>0?"a gift":ok?"they'd take this":"they want more"}</span>`:"Pick what to give and what you want back."}</p>
   <div class="row"><button class="btn pri" data-act="dotrade"${give+take>0?"":" disabled"}>${take===0?"Give it to them":"Offer the trade"}</button><button class="btn" data-act="closemodal">Never mind</button></div>`}
function doTrade(){const m=UI.modal;const p=P(m.pid);const pl=S.player;const {give,take}=tradeSums();
  if(!tradeOk()){p.chat.push({w:"them",x:styleSay(p,pick(["That's not a trade. That's robbery.","Add something and we'll talk.","No. Not for that."]))});toast(`${p.met?p.name:"They"} won't take that.`);render();return}
  const given={};for(const [k,n] of Object.entries(m.give)){const have=invCount(k);const q=Math.min(n,have);if(q<=0)continue;invTake(k,q);p.pack[k]=(p.pack[k]||0)+q;given[k]=(given[k]||0)+q}
  for(const [k,n] of Object.entries(m.take)){p.pack[k]=(p.pack[k]||0)-n;if(p.pack[k]<=0)delete p.pack[k];invAdd(k,n)}
  const names=Object.entries(given).map(([k,n])=>ITEMS[k].n.toLowerCase()+(n>1?" ×"+n:"")).join(", ");
  const w=p.want;if(w&&w.type==="fetch"&&(given[w.item]||0)>=w.qty){p.trust=clamp(p.trust+w.reward.trust,-100,100);p.aff=clamp(p.aff+w.reward.aff,-100,100);p.want=null;mem(p,`${pl.name} brought me ${ITEMS[w.item].n.toLowerCase()} when I needed it.`,8);
    p.chat.push({w:"them",x:styleSay(p,pick(["You actually did it. Thank you. I mean it.","*stares at it* I didn't think you'd come back. Thank you.","I owe you one. A real one."]))});
    const g=p.group?G(p.group):null;if(w.item==="antibiotics"&&g&&g.fever){g.feverCured=true;news(`${pl.name} brought antibiotics to ${g.name}. The fever's breaking.`,"good")}}
  else if(take===0){p.trust=clamp(p.trust+Math.min(10,give/3),-100,100);p.aff=clamp(p.aff+Math.min(12,give/2.5),-100,100);mem(p,`${pl.name} gave me ${names} and asked for nothing.`,Math.min(6,Math.round(give/4)));p.chat.push({w:"them",x:styleSay(p,pick(["For me? ...Thank you.","You don't have to do that. ...Thank you.","*turns it over in their hands* I won't forget this."]))})}
  else{p.trust=clamp(p.trust+1,-100,100);p.chat.push({w:"them",x:styleSay(p,pick(["Pleasure doing business.","Deal.","Fair enough."]))})}
  p.chat.push({w:"sys",x:take===0?`You gave ${names}.`:`You traded ${names||"nothing"} for ${Object.entries(m.take).map(([k,n])=>ITEMS[k].n.toLowerCase()+(n>1?" ×"+n:"")).join(", ")}.`});
  p.met=true;advance(5);UI.modal=null;UI.talkTo=p.id;save();render()}

function modalHtml(){const m=UI.modal;if(!m)return"";const wrap=(inner,label,cls="")=>`<div class="modal-bg"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${inner}</div></div>`;
  if(m.type==="event"){const ev=EVENTS[m.id];const text=typeof ev.text==="function"?ev.text(m.data):ev.text;
    if(ev.input)return wrap(`<h2>${esc(ev.title)}</h2><p>${esc(text)}</p><form class="row" data-form="${ev.input}"><input id="minput" maxlength="30" placeholder="A name" required aria-label="Name"><button class="btn pri" type="submit">That's the name</button></form>`,ev.title);

// the one line that tells you how to get better
function healAdvice(){const pl=S.player;const W=wounds();if(!W.length&&pl.hp>=95)return"";const ff=feedFactor();

// ---------- doing it: one click, a few minutes pass ----------
function doCare(k,w,item){if(!w||S.player.alive===false)return;if(zedNear(7)){toast("Not with the dead this close.");return}
  const where=w.at,name=woundName(w).toLowerCase();let it=null,mins=4,msg="";
  if(k==="wash"){it=washWound(w,item);if(!it){toast("You've nothing to wash it with. Even a bottle of water would do.");return}
    const harsh=it==="rubbing_alcohol"||it==="whiskey";msg=`You wash the ${name} on your ${where} with ${CLEANERS.find(x=>x[0]===it)[2]}. ${harsh?"It stings like fire, then settles.":"It's clean now."}`}
  if(k==="wrap"){const fr=w.k==="fracture";it=wrapWound(w,item);if(!it){toast(fr?"You need something to bind it with: a splint, a bandage, or cloth.":"You've nothing to wrap it with. A strip of cloth would do.");return}
    mins=fr?10:5;msg=fr?`You ${it==="splint"?"strap the splint along":"wrap your "+BODY[w.p].n+" tight with "+BINDS.find(x=>x[0]===it)[2]+", holding"} your ${fr&&it==="splint"?BODY[w.p].n:"the bone still"}. It holds.`
      :`You wrap ${DRESSINGS.find(x=>x[0]===it)[2]} around the ${name} on your ${where}.${w.bl>.03?" The bleeding slows to nothing.":""}`}
  if(k==="stitch"){it=stitchWound(w,item);if(!it){toast("Nothing here needs stitches.");return}mins=12;msg=`You sew the ${name} on your ${where} shut. Not pretty, but it's closed.`}
  journal(msg,"good");UI.hmsg={t:S.t+mins,x:msg};act(mins);save();render()}
function onHealthAct(a,v,el,e){if(!S)return false;
  switch(a){
    case"hpart":UI.hsel=v&&UI.hsel!==v?v:null;render();return true;
    case"hdo":{const [k,id]=v.split("|");doCare(k,woundById(+id));return true}
    case"htendall":{if(zedNear(7)){toast("Not with the dead this close.");return true}const r=tendAll();
      const list=r.did.length>1?r.did.slice(0,-1).join(", ")+(r.did.length>2?",":"")+" and "+r.did[r.did.length-1]:r.did[0];
      const msg=r.did.length?`You ${list}.${r.miss.length?` You ran out of what you'd need to ${r.miss.join(" or ")} the rest.`:""}`:`You don't have what you need to ${r.miss.join(" or ")||"do any more"}.`;
      journal(msg,r.did.length?"good":"");UI.hmsg={t:S.t+r.mins,x:msg};if(r.mins)act(r.mins);save();render();return true}
    case"hmed":{const ok=v==="pain"?takePainkillers():takeAntibiotics();if(ok){advance(2);UI.hmsg={t:S.t,x:S.journal[0].x}}save();render();return true}
  }
  return false}
// reaching for a medical supply in your bag goes to the wound it's for
function useMed(id){const it=ITEMS[id];
  if(it.med==="pain"){if(takePainkillers()){advance(2);save();render()}return}
  if(it.med==="abx"){if(takeAntibiotics()){advance(2);save();render()}return}
  const k={dress:"wrap",clean:"clean",stitch:"stitch",splint:"splint"}[it.med];const w=woundFor(k);
  if(!w){toast({wrap:"Nothing needs wrapping right now.",clean:"Nothing needs washing right now.",stitch:"Nothing needs stitches right now.",splint:"Nothing's broken. Keep it that way."}[k]);return}
  doCare(k==="clean"?"wash":k==="stitch"?"stitch":"wrap",w,id)}

function itemSvg(id,r,px){const it=ITEMS[id];const [a,b]=it.sz;const W=a*10,H=b*10;const body=icoBody(it,W,H);
  if(!r)return `<svg class="ico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"${px?` width="${px}" height="${px}"`:""} aria-hidden="true">${body}</svg>`;

// ---------- which grid is which ----------
const CELL=40;
function gridOf(ref){const pl=S.player;if(!ref)return null;if(ref.startsWith("eq:")){const g=pl.eq[ref.slice(3)];return g&&g.c?g.c:null}
  if(ref==="open"){if(!UI.open)return null;const o=openContObj(UI.open.cid);return o?o.c:null}
  if(ref==="ground"){const p=pileAt(pl.x,pl.z,false);return p&&roomKey(p.x,p.z)===roomKey(pl.x,pl.z)?p.c:null}return null}
function groundPile(make){const pl=S.player;let p=pileAt(pl.x,pl.z,false);if(p&&roomKey(p.x,p.z)!==roomKey(pl.x,pl.z))p=null;if(!p&&make){p={id:"pile"+(S.nextU++),x:pl.x,z:pl.z,c:{g:[6,6],items:[]},t:S.t};S.piles.push(p)}return p}
function findInst(u){const pl=S.player;for(const s of SLOTS){const g=pl.eq[s];if(g&&g.u===u)return{g,slot:s}}
  for(const {slot,c} of pConts())for(const o of c.items)if(o.u===u)return{g:o,c,ref:"eq:"+slot};
  for(const ref of ["open","ground"]){const c=gridOf(ref);if(c)for(const o of c.items)if(o.u===u)return{g:o,c,ref}}return null}
function mine(ref){return ref&&ref.startsWith("eq:")}
// is c inside g (so g can't go into it)?
function nestedIn(c,g){if(!g.c)return false;if(g.c===c)return true;for(const o of g.c.items)if(nestedIn(c,o))return true;return false}

// ---------- opening a container ----------
function openCont(cid){const o=openContObj(cid);if(!o)return;UI.open={cid,t:0};UI.panel="inv";if(UI.talkTo)closeTalk(true);
  if(o.pile)for(const g of o.c.items)g.k=1;else{const s=o.st;if(s.c.items.every(g=>g.k))s.seen=true}
  render()}
function closeOpen(){UI.open=null;render()}
function searchSpeed(){return 1+S.player.sk.scavenge*.08}
// things turn up one at a time while you look
function invTick(dt){if(!UI.open)return;const pl=S.player;const cid=UI.open.cid;
  if(cid.startsWith("pile")){const p=S.piles.find(q=>q.id===cid);if(!p||dist(p.x,p.z,pl.x,pl.z)>2.4){UI.open=null;markUI()}return}
  const c=CONTS[cid];if(!c){UI.open=null;return}if(contReach(c,pl.x,pl.z)>1.9||(c.f&&roomKey(pl.x,pl.z)!==c.b+"/"+c.room)){UI.open=null;markUI();return}
  const s=contState(cid);const next=s.c.items.find(g=>!g.k);if(!next){if(!s.seen){s.seen=true;markUI()}return}
  if(zedNear(2.6))return;
  UI.open.t+=dt*Math.min(4,UI.speed)*searchSpeed();const [w,h]=isz(next);const need=.45+.22*w*h;UI.open.need=need;UI.open.cur=next.u;
  if(UI.open.t>=need){UI.open.t=0;next.k=1;if(!UI.drag)renderPanel();else markUI();if(s.c.items.every(g=>g.k)){s.seen=true;skillUp("scavenge",.03)}}
  else if(!UI.drag){const el=document.querySelector(`.it.unk[data-u="${next.u}"] .prog`);if(el)el.style.width=Math.round(UI.open.t/need*100)+"%"}}

// ---------- drawing the screen ----------
function itemHtml(g,ref,hidden,extra=""){const it=ITEMS[g.id];const [w,h]=isz(g);const st=`left:${g.x*CELL}px;top:${g.y*CELL}px;width:${w*CELL}px;height:${h*CELL}px`;
  if(hidden)return `<div class="it unk" data-u="${g.u}" style="${st}"><span class="q">?</span>${UI.open&&UI.open.cur===g.u?'<span class="prog"></span>':""}</div>`;
  const d=it.dur?durPct(g):null;
  return `<div class="it c-${it.cat}" data-u="${g.u}" data-ref="${ref}" style="${st}" title="${esc(it.n)}${it.st>1?" ×"+g.n:""}${extra}">${itemSvg(g.id,g.r)}<span class="nm">${esc(it.sn||it.n)}</span>${it.st>1&&g.n>1?`<span class="n">${g.n}</span>`:""}${d!=null&&d<99?`<span class="du"><i style="width:${Math.round(d)}%;${d<30?"background:var(--blood)":""}"></i></span>`:""}${g.c&&g.c.items.length?`<span class="has">${g.c.items.length}</span>`:""}</div>`}
function gridHtml(c,ref,o={}){const [W,H]=c.g;return `<div class="grid" data-ref="${ref}" style="width:${W*CELL}px;height:${H*CELL}px;--cell:${CELL}px">${c.items.map(g=>itemHtml(g,ref,o.hide&&!g.k)).join("")}</div>`}
function slotHtml(s){const g=S.player.eq[s];const it=g?ITEMS[g.id]:null;const d=g&&it.dur?durPct(g):null;
  return `<div class="slot${g?" full":""}" data-slot="${s}"><span class="lbl">${SLOTNAME[s]}</span>${g?`<div class="it c-${it.cat}" data-u="${g.u}" data-slot="${s}" title="${esc(it.n)}${gearStats(g.id)?" · "+gearStats(g.id):""}">${itemSvg(g.id,0)}${d!=null&&d<99?`<span class="du"><i style="width:${Math.round(d)}%;${d<30?"background:var(--blood)":""}"></i></span>`:""}</div>`:""}</div>`}
function invPanelHtml(){const pl=S.player;const w=weight(),m=maxW();const C=pConts();
  let me=`<div class="invhead"><span class="mono ${w>m?"neg":"mute"}">${w.toFixed(1)} / ${m.toFixed(0)} kg</span><span class="mono mute">armor ${armor()} · warmth ${clothesWarm()}</span></div>
  <div class="slots">${["head","outer","body","hands","legs","feet","rig","back","weapon","side"].map(slotHtml).join("")}</div>`;
  me+=C.length?C.map(({slot,g,c})=>`<div class="cbox"><div class="lbl">${CONT_LABEL[slot]} <span class="mute">· ${esc(ITEMS[g.id].n)}</span></div>${gridHtml(c,"eq:"+slot)}</div>`).join(""):`<p class="mute">Nothing with pockets on. Wear something.</p>`;
  let them="";if(UI.open){const o=openContObj(UI.open.cid);if(o){const pile=!!o.pile;const s=o.st;const hidden=pile?0:o.c.items.filter(g=>!g.k).length;const T=CONTS[UI.open.cid];
    them+=`<div class="ohead"><div><b>${esc(contName(UI.open.cid))}</b><div class="mono mute">${hidden?`Searching... ${o.c.items.length-hidden} found so far`:o.c.items.length?`${o.c.items.length} thing${o.c.items.length>1?"s":""}`:"Empty"}${T&&T.b&&isShop(BMAP[T.b])&&!S.flags.clinic?" · not yours":""}</div></div><div class="row"><button class="tag" data-act="takeall"${o.c.items.some(g=>g.k||pile)?"":" disabled"}>Take all</button><button class="x" data-act="closeopen" aria-label="Close">×</button></div></div>${gridHtml(o.c,"open",{hide:!pile})}`}}
  const gp=groundPile(false);if(!(UI.open&&gp&&UI.open.cid===gp.id)){const c=gp?gp.c:{g:[6,2],items:[]};them+=`<div class="ohead"><div><b>At your feet</b><div class="mono mute">${c.items.length?"Drag things here to drop them":"Drag things here to drop them"}</div></div></div>${gridHtml(c,"ground")}`}
  return `<div class="inv"><div class="invcol">${me}</div><div class="invcol">${them}<p class="mono mute hint">Drag to move. R turns what you're dragging. Shift-click moves it across. Double-click uses or wears it. Right-click for more.</p></div></div><div id="ctx" hidden></div>`}
function invAfterRender(){}

// ---------- moving things ----------
function takeFrom(src){const g=src.g;if(src.slot){S.player.eq[src.slot]=null}else if(src.c)cRemove(src.c,g)}
function putBack(src){const g=src.g;if(src.slot)S.player.eq[src.slot]=g;else if(src.c){if(cFits(src.c,...isz(g),g.x,g.y,g))cPut(src.c,g,g.x,g.y,g.r);else{const p=cFind(src.c,g);if(p)cPut(src.c,g,p.x,p.y,p.r);else stash(g)}}}
// somewhere for a thing to go: your pockets, or the floor
function stash(g){if(pStore(g))return"you";dropInst(g);cleanPiles();return"ground"}
function slotFor(id,want){const it=ITEMS[id];if(!it.slot)return null;if(it.slot==="weapon"){if(want==="side")return it.side?"side":null;if(want==="weapon")return"weapon";return S.player.eq.weapon&&it.side&&!S.player.eq.side?"side":"weapon"}return want&&want!==it.slot?null:it.slot}
function equipInst(src,want){const g=src.g;const s=slotFor(g.id,want);if(!s){toast(`That doesn't go there.`);return false}const pl=S.player;const old=pl.eq[s];
  if(old===g)return true;takeFrom(src);pl.eq[s]=g;g.r=0;
  if(old){// the thing you had on goes where the new one came from, or into your pockets
    if(src.c&&cFits(src.c,...isz(old),g.x,g.y,null)){cPut(src.c,old,g.x,g.y,0)}else if(src.slot&&slotFor(old.id,src.slot)){pl.eq[src.slot]=old}else{const p=src.c?cFind(src.c,old):null;if(p)cPut(src.c,old,p.x,p.y,p.r);else if(stash(old)==="ground")toast(`No room for your ${ITEMS[old.id].n.toLowerCase()}. It's at your feet.`)}}
  return true}
function unequip(s){const pl=S.player;const g=pl.eq[s];if(!g)return;pl.eq[s]=null;if(pStore(g))return;dropInst(g);toast(`No room. Your ${ITEMS[g.id].n.toLowerCase()} is at your feet.`)}
function quickMove(src,ref){const g=src.g;if(!mine(ref)&&!src.slot){// into your things
    takeFrom(src);if(pStore(g)){g.k=1;witnessTake();return true}putBack(src);toast("No room in your pockets or bag.");return false}
  const target=UI.open?gridOf("open"):null;takeFrom(src);
  if(target){if(nestedIn(target,g)){putBack(src);return false}const p=cFind(target,g);if(p){cPut(target,g,p.x,p.y,p.r);g.k=1;return true}putBack(src);toast("It won't fit in there.");return false}
  dropInst(g);g.k=1;return true}
function witnessTake(){if(!UI.open)return;const c=CONTS[UI.open.cid];if(c)witnesses(c,false)}
function splitInst(src){const g=src.g;if(g.n<2)return;const k=Math.floor(g.n/2);const n=mkInst(g.id,k);n.k=1;const c=src.c||null;let p=c?cFind(c,n):null;if(p){g.n-=k;cPut(c,n,p.x,p.y,p.r)}else if(pStore(n)){g.n-=k}else toast("No room to split it.")}
function dropSrc(src){takeFrom(src);const g=src.g;dropInst(g);g.k=1;cleanPiles()}
// eating, drinking, patching up
function useItem(id){if(!id)return;for(const {c} of pConts())for(const g of c.items)if(g.id===id){useInst({g,c});return}toast("You don't have that.")}
function useInst(src){const g=src.g;const it=ITEMS[g.id];const pl=S.player;const id=g.id;
  const consume=()=>{g.n-=1;if(g.n<=0){if(src.c)cRemove(src.c,g);else if(src.slot)pl.eq[src.slot]=null}};
  const leave=(aid)=>{const e=mkInst(aid);e.k=1;if(src.c&&g.n<=0&&cFits(src.c,...isz(e),g.x,g.y,null)){cPut(src.c,e,g.x,g.y,g.r)}else if(stash(e)==="ground")toast(`You set the ${ITEMS[aid].n.toLowerCase()} down.`)};
  if(it.eat){consume();pl.food=clamp(pl.food+it.eat.food,0,100);if(it.eat.water)pl.water=clamp(pl.water+it.eat.water,0,100);if(it.eat.sick&&rf()<it.eat.sick){pl.sick=1;journal("Your stomach turns. You shouldn't have eaten that raw.","bad")}else journal(`You eat the ${it.n.toLowerCase()}.`);advance(5)}
  else if(it.drink){consume();pl.water=clamp(pl.water+it.drink,0,100);if(it.after)leave(it.after);if(id==="whiskey"){pl.warmth=clamp(pl.warmth+10,0,100);pl.energy=clamp(pl.energy-3,0,100);journal("The whiskey burns all the way down. For a while, things are softer.")}else if(it.sick&&rf()<it.sick){pl.sick=1;journal("You drink the river water. Hours later your gut cramps. You're sick.","bad")}else journal(`You drink the ${it.n.toLowerCase()}.`);advance(3)}
  else if(it.med){useMed(id);return}
  else if(id==="cigarettes"){consume();pl.energy=clamp(pl.energy+4,0,100);journal("You smoke one. Your hands stop shaking for a while.")}
  else if(id==="radio"){advance(10);journal(radioLine());toast(radioLine())}
  else if(id==="photo"){const t=pick(["You look at the photo for a long time. Everyone in it is smiling. You can't remember what was funny.","The photo is creased from your pocket. You smooth it out and put it back.","You don't look at the photo. You just hold it."]);journal(t);toast(t)}
  else if(it.read){pl.flags.read=pl.flags.read||{};if(pl.flags.read[id]){toast("You've already read this one cover to cover.");return}pl.flags.read[id]=1;act(90);for(let i=0;i<6;i++)skillUp(it.read,.12);journal(`You read ${it.n.toLowerCase()} by the light you've got. Some of it sticks.`,"good")}
  else if(it.slot){equipInst(src)}
  else{toast(it.d||`You turn the ${it.n.toLowerCase()} over in your hands.`);return}
  save();render()}
function canUse(id){const it=ITEMS[id];return!!(it.eat||it.drink||it.med||it.read||["cigarettes","radio","photo"].includes(id))}
function useWord(id){const it=ITEMS[id];return it.eat?"Eat":it.drink?"Drink":it.med?{dress:"Wrap a wound",pain:"Take two",abx:"Take a course",clean:"Wash a wound",stitch:"Stitch a cut",splint:"Bind a break"}[it.med]:it.read?"Read":id==="cigarettes"?"Smoke":id==="radio"?"Listen":id==="photo"?"Look at it":"Use"}
function repairInst(src){const g=src.g;const it=ITEMS[g.id];const pl=S.player;if(!it.fix||!Object.entries(it.fix).every(([k,v])=>invHas(k,v)))return;for(const [k,v] of Object.entries(it.fix))invTake(k,v);
  const ws=atHome()&&siteHas(myGroup().home,"workshop");g.dur=Math.min(it.dur,g.dur+it.dur*(ws?.7:.45)+pl.sk.craft*2);act(20,{work:true});skillUp("craft",.06);journal(`You patch up your ${it.n.toLowerCase()}.`);save();render()}
function takeAll(){const c=gridOf("open");if(!c)return;let n=0,left=0;for(const g of [...c.items]){if(!g.k&&!UI.open.cid.startsWith("pile"))continue;cRemove(c,g);if(pStore(g)){n++;g.k=1}else{c.items.push(g);left++}}
  if(n)witnessTake();if(left)toast(n?`You take what fits. ${left} thing${left>1?"s":""} won't.`:"No room for any of it.");cleanPiles();save();render()}

// ---------- dragging ----------
function srcOf(el){const u=el.dataset.u;const f=findInst(u);if(!f)return null;return f}
function cellAt(gridEl,x,y,w,h,gx,gy){const r=gridEl.getBoundingClientRect();return{x:Math.round((x-r.left)/CELL-gx-(w-1)/2*0),y:Math.round((y-r.top)/CELL-gy)}}
function dragStart(e,el){const src=srcOf(el);if(!src)return;const g=src.g;const r=el.getBoundingClientRect();const [w,h]=src.slot?ITEMS[g.id].sz:isz(g);
  const gx=src.slot?Math.min(w-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*w))):Math.floor((e.clientX-r.left)/CELL),gy=src.slot?Math.min(h-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*h))):Math.floor((e.clientY-r.top)/CELL);
  UI.press={src,el,x0:e.clientX,y0:e.clientY,gx:Math.max(0,gx),gy:Math.max(0,gy),r:src.slot?0:g.r}}
function dragMove(e){const P_=UI.press;if(!P_)return;if(!UI.drag){if(Math.hypot(e.clientX-P_.x0,e.clientY-P_.y0)<5)return;
    const gh=document.createElement("div");gh.className="it ghost c-"+ITEMS[P_.src.g.id].cat;document.body.appendChild(gh);UI.drag={...P_,gh};P_.el.classList.add("lift");closeMenu();drawGhost()}
  const D=UI.drag;D.cx=e.clientX;D.cy=e.clientY;placeGhost();targetAt(e.clientX,e.clientY)}
function drawGhost(){const D=UI.drag;const g=D.src.g;const s=ITEMS[g.id].sz;const w=D.r?s[1]:s[0],h=D.r?s[0]:s[1];D.gh.style.width=w*CELL+"px";D.gh.style.height=h*CELL+"px";D.gh.innerHTML=itemSvg(g.id,D.r)+(g.n>1?`<span class="n">${g.n}</span>`:"");D.w=w;D.h=h}
function placeGhost(){const D=UI.drag;if(!D||D.cx==null)return;D.gh.style.transform=`translate(${D.cx-D.gx*CELL-CELL/2}px,${D.cy-D.gy*CELL-CELL/2}px)`}
function clearMark(){document.querySelectorAll(".dropmark").forEach(x=>x.remove());document.querySelectorAll(".slot.ok,.slot.bad").forEach(x=>x.classList.remove("ok","bad"))}
function targetAt(x,y){const D=UI.drag;clearMark();D.tgt=null;const under=document.elementFromPoint(x,y);if(!under)return;
  const slotEl=under.closest(".slot");if(slotEl){const s=slotEl.dataset.slot;const ok=!!slotFor(D.src.g.id,s)&&!(D.src.g.c&&false);slotEl.classList.add(ok?"ok":"bad");D.tgt=ok?{slot:s}:null;return}
  const gridEl=under.closest(".grid");if(!gridEl)return;const ref=gridEl.dataset.ref;let c=gridOf(ref);const virtual=!c&&ref==="ground";if(!c&&!virtual)return;const C=c||{g:[6,2],items:[]};
  const r=gridEl.getBoundingClientRect();const cx=Math.floor((x-r.left)/CELL)-D.gx,cy=Math.floor((y-r.top)/CELL)-D.gy;const g=D.src.g;
  // dropping onto a stack of the same thing tops it up
  const onIt=under.closest(".it");if(onIt&&onIt.dataset.u!==g.u){const o=C.items.find(q=>q.u===onIt.dataset.u);if(o&&o.id===g.id&&ITEMS[g.id].st>1&&o.n<ITEMS[g.id].st&&(o.k||ref!=="open")){D.tgt={ref,stack:o};mark(gridEl,o.x,o.y,...isz(o),true);return}}
  const ok=cFits(C,D.w,D.h,cx,cy,g)&&!(c&&nestedIn(c,g));D.tgt=ok?{ref,x:cx,y:cy,r:D.r}:null;mark(gridEl,cx,cy,D.w,D.h,ok)}
function mark(gridEl,x,y,w,h,ok){const m=document.createElement("div");m.className="dropmark "+(ok?"ok":"bad");m.style.cssText=`left:${x*CELL}px;top:${y*CELL}px;width:${w*CELL}px;height:${h*CELL}px`;gridEl.appendChild(m)}
function dragEnd(e){const P_=UI.press;UI.press=null;const D=UI.drag;if(!D)return false;UI.drag=null;D.gh.remove();clearMark();D.el.classList.remove("lift");
  const t=D.tgt;const src=D.src;const g=src.g;
  if(t){if(t.slot){equipInst(src,t.slot)}
    else if(t.stack){const o=t.stack;const k=Math.min(ITEMS[g.id].st-o.n,g.n);o.n+=k;g.n-=k;if(g.n<=0)takeFrom(src)}
    else{let c=gridOf(t.ref);if(!c&&t.ref==="ground")c=groundPile(true).c;if(c){const from=src.ref;takeFrom(src);cPut(c,g,t.x,t.y,t.r);if(t.ref==="open"||t.ref==="ground")g.k=1;if(mine(t.ref)&&from&&!mine(from))witnessTake()}}

  for(const L of [W3.spot,W3.plight,W3.room,W3.fireLight])if(L)L.intensity=0;

function titleLoop(ts){if(!UI.create||!W3.ok){TITLE.on=false;return}requestAnimationFrame(titleLoop);if(document.hidden)return;

  L.target.position.set(fx,0,fz);L.position.set(fx+W3.sunDir.x*60,W3.sunDir.y*60,fz+W3.sunDir.z*60);L.target.updateMatrixWorld();
  W3.ren.render(W3.scene,W3.cam)}
