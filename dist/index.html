<title>TWD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One screen: the world fills the window; time and place sit top left, the map top right, your body and your options along the bottom.
   Panels slide in from the right, conversations open beside the person you're talking to. The game is always at night-desk darkness, so one palette. */
:root{
  --bg:#0d0f0d; --panel:rgba(17,20,18,.94); --panel-solid:#141815; --panel2:#1d221e; --panel3:#262c27; --line:#2f3831; --line2:#3d483f;
  --fg:#ebe6d9; --mute:#9aa395; --dim:#6d756a; --ember:#e48a3f; --ember-dk:#3a2512; --lichen:#a9c38d; --blood:#d4574a; --sky:#86aac4; --paper:#efe9dc; --ink:#1b1915;
  --f-display:"Saira Stencil One","Arial Narrow",Impact,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f0d;--fg:#ebe6d9}}
:root[data-theme="dark"]{--bg:#0d0f0d;--fg:#ebe6d9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ember);outline:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
table{font:inherit;border-collapse:collapse;width:100%}
th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid rgba(47,56,49,.6);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td,td.click:hover{background:var(--panel2)} td.click{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:21px} h3{font-size:17px}
p{margin:0}
ul{margin:0;padding-left:18px}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.mute{color:var(--mute)} .small{font-size:12px} .pos{color:var(--lichen)} .neg{color:var(--blood)} .warn{color:var(--ember)}
.num{font-family:var(--f-mono);font-size:12px;text-align:right}
.lbl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:7px 11px;text-align:left;display:inline-flex;flex-direction:column;gap:1px;min-width:0}
.btn:hover:not(:disabled){border-color:var(--ember)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn small{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.btn.pri{background:var(--ember);color:#1a120a;border-color:var(--ember)} .btn.pri small{color:#4a2c12}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:1px 7px;color:var(--fg);vertical-align:1px}
button.tag:hover:not(:disabled){border-color:var(--ember)} button.tag:disabled{opacity:.4;cursor:not-allowed}
.tag.warn{color:var(--ember);border-color:rgba(228,138,63,.5)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12.5px;line-height:1.3}
.chip:hover:not(:disabled){border-color:var(--sky)} .chip.on{border-color:var(--ember);background:var(--ember-dk)} .chip:disabled{opacity:.42;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);flex:0 0 auto}
.x{background:none;border:1px solid transparent;border-radius:4px;width:28px;height:28px;font-size:20px;line-height:1;color:var(--mute);flex:0 0 auto;display:grid;place-items:center;padding:0}
.x:hover{color:var(--fg);border-color:var(--line2)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.entry{border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.entry .mono{color:var(--mute)}
.entry.good{border-left-color:var(--lichen)} .entry.bad{border-left-color:var(--blood)} .entry.big{border-left-color:var(--ember)}
.journal{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px}
.meter{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.meter span:last-child{text-align:right}
.track{position:relative;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.track i{position:absolute;top:0;bottom:0}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{width:100%}

/* ---------- the world view ---------- */
#game{position:absolute;inset:0;overflow:hidden;background:#05080d}
#world{position:absolute;inset:0}
.w3{position:absolute;inset:0;overflow:hidden;touch-action:none}
.w3 canvas{display:block;width:100%;height:100%;cursor:default}
.w3::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 46%,transparent 58%,rgba(0,0,0,.34) 100%)}
.w3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.w3label{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font-family:var(--f-mono);font-size:11px;line-height:1.3;color:var(--fg);background:rgba(10,12,10,.78);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:3px 7px;will-change:transform}
.w3label b{font-weight:600}
.w3label.hover{font-size:11.5px;padding:5px 9px;text-align:center;margin-top:-6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.w3label.hover span{color:var(--mute)}
.w3label.say{white-space:normal;width:max-content;max-width:230px;font-family:var(--f-body);font-size:13px;line-height:1.35;color:var(--ink);background:var(--paper);border:none;border-radius:10px;padding:6px 10px;margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.w3label.say::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.w3label.bld{background:none;border:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:rgba(235,230,217,.86);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8)}
.w3label.dead{color:#e6a49c;background:rgba(40,10,8,.72);border-color:rgba(212,87,74,.4)}
.w3label.comp{font-size:10px;padding:1px 6px;color:var(--lichen);border-color:rgba(169,195,141,.35);margin-top:-2px}
.w3label.want{width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--ember);color:#1a120a;font-weight:600;border:none;margin-top:-4px;box-shadow:0 0 0 3px rgba(228,138,63,.25)}
.w3label.task{min-width:120px;text-align:center;padding:4px 8px 7px;margin-top:-8px}
.w3label.task i{position:absolute;left:6px;bottom:3px;height:2px;background:var(--ember);max-width:calc(100% - 12px)}
.w3prompt{z-index:2;font-size:11.5px;padding:4px 9px 4px 5px;margin-top:-8px;border-color:rgba(228,138,63,.35)}
.w3prompt b{display:inline-block;min-width:18px;text-align:center;background:var(--ember);color:#1a120a;border-radius:3px;padding:0 4px;margin-right:4px}
.w3prompt .mute{color:var(--mute)}
.w3hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.55) 100%)}
.w3area{z-index:1;position:absolute;left:50%;top:14%;transform:translateX(-50%);pointer-events:none;opacity:0;font-family:var(--f-display);font-size:30px;letter-spacing:.08em;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.6);white-space:nowrap}
.w3fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}
#game.dead .w3{filter:grayscale(.85) brightness(.6);transition:filter 1.5s}

/* ---------- the corners ---------- */
.hud{position:absolute;z-index:5;pointer-events:none}
.hud button,.hud canvas{pointer-events:auto}
#hudtl{left:14px;top:12px;display:flex;flex-direction:column;gap:2px;padding:9px 14px 10px;background:linear-gradient(180deg,rgba(13,15,13,.82),rgba(13,15,13,.6));border:1px solid rgba(255,255,255,.06);border-radius:8px;max-width:min(420px,44vw)}
#hudtl .clk{font-family:var(--f-mono);font-size:12px} #hudtl .clk b{font-size:14px;font-weight:600;color:var(--fg)}
#hudtl .where{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;line-height:1.2}
#hudtl .where .mute{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
#hudtl .warn{color:var(--ember)}
#hudtr{right:14px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:200px;height:150px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(13,15,13,.75);box-shadow:var(--shadow)}
#ctrls{display:flex;gap:3px;background:rgba(13,15,13,.75);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:3px}
#ctrls button{background:none;border:1px solid transparent;border-radius:4px;min-width:28px;height:26px;padding:0 6px;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
#ctrls button:hover{color:var(--fg);border-color:var(--line2)}
#ctrls button.on{color:#1a120a;background:var(--ember)}
#log{left:14px;bottom:122px;width:min(440px,46vw);display:flex;flex-direction:column;gap:5px}
#log .entry{font-size:13px;line-height:1.35;background:linear-gradient(90deg,rgba(13,15,13,.82),rgba(13,15,13,.45));border-radius:0 6px 6px 0;padding:5px 10px;text-shadow:0 1px 2px rgba(0,0,0,.6);animation:logIn .35s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#vitals{left:14px;bottom:70px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:7px 12px 8px;background:rgba(13,15,13,.78);border:1px solid rgba(255,255,255,.07);border-radius:8px;max-width:calc(100vw - 28px)}
.vital{width:74px}
.vital .lbl{font-size:9.5px;letter-spacing:.1em}
.vital .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px}
.vital .bar i{display:block;height:100%;background:var(--lichen);transition:width .6s}
.vital.mid .bar i{background:var(--ember)} .vital.low .bar i{background:var(--blood)}
.vital.low .lbl{color:var(--blood)}
#vitals .load{font-size:11px;padding-bottom:1px}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.cond{font-family:var(--f-mono);font-size:10.5px;color:var(--blood);border:1px solid rgba(212,87,74,.7);background:rgba(60,14,10,.5);border-radius:3px;padding:0 6px}
#bar{left:14px;right:14px;bottom:12px;display:flex;gap:10px;align-items:stretch;justify-content:space-between}
#bar .acts{display:flex;gap:6px;flex-wrap:nowrap;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
#bar .acts::-webkit-scrollbar{display:none}
.act{pointer-events:auto;background:rgba(20,24,21,.9);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;text-align:left;display:flex;flex-direction:column;gap:0;font-size:13px;line-height:1.25;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:220px}
.act small{font-family:var(--f-mono);font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act:hover:not(:disabled){border-color:var(--ember)}
.act.pri{border-color:rgba(228,138,63,.7)}
.act:disabled{opacity:.45;cursor:not-allowed}
#bar .tabs{display:flex;gap:3px;align-items:stretch;flex:0 0 auto;background:rgba(13,15,13,.85);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:3px}
.tab{background:none;border:1px solid transparent;border-radius:5px;padding:4px 10px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.tab small{font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:none}
.tab:hover{color:var(--fg);border-color:var(--line2)}
.tab.on{color:var(--fg);background:var(--panel3);border-color:var(--ember)}
.tab .warn{font-weight:600}
.toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:90;background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--ember);border-radius:6px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast[hidden]{display:none}

/* ---------- panels ---------- */
#panel{position:absolute;z-index:20;right:14px;top:12px;bottom:70px;width:min(540px,calc(100vw - 28px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px);animation:panelIn .18s ease-out}
#panel[hidden]{display:none}
#panel.p-inv{width:min(920px,calc(100vw - 28px))}
#panel.p-map{width:min(760px,calc(100vw - 28px))}
@keyframes panelIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
#panel>header h2{font-size:20px;color:var(--ember)}
.pbody{flex:1;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.profile h3{font-size:19px}
#bigmap{width:100%;display:block;border-radius:6px;border:1px solid var(--line);cursor:crosshair;background:#0a0c0a}
.lotgrid{display:grid;gap:3px;margin:6px 0}
.tile{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden;font-family:var(--f-mono);font-size:10px;color:#141414;padding:0}
.tile:hover{border-color:var(--sky)} .tile.sel{outline:2px solid var(--ember);outline-offset:1px}
.tile.site{background:repeating-linear-gradient(45deg,var(--panel2) 0 4px,var(--panel3) 4px 8px);color:var(--fg)}
.tile .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--ember)}

/* ---------- the inventory: block grids ---------- */
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.invcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.invhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(5,58px);gap:6px}
.slot{width:58px;height:58px;position:relative;background:rgba(0,0,0,.28);border:1px dashed var(--line2);border-radius:5px;display:grid;place-items:center}
.slot>.lbl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:8.5px;letter-spacing:.06em;color:var(--dim);pointer-events:none}
.slot.full{border-style:solid;background:var(--panel2)} .slot.full>.lbl{top:auto;bottom:-1px;transform:none;font-size:7.5px;color:var(--mute);z-index:2;text-shadow:0 1px 2px #000}
.slot .it{position:absolute;inset:3px;width:auto;height:auto}
.slot.ok{border-color:var(--lichen);background:rgba(169,195,141,.15)} .slot.bad{border-color:var(--blood);background:rgba(212,87,74,.12)}
.cbox{display:flex;flex-direction:column;gap:5px}
.grid{position:relative;flex:0 0 auto;max-width:100%;border:1px solid var(--line2);border-radius:3px;background-color:rgba(0,0,0,.32);
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:var(--cell) var(--cell);box-sizing:content-box}
.it{position:absolute;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:3px;background:rgba(60,64,58,.55);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.it:hover{border-color:rgba(255,255,255,.5);z-index:3}
.it svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.it .nm{position:absolute;left:3px;top:1px;right:3px;font-family:var(--f-mono);font-size:8.5px;line-height:1.2;color:rgba(235,230,217,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px #000}
.it .n{position:absolute;right:3px;bottom:1px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--fg);text-shadow:0 1px 2px #000;pointer-events:none}
.it .du{position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:rgba(0,0,0,.5);pointer-events:none}
.it .du i{display:block;height:100%;background:var(--lichen)}
.it .has{position:absolute;right:2px;top:2px;min-width:14px;height:14px;border-radius:7px;background:var(--sky);color:#0d1418;font-family:var(--f-mono);font-size:9px;display:grid;place-items:center;padding:0 3px;pointer-events:none}
.it.c-food{background:rgba(110,86,48,.5)} .it.c-drink{background:rgba(52,82,104,.5)} .it.c-med{background:rgba(120,50,46,.5)} .it.c-mat{background:rgba(82,74,58,.5)}
.it.c-tool{background:rgba(70,74,80,.55)} .it.c-weapon{background:rgba(84,58,58,.55)} .it.c-cloth{background:rgba(62,70,82,.5)} .it.c-bag{background:rgba(64,78,54,.55)} .it.c-misc{background:rgba(80,72,90,.5)}
.it.unk{background:rgba(255,255,255,.04);border-style:dashed;cursor:default;display:grid;place-items:center}
.it.unk .q{font-family:var(--f-display);font-size:18px;color:var(--dim)}
.it.unk .prog{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(228,138,63,.28),transparent);background-size:200% 100%;animation:sweep 1s linear infinite}
@keyframes sweep{from{background-position:100% 0}to{background-position:-100% 0}}
.it.lift{opacity:.3}
.it.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;opacity:.92;border-color:var(--ember);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.dropmark{position:absolute;pointer-events:none;border-radius:3px;z-index:4}
.dropmark.ok{background:rgba(169,195,141,.25);border:1px solid var(--lichen)} .dropmark.bad{background:rgba(212,87,74,.22);border:1px solid var(--blood)}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hint{line-height:1.5}
.iicon{display:inline-block;position:relative;flex:0 0 auto;vertical-align:middle;background:var(--panel3);border-radius:4px}
.iicon svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
#ctx{position:fixed;z-index:60;min-width:190px;background:var(--panel-solid);border:1px solid var(--line2);border-radius:7px;padding:4px;box-shadow:var(--shadow);display:flex;flex-direction:column}
#ctx[hidden]{display:none}
#ctx .mtitle{font-family:var(--f-mono);font-size:10.5px;color:var(--mute);padding:5px 9px 4px;text-transform:uppercase;letter-spacing:.08em}
#ctx button{background:none;border:none;text-align:left;padding:6px 9px;border-radius:4px;font-size:13px}
#ctx button:hover:not(:disabled){background:var(--panel3)} #ctx button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- talking: a box beside the person ---------- */

function bFrame(b){const r=b.face==="+z"?0:b.face==="+x"?Math.PI/2:b.face==="-z"?Math.PI:-Math.PI/2;const ns=b.face==="+z"||b.face==="-z";
  return{r,W:ns?b.w:b.d,D:ns?b.d:b.w,c:Math.round(Math.cos(r)),s:Math.round(Math.sin(r))}}
function toWorld(b,u,v){const f=b.fr;return{x:b.x+u*f.c+v*f.s,z:b.z-u*f.s+v*f.c}}
function toLocal(b,x,z){const f=b.fr;const dx=x-b.x,dz=z-b.z;return{u:dx*f.c-dz*f.s,v:dx*f.s+dz*f.c}}
function rectWorld(b,u0,v0,u1,v1){const a=toWorld(b,u0,v0),c=toWorld(b,u1,v1);return{x0:Math.min(a.x,c.x),z0:Math.min(a.z,c.z),x1:Math.max(a.x,c.x),z1:Math.max(a.z,c.z)}}
const snap=v=>Math.round(v*2)/2;

  const cols=rowSplit(-W/2,W/2,back);for(const [t,u0,u1] of cols)rooms.push(mkRoom(t,u0,-D/2,u1,vs));
  dws.push(mkDw("v",D/2,clamp(snap(-W/2+lw*(.3+R()*.4)),-W/2+.9,lu1-.9),1,{ext:1,door:1}));

const DOORS=[];const CONTS={};// container id -> {id,k,b,f,x,z,ux,uz,room}

// ---------- collision: a spatial hash of boxes ----------
const COL={c:4,m:new Map()};
const ckey=(i,j)=>(i+200)*1000+(j+200);
function colAdd(bx){const c=COL.c;for(let i=Math.floor(bx.x0/c);i<=Math.floor(bx.x1/c);i++)for(let j=Math.floor(bx.z0/c);j<=Math.floor(bx.z1/c);j++){const k=ckey(i,j);let L=COL.m.get(k);if(!L)COL.m.set(k,L=[]);L.push(bx)}}
const BGRID=new Map();
function buildCollision(){COL.m.clear();BGRID.clear();

  for(const c of CARS){const ca=Math.abs(Math.cos(c.rot)),sa=Math.abs(Math.sin(c.rot));const hx=.95*ca+2.05*sa,hz=.95*sa+2.05*ca;colAdd({x0:c.x-hx,x1:c.x+hx,z0:c.z-hz,z1:c.z+hz,k:"car"})}

  for(const c of Object.values(CONTS)){if(!c.f)continue;const b=BMAP[c.b];const f=c.f;const cu=(f.u0+f.u1)/2,cv=(f.v0+f.v1)/2;const fu=Math.sin(f.rot),fv=Math.cos(f.rot);
    const hw=(Math.abs(fu)>.5?(f.v1-f.v0):(f.u1-f.u0))/2,hd=(Math.abs(fu)>.5?(f.u1-f.u0):(f.v1-f.v0))/2;const su=fv,sv=-fu;

    if(!c.ok){let best=null,bd=1e9;for(const sp of b.spots){if(sp.room!==c.room)continue;const d=dist(sp.x,sp.z,c.x,c.z);if(d<bd){bd=d;best=sp}}if(best){c.ux=best.x;c.uz=best.z}}}}
// how far the player is from a piece of furniture's footprint
function contReach(c,x,z){if(!c.f){const car=c.car;return Math.max(0,dist(x,z,car.x,car.z)-2)}const w=c.f.w;const dx=Math.max(0,w.x0-x,x-w.x1),dz=Math.max(0,w.z0-z,z-w.z1);return Math.hypot(dx,dz)}
const QWALLS=[[60,-96,122,-94],[60,-60,122,-58],[120,-96,122,-58],[60,-96,62,-78],[60,-72,62,-58]];
function bldAt(x,z){const L=BGRID.get(ckey(Math.floor(x/10),Math.floor(z/10)));if(!L)return null;for(const b of L)if(Math.abs(x-b.x)<b.w/2&&Math.abs(z-b.z)<b.d/2)return b;return null}

let WALLED=new Set();// camps the dead can't walk into
// who: "pl" player, "npc" townsfolk (walk through unlocked doors), "zed" the dead, "far" (ignore furniture)
function free(x,z,r=.3,who="pl"){if(x<WB.x0+.5||x>WB.x1-.5||z<WB.z0+.5||z>WB.z1-.5)return false;
  if(z>42-r&&z<52+r&&!(x>23+r&&x<33-r)&&!(x>-62+r&&x<-52-r))return false;
  const c=COL.c;const i0=Math.floor((x-r)/c),i1=Math.floor((x+r)/c),j0=Math.floor((z-r)/c),j1=Math.floor((z+r)/c);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const L=COL.m.get(ckey(i,j));if(!L)continue;for(const bx of L){if(x+r<=bx.x0||x-r>=bx.x1||z+r<=bx.z0||z-r>=bx.z1)continue;
    if(bx.k==="door"){const d=bx.d;if(d.open||d.broken)continue;if(who==="npc"&&!d.lock&&!d.bar)continue;if(who==="far")continue;return false}
    if(bx.k==="furn"&&who==="far")continue;return false}}
  if(who==="zed"&&WALLED.size&&WALLED.has(regionAt(x,z)))return false;
  return true}
// the closed door blocking a spot, if any
function doorAt(x,z,r=.45){const c=COL.c;for(let i=Math.floor((x-r)/c);i<=Math.floor((x+r)/c);i++)for(let j=Math.floor((z-r)/c);j<=Math.floor((z+r)/c);j++){const L=COL.m.get(ckey(i,j));if(!L)continue;
  for(const bx of L)if(bx.k==="door"&&!(x+r<=bx.x0||x-r>=bx.x1||z+r<=bx.z0||z-r>=bx.z1))return bx.d}return null}
function step(e,dx,dz,r,who){if(!free(e.x,e.z,r,who)){e.x+=dx;e.z+=dz;return true}const nx=e.x+dx,nz=e.z+dz;
  if(free(nx,nz,r,who)){e.x=nx;e.z=nz;return true}if(Math.abs(dx)>1e-4&&free(nx,e.z,r,who)){e.x=nx;return true}if(Math.abs(dz)>1e-4&&free(e.x,nz,r,who)){e.z=nz;return true}return false}

// ---------- paths: through doorways, around buildings, over the river ----------
function inQuarry(x,z){return x>60&&x<122&&z>-96&&z<-58}
function roomRoute(b,from,to){if(from===to)return[];const prev=new Map([[from,null]]);const q=[from];
  while(q.length){const r=q.shift();if(r===to)break;for(const d of b.dws){if(d.ext||d.r[0]<0||d.r[1]<0)continue;const i=d.r.indexOf(r);if(i<0)continue;const n=d.r[1-i];if(prev.has(n))continue;prev.set(n,{r,d,i});q.push(n)}}
  if(!prev.has(to))return[];const pts=[];let cur=to;while(prev.get(cur)){const {r,d,i}=prev.get(cur);pts.unshift(d.p[1-i]);pts.unshift(d.p[i]);cur=r}return pts}
function exitRoute(b,ri,tx,tz){let best=null,bl=1e9;for(const d of b.exits){const inner=roomRoute(b,ri,d.r[d.inSide]);const o=d.p[d.outSide];let L=dist(o.x,o.z,tx,tz);let px=null;for(const p of inner){if(px)L+=dist(px.x,px.z,p.x,p.z);px=p}
  if(d.door&&d.door.lock&&!d.door.broken)L+=60;if(L<bl){bl=L;best={pts:[...inner,d.p[d.inSide],o],d}}}return best}
function segHitsRect(ax,az,bx,bz,r){// Liang-Barsky
  let t0=0,t1=1;const dx=bx-ax,dz=bz-az;const p=[-dx,dx,-dz,dz],q=[ax-r.x0,r.x1-ax,az-r.z0,r.z1-az];
  for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-9){if(q[i]<0)return false}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}return t0<t1}
function blockersOn(a,b,skip){const out=[];const x0=Math.min(a.x,b.x)-8,x1=Math.max(a.x,b.x)+8,z0=Math.min(a.z,b.z)-8,z1=Math.max(a.z,b.z)+8;
  for(const B of BUILDINGS){if(B===skip)continue;if(B.x+B.w/2<x0||B.x-B.w/2>x1||B.z+B.d/2<z0||B.z-B.d/2>z1)continue;const r={x0:B.x-B.w/2-.45,x1:B.x+B.w/2+.45,z0:B.z-B.d/2-.45,z1:B.z+B.d/2+.45};if(segHitsRect(a.x,a.z,b.x,b.z,r))out.push([B,r,dist(a.x,a.z,B.x,B.z)])}
  return out.sort((p,q)=>p[2]-q[2])}
function detour(a,b,depth=0){if(depth>4)return[b];const hit=blockersOn(a,b);if(!hit.length)return[b];const [B,r0]=hit[0];const m=.8;const r={x0:r0.x0-m+.45,x1:r0.x1+m-.45,z0:r0.z0-m+.45,z1:r0.z1+m-.45};
  const C=[{x:r.x0,z:r.z0},{x:r.x1,z:r.z0},{x:r.x1,z:r.z1},{x:r.x0,z:r.z1}];const inner={x0:r0.x0,x1:r0.x1,z0:r0.z0,z1:r0.z1};let best=null,bl=1e9;
  for(let i=0;i<4;i++){const c=C[i];if(!segHitsRect(a.x,a.z,c.x,c.z,inner)&&!segHitsRect(c.x,c.z,b.x,b.z,inner)){const L=dist(a.x,a.z,c.x,c.z)+dist(c.x,c.z,b.x,b.z);if(L<bl){bl=L;best=[c]}}
    for(const j of [(i+1)%4,(i+3)%4]){const d=C[j];if(!segHitsRect(a.x,a.z,c.x,c.z,inner)&&!segHitsRect(d.x,d.z,b.x,b.z,inner)){const L=dist(a.x,a.z,c.x,c.z)+dist(c.x,c.z,d.x,d.z)+dist(d.x,d.z,b.x,b.z);if(L<bl){bl=L;best=[c,d]}}}}
  if(!best)return[b];const out=[];let p=a;for(const c of best){out.push(...detour(p,c,depth+1));p=c}out.push(...detour(p,b,depth+1));return out}
function outdoorRoute(a,b){const legs=[];let cur=a;
  const qa=inQuarry(a.x,a.z),qb=inQuarry(b.x,b.z);if(qa!==qb){const g1={x:qa?66:56,z:-75},g2={x:qa?56:66,z:-75};legs.push(g1,g2)}
  const n1=a.z<47,n2=b.z<47;if(n1!==n2){const bx=28,fx=-57;const cx=Math.abs(a.x-bx)+Math.abs(b.x-bx)<=Math.abs(a.x-fx)+Math.abs(b.x-fx)?bx:fx;legs.push({x:cx,z:n1?39:55},{x:cx,z:n1?55:39})}
  const pts=[];for(const l of [...legs,b]){pts.push(...detour(cur,l));cur=l}return pts}
function navPath(x0,z0,x1,z1){const A=roomAt(x0,z0),B=roomAt(x1,z1);const end={x:x1,z:z1};
  if(A&&B&&A.b===B.b)return[...roomRoute(A.b,A.ri,B.ri),end];
  const pts=[];let s={x:x0,z:z0};
  if(A){const ex=exitRoute(A.b,A.ri,x1,z1);if(ex){pts.push(...ex.pts);s=ex.pts[ex.pts.length-1]}}
  if(B){let best=null,bl=1e9;for(const d of B.b.exits){const o=d.p[d.outSide];const inner=roomRoute(B.b,d.r[d.inSide],B.ri);let L=dist(s.x,s.z,o.x,o.z);if(d.door&&d.door.lock&&!d.door.broken)L+=60;if(L<bl){bl=L;best={o,i:d.p[d.inSide],inner}}}
    if(best){pts.push(...outdoorRoute(s,best.o),best.i,...best.inner,end);return pts}}
  pts.push(...outdoorRoute(s,end));return pts}
// a random free spot inside a building (or a room of it)
function insidePos(b,room){const L=room==null?b.spots:b.spots.filter(s=>s.room===room);const s=pick(L.length?L:b.spots);return{x:s.x+(rf()-.5)*.3,z:s.z+(rf()-.5)*.3}}
function bedPos(b,i=0){return b.beds.length?b.beds[i%b.beds.length]:null}
function nearBuilding(x,z,r=2.2){let best=null,bd=1e9;for(const b of BUILDINGS){const dx=Math.max(0,Math.abs(x-b.x)-b.w/2),dz=Math.max(0,Math.abs(z-b.z)-b.d/2);const d=Math.hypot(dx,dz);if(d<r&&d<bd){bd=d;best=b}}return best}
function frontDoor(b){return b.exits[0]}
function doorOut(b){const d=frontDoor(b);return d?d.p[d.outSide]:{x:b.x,z:b.z+b.d/2+1}}

// ================= the block inventory =================
// An item instance: {u, id, n (stack), dur, r (rotated), x, y, c (its own grid, for bags and clothes with pockets)}
function mkInst(id,n=1){const it=ITEMS[id];const g={u:"i"+(S.nextU++),id,n:Math.max(1,Math.min(n,it.st||1)),dur:it.dur||0,r:0,x:0,y:0};if(it.grid)g.c={g:[...it.grid],items:[]};return g}
function isz(g){const s=ITEMS[g.id].sz;return g.r?[s[1],s[0]]:[s[0],s[1]]}
function cFits(c,w,h,x,y,skip){if(x<0||y<0||x+w>c.g[0]||y+h>c.g[1])return false;for(const o of c.items){if(o===skip)continue;const [ow,oh]=isz(o);if(x<o.x+ow&&x+w>o.x&&y<o.y+oh&&y+h>o.y)return false}return true}
function cFind(c,g,skip){const s=ITEMS[g.id].sz;const opts=s[0]===s[1]?[0]:[0,1];for(const r of opts){const w=r?s[1]:s[0],h=r?s[0]:s[1];for(let y=0;y+h<=c.g[1];y++)for(let x=0;x+w<=c.g[0];x++)if(cFits(c,w,h,x,y,skip))return{x,y,r}}return null}
function cPut(c,g,x,y,r){g.x=x;g.y=y;g.r=r;if(!c.items.includes(g))c.items.push(g)}
function cRemove(c,g){const i=c.items.indexOf(g);if(i>=0)c.items.splice(i,1)}
function cCount(c,id){let n=0;for(const o of c.items)if(o.id===id)n+=o.n;return n}
// stack into what's there, then place new blocks. Returns how many didn't fit.
function cAdd(c,id,n,scatter){const it=ITEMS[id];if(!it)return 0;
  if(it.st>1)for(const o of c.items){if(o.id!==id||n<=0)continue;const room=it.st-o.n;if(room>0){const k=Math.min(room,n);o.n+=k;n-=k}}
  while(n>0){const g=mkInst(id,Math.min(n,it.st));let p=null;
    if(scatter){const s=it.sz;for(let t=0;t<14&&!p;t++){const r=s[0]!==s[1]&&rf()<.35?1:0;const w=r?s[1]:s[0],h=r?s[0]:s[1];const x=rnd(0,c.g[0]-w),y=rnd(0,c.g[1]-h);if(x>=0&&y>=0&&cFits(c,w,h,x,y))p={x,y,r}}}
    if(!p)p=cFind(c,g);if(!p)break;cPut(c,g,p.x,p.y,p.r);n-=g.n}
  return n}
function cFree(c){let used=0;for(const o of c.items){const [w,h]=isz(o);used+=w*h}return c.g[0]*c.g[1]-used}

// ---------- what you carry ----------
const CONT_ORDER=["legs","rig","body","outer","back"];
const CONT_LABEL={legs:"Pockets",rig:"Rig",body:"Front pocket",outer:"Jacket pockets",back:"Bag"};
function pConts(){const pl=S.player;const out=[];for(const s of CONT_ORDER){const g=pl.eq[s];if(g&&g.c)out.push({slot:s,g,c:g.c})}return out}
function gearEq(s){return S.player.eq[s]||null}
function weapon(){return S.player.eq.weapon||null}
// counts of loose things you carry, by kind (what the old code called the inventory)
function invMap(){const m={};for(const {c} of pConts())for(const o of c.items)m[o.id]=(m[o.id]||0)+o.n;return m}
function invCount(id){let n=0;for(const {c} of pConts())n+=cCount(c,id);for(const s of SLOTS){const g=S.player.eq[s];if(g&&g.id===id)n++}return n}
function invHas(id,n=1){return invCount(id)>=n}
function invAdd(id,n=1,quiet){if(!ITEMS[id])return 0;if(n<0){invTake(id,-n);return 0}if(n===0)return 0;
  for(const {c} of pConts()){n=cAdd(c,id,n);if(n<=0)return 0}
  dropToGround(id,n);if(!quiet&&typeof toast==="function")toast(`No room for ${itemPhrase(id,n)}. You set ${n>1?"them":"it"} down at your feet.`);return n}
function invTake(id,n=1){const L=pConts();for(let i=L.length-1;i>=0;i--){const c=L[i].c;for(const o of [...c.items]){if(n<=0)return;if(o.id!==id)continue;const k=Math.min(o.n,n);o.n-=k;n-=k;if(o.n<=0){cRemove(c,o);if(o.c)spill(o)}}}
  const pl=S.player;for(const s of ["side","weapon",...SLOTS]){if(n<=0)return;const g=pl.eq[s];if(g&&g.id===id){pl.eq[s]=null;n--;if(g.c)spill(g)}}}
// put an instance somewhere in your containers; false if there's no room
function pStore(g,skipC){if(ITEMS[g.id].st>1)for(const {c} of pConts()){if(c===skipC)continue;for(const o of c.items){if(o.id===g.id&&o!==g&&o.n<ITEMS[g.id].st){const k=Math.min(ITEMS[g.id].st-o.n,g.n);o.n+=k;g.n-=k;if(g.n<=0)return true}}}
  for(const {c,g:holder} of pConts()){if(c===skipC||holder===g)continue;const p=cFind(c,g);if(p){cPut(c,g,p.x,p.y,p.r);return true}}return false}
// a bag or jacket left your body: its contents go into your other pockets, or on the ground
function spill(g){if(!g.c||!g.c.items.length)return;const left=[];for(const o of [...g.c.items]){cRemove(g.c,o);if(!pStore(o,g.c))left.push(o)}for(const o of left)dropInst(o)}
function equipNew(id){const g=mkInst(id);const it=ITEMS[id];const slot=it.slot==="weapon"&&S.player.eq.weapon&&it.side?"side":it.slot;S.player.eq[slot]=g;return g}
function instW(g){let w=ITEMS[g.id].w*g.n;if(g.c)for(const o of g.c.items)w+=instW(o);return w}
function weight(){const pl=S.player;let w=0;for(const s of SLOTS){const g=pl.eq[s];if(g)w+=instW(g)-ITEMS[g.id].w*.5}return w}
function maxW(){const pl=S.player;return 16+pl.sk.fight*.4+pl.sk.build*.25}
function clothesWarm(){let w=0;for(const s of ["head","body","outer","hands","legs","feet"]){const g=gearEq(s);if(g)w+=ITEMS[g.id].warm||0}return w}
function armor(){let a=0;for(const s of SLOTS){const g=gearEq(s);if(g)a+=ITEMS[g.id].armor||0}return a}
function breakSlot(s){const pl=S.player;const g=pl.eq[s];pl.eq[s]=null;if(g&&g.c)spill(g);return g}
function wearWeapon(n){const w=weapon();if(!w)return"";w.dur-=n;if(w.dur<=0){breakSlot("weapon");const pl=S.player;if(pl.eq.side){pl.eq.weapon=pl.eq.side;pl.eq.side=null}
  const t=` Your ${ITEMS[w.id].n.toLowerCase()} breaks.`;journal(t.trim(),"bad");return t}return""}
function wearClothes(h){for(const s of ["head","body","outer","hands","legs","feet","back","rig"]){const g=gearEq(s);if(!g||!g.dur)continue;g.dur-=h*.12;if(g.dur<=0){breakSlot(s);journal(`Your ${ITEMS[g.id].n.toLowerCase()} falls apart.`,"bad")}}}
function allCarried(){const out=[];const pl=S.player;for(const s of SLOTS)if(pl.eq[s])out.push({g:pl.eq[s],slot:s});for(const {c} of pConts())for(const o of c.items)out.push({g:o,c});return out}
function hasTool(t){return allCarried().some(x=>ITEMS[x.g.id].tool===t)}
function wearTool(t,n){const x=allCarried().find(x=>ITEMS[x.g.id].tool===t);if(!x)return;const g=x.g;g.dur-=n;if(g.dur<=0){if(x.slot)breakSlot(x.slot);else cRemove(x.c,g);journal(`Your ${ITEMS[g.id].n.toLowerCase()} breaks.`,"bad")}}
function skillUp(k,a=.12){S.player.sk[k]=Math.min(10,+(S.player.sk[k]+a).toFixed(2))}
function durPct(g){const it=ITEMS[g.id];return it.dur?clamp(g.dur/it.dur*100,0,100):100}

// ---------- the ground ----------
function pileAt(x,z,make){let best=null,bd=1.4;for(const p of S.piles){const d=dist(p.x,p.z,x,z);if(d<bd){bd=d;best=p}}
  if(!best&&make){best={id:"pile"+(S.nextU++),x,z,c:{g:[6,6],items:[]},t:S.t};S.piles.push(best)}return best}
function dropInst(g,x,z){const pl=S.player;const p=pileAt(x??pl.x,z??pl.z,true);let pos=cFind(p.c,g);while(!pos&&p.c.g[1]<60){p.c.g[1]+=2;pos=cFind(p.c,g)}if(pos)cPut(p.c,g,pos.x,pos.y,pos.r);p.t=S.t;return p}
function dropToGround(id,n){const it=ITEMS[id];while(n>0){const g=mkInst(id,Math.min(n,it.st));dropInst(g);n-=g.n}}
function cleanPiles(){S.piles=S.piles.filter(p=>p.c.items.length)}

// ---------- furniture, cars and what's inside ----------
function contState(cid){let s=S.cont[cid];if(!s){const C=CONTS[cid];const T=CONT[C.k]||{g:[4,3]};s=S.cont[cid]={c:{g:[...T.g],items:[]},rolled:false,rev:0,lock:!!T.locked}}return s}
function isShop(b){return b&&!["house","farmhouse","trailer","cabin"].includes(b.type)}
function rollLoot(cid){const s=contState(cid);if(s.rolled)return s;s.rolled=true;const C=CONTS[cid];const pl=S.player;const day=dayOf(S.t);const b=C.b?BMAP[C.b]:null;
  const shop=isShop(b)||!b;const picked=C.b===pl.home?0:Math.min(.85,(day-1)*(shop?.07:.035)+(S.flags.clinic&&shop?.06:0));
  const mult=(1-picked)*(1+pl.sk.scavenge*.05);
  for(const [id,ch,mn=1,mx=1] of (LOOT[C.k]||[])){if(!ITEMS[id])continue;if(rf()<ch*mult)cAdd(s.c,id,rnd(mn,mx),true)}
  if(C.b===pl.home&&!pl.flags.homeSeeded)seedHome(b);
  s.c.items.sort((a,b)=>a.y-b.y||a.x-b.x);return s}
// your own house has a few things you'd know were there
function seedHome(b){const pl=S.player;pl.flags.homeSeeded=true;const add=(k,list)=>{const c=Object.values(CONTS).find(c=>c.b===b.id&&c.k===k);if(!c)return;const s=contState(c.id);const fresh=!s.rolled;s.rolled=true;for(const [id,n] of list)cAdd(s.c,id,n);if(fresh)for(const [id,ch,mn=1,mx=1] of (LOOT[k]||[]))if(rf()<ch)cAdd(s.c,id,rnd(mn,mx),true);s.c.items.sort((a,c)=>a.y-c.y||a.x-c.x)};
  add("closet",[["backpack",1],["tshirt",1]]);add("cupboard",[["canned_food",2],["kitchen_knife",1],["water_bottle",1]]);add("fridge",[["water_bottle",2]]);add("nightstand",[["flashlight",1]]);add("medicine",[["bandage",2]])}
function contName(cid){if(cid.startsWith("pile"))return"On the ground";const C=CONTS[cid];return C?C.n:"Container"}
function openContObj(cid){if(cid.startsWith("pile")){const p=S.piles.find(p=>p.id===cid);return p?{c:p.c,rev:1e9,pile:p}:null}const s=rollLoot(cid);return{c:s.c,rev:s.rev,st:s}}

function relGet(a,b){return a.rel[b.id]||0}

// ================= people =================
let NEXT=1;
function traits(){return{kind:rf(),brave:rf(),ambit:rf(),temper:rf(),social:rf(),curious:rf(),honest:rf(),faith:rf()}}
function traitWords(tr){const w=[];
  if(tr.kind>.72)w.push("kind");else if(tr.kind<.25)w.push("cold");
  if(tr.brave>.75)w.push("brave");else if(tr.brave<.22)w.push("timid");
  if(tr.ambit>.75)w.push("ambitious");
  if(tr.temper>.75)w.push("hot-headed");else if(tr.temper<.2)w.push("calm");
  if(tr.social>.75)w.push("talkative");else if(tr.social<.22)w.push("quiet");
  if(tr.curious>.8)w.push("curious");
  if(tr.honest<.22)w.push("shifty");else if(tr.honest>.8)w.push("honest");
  if(tr.faith>.85)w.push("devout");
  if(!w.length)w.push("steady");return w.slice(0,4)}
function makePerson(o={}){
  const sex=o.sex||(rf()<.5?"F":"M");const job=o.job||"unemployed";
  const sk={fight:rnd(0,2),scavenge:rnd(0,2),craft:rnd(0,2),build:rnd(0,2),medic:rnd(0,1),speak:rnd(0,2),survive:rnd(0,2)};

function ownerOf(site){return Object.values(S.groups).find(g=>g.home===site&&!g.dead)||null}

function leaderAI(g){const L=P(g.leader);if(!L)return;const st=g.stock;const n=groupSize(g.id);

      :pick(["It's not a flu. Whatever it is, it's everywhere. Nobody's coming.","Radio's been static for days. I think we're it, out here.","I stopped asking what it is. Doesn't matter. It's here."]));R.da+=1;return finish(p,R,out)}
  if(has("sleep_q")&&!has("how")){say(p.mood<35?pick(["Not really. Every noise is one of them.","I don't sleep. I lie there and listen."]):!S.flags.alarm?pick(["Fine. Why, do I look tired?","Like a rock. You?"]):pick(["A few hours. Better than nothing.","On and off. You?","Like the dead. ...Bad choice of words."]));R.da+=1;return finish(p,R,out)}
  if(has("dead")&&!S.flags.clinic){say(pick(["The dead? What are you talking about?","...Are you feeling okay?"]));return finish(p,R,out)}
  if(has("dead")){const lost=famList(p).find(([q])=>q.status==="turned");say(lost?`They took my ${lost[1]}. I still see ${lost[0].name}'s face on every one of them.`:p.tr.brave>.65?pick(["Aim for the head. Keep moving. Don't let them box you in.","They're slow. We're stupid. That's how people die.","I've put down eleven. I stopped counting after that."]):pick(["I can't look at them. They used to be our neighbors.","The noise. That noise they make. I hear it in my sleep.","Do you think they know? What they are?"]));return finish(p,R,out)}
  if(has("food")&&/\b(you|ya)\b/.test(low)&&/\b(eat|eaten|ate|hungry|starving|thirsty)\b/.test(low)){say(p.hunger>60?pick(["Yeah. I'm okay.","Had something this morning. I'm fine."]):p.hunger>30?pick(["A little. Not enough.","Some. I'm saving the rest."]):pick(["Not since yesterday.","*laughs without any humor* Eaten. That's a good one."]));if(p.hunger<30)R.ask="eat";return finish(p,R,out)}
  if(has("food")){const st=g?.stock;say(g?`We've got about ${Math.round(st.food)} food and ${Math.round(st.water)} water at ${g.name}, for ${groupSize(g.id)} people. ${st.food<groupSize(g.id)*2?"It's not enough.":"We're okay for now."}`:pick(["I've got a couple cans left. After that, who knows.","Everyone's raiding the grocery. Won't last."]));return finish(p,R,out)}
  if(has("plan")&&!S.flags.alarm){say(pick(["Plan? Get through the week. Same as always.","Work, dinner, bed. Why, what's yours?","Honestly? Coffee. Then we'll see."]));return finish(p,R,out)}
  if(has("plan")){say(isLeader?(g.pol.stance==="hostile"?"We take what we need. Nobody's handing it to us.":`Walls. Food. Water. In that order. ${dayOf(S.t)>12?"And get ready for winter.":""}`):g?`Ask ${g.leader==="you"?"yourself":fullName(P(g.leader)||p)}. I just do the work.`:pick(["Find people. Find walls. Find food.","Wait it out. The army'll come. Won't they?","Get out of town before it's too late."]));return finish(p,R,out)}
  if(has("news")){const ok=n=>!/household|joined|is old enough|went up at/.test(n.x);const recent=S.news.filter(n=>S.t-n.t<DAY*3&&ok(n));const known=recent.find(n=>(n.a||[]).some(id=>id!==p.id&&(p.rel[id]!==undefined||P(id)?.group===p.group)))||recent.find(n=>n.k==="big"||n.k==="bad")||recent[0];
    say(known?(/^Radio:/.test(known.x)?`The radio said ${known.x.replace(/^Radio:\s*/,"").replace(/^./,c=>c.toLowerCase())}`:/^Rumor:/.test(known.x)?`People are saying ${known.x.replace(/^Rumor:\s*/,"")}`:`Did you hear? ${known.x}`):"Nothing good. Nothing at all, really.");return finish(p,R,out)}
  if(has("joke")){say(p.tr.social>.4?pick(JOKES):"I don't do jokes.");R.da+=1;return finish(p,R,out)}
  if(has("thanks")){R.da+=1;say(pick(["Don't mention it.","Anytime.","You'd do the same."]));return finish(p,R,out)}
  if(has("compliment")){R.da+=3;R.dt+=1;say(pick(["*smiles a little* Thanks. Haven't heard that in a while.","Yeah? Thanks.","Don't get soft on me."]));return finish(p,R,out)}
  if(has("self_name")){say(`${pn}. I'll remember that.`);return finish(p,R,out)}
  if(has("bye")){say(pick(["Stay alive.","Watch yourself out there.","See you around. Hopefully.","Don't do anything stupid."]));R.action="end";return finish(p,R,out)}
  if(has("greet")||has("yes")||has("no")){const hh=hourOf(S.t);const tt=hh>=5&&hh<12?"Morning":hh>=18&&hh<23?"Evening":"Hey";
    const G1={hostile:["What.","Keep walking.","You've got a lot of nerve."],cold:[`${pn}.`,"Yeah?","Need something?"],neutral:[`${tt}.`,`Hey, ${pn}.`,"Hey."],friendly:[`Hey, ${pn}! Good to see you in one piece.`,"There you are.",`${tt}, ${pn}.`],close:[`${pn}! *hugs you* Don't scare me like that again.`,"Hey, you.","There's my favorite person."]}[t];
    say(pick(G1));if(p.want&&feel(p)>-10&&rf()<.8){out.push(`Listen... ${p.want.text}`);p.want.told=true;R.ask="help"}else if(t!=="hostile"&&rf()<.35){R.ask=pick(["okay","town"]);out.push(R.ask==="okay"?"You doing alright?":"You been into town?")}return finish(p,R,out)}
  // fallback
  if(p.want&&rf()<.5){say(`I don't know about that. But listen... ${p.want.text}`);p.want.told=true;R.ask="help";return finish(p,R,out)}
  say(pick([`I'm not sure what you mean.`,`Hm. ${p.tr.curious>.6?"Tell me more.":"If you say so."}`,`I don't know anything about that.`,`*shrugs*`,`${p.tr.social>.6?"Funny you'd ask me that.":"..."} Ask me something I can actually answer.`]));
  return finish(p,R,out)}
function toYou(x){const pn=S.player.name.split(" ")[0];return x.replace(new RegExp("\\b"+pn+"'s\\b","g"),"your").replace(new RegExp("\\b"+pn+"\\b","g"),"you").replace(/^you\b/,"You").replace(/\bthey were\b/g,"you were").replace(/\bthey are\b/g,"you are")}
function finish(p,R,out){R.text=out.map(s=>styleSay(p,s)).join(" ");if(R.ask&&!p.cv)p.cv={};if(R.ask)p.cv.q=R.ask;return R}

// ================= talking: apply =================
function applyTalk(p,r){const pl=S.player;p.chat.push({w:"them",x:r.text});if(p.chat.length>60)p.chat.splice(0,p.chat.length-60);
  p.trust=clamp(p.trust+r.dt*(1+pl.sk.speak*.03),-100,100);p.aff=clamp(p.aff+r.da,-100,100);if(r.memory)mem(p,r.memory,r.mv||0);skillUp("speak",.02);
  const note=x=>p.chat.push({w:"sys",x});const a=r.action||"";
  if(a.startsWith("note:"))note(a.slice(5));
  if(a==="follow"){p.follow=true;note(`${p.name} is following you.`)}
  if(a==="stay"){p.follow=false;note(`${p.name} stops following you.`)}
  if(a==="trade")setTimeout(()=>openTrade(p.id),30);
  if(a==="attack"){const me=pl.sk.fight*8+(weapon()?ITEMS[weapon().id].dmg*3:0)+rnd(0,50),them=p.sk.fight*10+rnd(0,50);if(me>=them){p.health-=rnd(8,20);note(`${p.name} swings at you. You put them on the ground.`)}else{pl.hp-=rnd(6,16);note(`${p.name} swings at you and lands it.`)}for(const q of living())if(dist(q.x,q.z,pl.x,pl.z)<10&&q!==p)q.trust-=2}
  if(a==="romance_yes"){p.partner="you";pl.partner=p.id;note(`You and ${p.name} are together now.`);news(`${pl.name} and ${fullName(p)} are together.`,"good",[p.id])}
  if(a==="child_yes"){if((pl.sex==="F"&&p.sex==="M")||(pl.sex==="M"&&p.sex==="F")){pl.trying=true;note(`You and ${p.name} are trying for a child.`)}else note(`You talk about raising a child together. If a child ever loses their parents, you could take them in.`)}
  if(a==="break_up"){pl.partner=null;p.partner=null;pl.trying=false;note(`You and ${p.name} are no longer together.`);news(`${pl.name} and ${p.name} split up.`,"",[p.id])}
  if(a==="join_their"){const g=G(p.group);const old=pl.group;if(old&&G(old)?.leader==="you"){for(const q of members(old))joinGroup(q,g.id,true);G(old).dead=true;news(`${G(old).name} has merged into ${g.name}.`,"big")}
    pl.group=g.id;for(const q of S.people.filter(q=>q.alive&&q.follow&&!q.group))joinGroup(q,g.id,true);for(const q of members(g.id))if(q.met)q.trust+=3;note(`You're part of ${g.name} now.`);journal(`You joined ${g.name}${g.home?" at "+PLACES[g.home].n:""}.`,"big");news(`${pl.name} joined ${g.name}.`,"")}
  if(a==="join_mine"){let g=myGroup();if(!g){g=newGroup(`${pl.name.split(" ")[0]}'s people`,"you",null);pl.group=g.id;for(const q of S.people.filter(q=>q.alive&&q.follow&&!q.group&&q.id!==p.id))joinGroup(q,g.id,true);UI.afterTalkModal={type:"name_group"};news(`${pl.name} has started a group of their own.`,"big")}
    const fam=S.people.filter(q=>q.alive&&q.hh===p.hh&&q!==p&&q.hh&&q.hh!=="you"&&(q.group===p.group));joinGroup(p,g.id,true);if(!g.home)p.follow=true;for(const q of fam){joinGroup(q,g.id,true);if(!g.home)q.follow=true}
    note(`${p.name}${fam.length?` and ${fam.length} family member${fam.length>1?"s":""}`:""} joined ${g.name}.`);journal(`${p.name} joined your group${fam.length?", with family":""}.`,"good");if(g.home)for(const q of [p,...fam])placeTo(q,randIn(g.home,3))}
  if(a==="leave_mine"){const old=myGroup();pl.group=null;for(const q of S.people.filter(q=>q.alive&&q.fam.you&&q.group===old.id)){q.group=null;q.follow=true}note(`You left ${old.name}.`);journal(`You walked away from ${old.name}.`,"big")}
  if(a==="take_lead"){const g=G(p.group);g.leader="you";news(`${p.name} handed leadership of ${g.name} to ${pl.name}.`,"big");note(`You lead ${g.name} now.`)}
  if(a.startsWith("reunite:")){const q=P(a.slice(8));if(q&&q.alive){const tg=q.group||p.group;if(tg&&q.group!==p.group){const mover=q.group?p:q;joinGroup(mover,tg,true);if(G(tg).home)placeTo(mover,randIn(G(tg).home,3));news(`${fullName(p)} and ${q.name} found each other again, thanks to ${pl.name}.`,"good",[p.id,q.id])}relAdd(p,q,15)}}
  if(a==="end")note(`${p.name} turns back to what ${p.age<13?"they were":p.sex==="F"?"she was":"he was"} doing.`);
  if(UI.afterTalkModal&&!UI.modal){UI.modal=UI.afterTalkModal;UI.afterTalkModal=null}}

// ================= overheard conversations =================
function overhear(a,b){const r=relGet(a,b);const L=[];const s=(p,t)=>L.push(`${p.name}: ${styleSay(p,t)}`);
  const shared=a.mem.filter(m=>m.v<=-8&&m.a!=="you"&&b.mem.some(n=>n.a===m.a)).slice(-1)[0];
  if(a.age<13&&b.age<13){s(a,"Do you think the monsters can swim?");s(b,"No. They'd sink. They're too heavy with dead.");s(a,"That's not how it works.");s(b,"You don't know how it works.");return L}
  if(a.partner===b.id){s(a,pick(["You sleep at all?","Come here. You're freezing.","I keep thinking about the house."]));s(b,pick(["A little. You?","I'm fine. Stop worrying.","We'll get a house again. A better one."]));s(a,"Promise me we stay together. Whatever happens.");s(b,"*takes their hand* Whatever happens.");return L}
  if(shared){const who=P(shared.a);s(a,`I keep thinking about ${who?who.name:"them"}.`);s(b,"Me too. Every time I close my eyes.");s(a,pick(["They didn't deserve that.","It should've been me.","Do you think they knew it was us at the end?"]));s(b,"*long silence* ...Get some sleep. I'll take your watch.");return L}
  if(r<-30){s(a,pick([`You took the last of the coffee again.`,`You were supposed to be on watch.`,`I saw you skimming from the store.`]));s(b,pick(["Prove it.","So report me.","Mind your own business for once."]));s(a,"One of these days, somebody's going to get hurt because of you.");s(b,"Is that a threat?");return L}
  const g=a.group?G(a.group):null;const L2=g&&g.leader!==a.id&&g.leader!=="you"?P(g.leader):null;
  const topics=[()=>{s(a,`What did you do, before?`);s(b,`${JOBS[b.job].n}. ${b.facts.bio?"":"Feels like a hundred years ago."}`);s(a,`I was a ${JOBS[a.job].n.toLowerCase()}. I hated it. I'd kill to go back.`);s(b,"*laughs* Wouldn't we all.")},
    ()=>{s(a,`What do you miss most?`);s(b,cap(b.facts.likes)+".");s(a,`For me it's ${a.facts.likes}.`);s(b,"Maybe we find some on the next run.")},
    ()=>{const n=S.news.find(n=>S.t-n.t<DAY*2);s(a,`Did you hear? ${n?n.x:"The radio's dead."}`);s(b,pick(["God help us.","Figures.","Doesn't surprise me.","I heard something different."]));s(a,"You think we're next?");s(b,pick(["Not if I can help it.","Everybody's next, eventually.","Don't say that."]))},
    ()=>{if(L2){const f=relGet(a,L2);s(a,`What do you make of ${L2.name}?`);s(b,relGet(b,L2)>20?"They're keeping us alive. That's enough for me.":"They're in over their head.");s(a,f>20?"I trust them.":"I'm not sure I do.")}else{s(a,"Who do you think's really in charge around here?");s(b,"Whoever has the food.")}},
    ()=>{s(a,`You ever think about ${S.player.name}?`);const f=feel(b);s(b,f>30?`I like them. They've got a good head.`:f<-20?`I don't trust them.`:`Don't know them well.`);s(a,feel(a)>30?"Same. I'd follow them.":"We'll see.")},
    ()=>{s(a,`What scares you most? Really.`);s(b,cap(b.facts.fear)+".");s(a,`Me, it's ${a.facts.fear}.`);s(b,"...We should stop talking about this.")}];
  pick(topics)();return L}

// ================= events (cards) =================
function queueEvent(id,loc,until,data={}){if(S.pending.some(e=>e.id===id))return;S.pending.push({id,loc,until,data})}
function checkPending(){if(!S)return;for(const e of [...S.pending]){if(S.t>e.until){S.pending=S.pending.filter(x=>x!==e);const ev=EVENTS[e.id];if(ev.auto){const txt=ev.auto(e.data);if(txt)news(txt,"big")}}}
  if(!UI.modal&&!UI.inChoice){const r=here();const e=S.pending.find(e=>e.loc==="any"||e.loc===r);if(e&&e.until>=S.t&&(e.at||0)<=S.t){S.pending=S.pending.filter(x=>x!==e);UI.modal={type:"event",id:e.id,data:e.data};render()}}}
function speakCheck(d){return S.player.sk.speak*12+rnd(0,60)>=d}
function fightCheck(d){return S.player.sk.fight*8+(weapon()?ITEMS[weapon().id].dmg*3:0)+armor()*2+rnd(0,60)>=d}
const EVENTS={
  morning:{title:"Sirens",text:()=>`It starts with sirens, then a lot of them. Your phone has no signal. Down the street, people are running, and one man is walking very slowly after them. His shirt is soaked dark down the front.\n\nWhatever happened at the clinic, it's coming this way.`,
    choices:[{t:"Go home, lock the doors and wait",go:()=>{S.player.flags.lockedIn=true;const hb=BMAP[S.player.home];const q=insidePos(hb);S.player.x=q.x;S.player.z=q.z;for(const d of hb.doors){d.open=false;d.bar=1}snapFollowers();return"You run home and drag the couch across the door. For a long time, nothing happens. Then something bangs against the back fence and doesn't stop."}},
      {t:"Run to the Food Mart before everyone else does",go:()=>{invAdd("canned_food",2);invAdd("water_bottle",2);S.player.hp-=rnd(0,10);const b=BMAP.grocery;const q=insidePos(b);S.player.x=q.x;S.player.z=q.z;snapFollowers();return"Main Street is chaos. Someone's smashed the Food Mart doors. You grab what you can carry and get out. A woman is screaming in the parking lot and you don't look back."}},
      {t:"Stay out and see what's happening",go:()=>"You stay where you are and watch. People run past. Somebody is crying somewhere you can't see. The man with the dark shirt turns his head toward you, slowly, like he heard his name."},
      {t:"Go knock on your neighbors' doors",go:()=>{const ns=living().filter(p=>p.home&&BMAP[p.home]&&dist(BMAP[p.home].x,BMAP[p.home].z,S.player.x,S.player.z)<25&&p.age>=16).slice(0,4);for(const p of ns){p.met=true;p.trust+=12;p.aff+=6;mem(p,`${S.player.name} came to check on us the morning it started.`,5)}return`You check on the houses around yours. ${ns.map(p=>p.name).join(", ")||"Nobody answers"}${ns.length?" open the door, scared and grateful.":"."} At least now you know who's around.`}}]},
  lead_offer:{title:"They're Asking for You",text:d=>`A few people find you after supper. "We've been talking. People listen to you. People trust you. ${fullName(P(G(d.gid).leader)||S.player)} has had their turn. Will you lead ${G(d.gid).name}?"`,
    choices:[{t:"Yes. I'll lead",go:d=>{const g=G(d.gid);const old=P(g.leader);g.leader="you";if(old){old.trust-=20;mem(old,`${S.player.name} took ${g.name} from me.`,-10)}news(`${S.player.name} now leads ${g.name}.`,"big");return"It's not a ceremony. It's just everyone looking at you a little differently. The group's orders and building plans are yours now (Group tab)."}},
      {t:"Not yet",go:()=>{S.flags.declinedLead=true;return"They're disappointed, but some of them respect you more for it."}}]},
  raid:{title:"Raid",text:d=>`Shouting at the edge of camp. Flashlights, engines, a gunshot. ${G(d.att).name} has come for your supplies.`,
    choices:[{t:"Fight them off",go:d=>{const def=defense(S.player.group)+(fightCheck(60)?10:0);S.player.hp-=Math.max(2,rnd(5,25)-armor()*2);skillUp("fight",.4);for(const q of members(S.player.group))q.trust+=3;return resolveRaid(G(d.att),myGroup(),d.pow,def,true)+wearWeapon(3)}},
      {t:"Hide the food and let them take what's left",go:d=>{const g=myGroup();const keep=g.stock.food*.6;const r=resolveRaid(G(d.att),g,d.pow,0,false);g.stock.food+=keep*.8;return r+" You'd hidden most of the food, though."}},
      {t:"Walk out and talk",go:d=>{if(speakCheck(70)){G(d.att).rel[S.player.group]=-10;return`You walk out with your hands up and talk until your throat hurts. They take ten cans and leave. Nobody dies tonight.`}return resolveRaid(G(d.att),myGroup(),d.pow,defense(S.player.group)-5,false)}}],
    auto:d=>resolveRaid(G(d.att),myGroup(),d.pow,defense(S.player.group),false)},
  herd:{title:"The Herd",text:()=>`The ground shakes before you see them. Hundreds of the dead, spilling off the highway and across the fields. They're coming past the camp.`,
    choices:[{t:"Hold the walls",go:d=>{const def=defense(S.player.group)+(fightCheck(55)?8:0);S.player.hp-=rnd(5,20);if(def>=d.pow)return"You hold. All night, the walls shake, and all night you hold. By dawn the herd has moved south."+wearWeapon(5);const v=shuffle(members(S.player.group)).slice(0,rnd(1,3));for(const p of v)kill(p,"was pulled over the wall by the herd");return`The wall gives at the north end. ${v.map(p=>p.name).join(" and ")} didn't make it.`+wearWeapon(5)}},
      {t:"Everyone goes silent and dark",go:d=>{if(rf()<.6+S.player.sk.speak*.03)return"Nobody breathes. Not a light, not a word, for six hours. The herd passes. You'll never forget the smell.";const v=pick(members(S.player.group));if(v)kill(v,"panicked and ran when the herd passed");return`Someone panics. ${v?v.name+" runs, and the herd follows them.":"The herd turns."} It's over fast.`}}],
    auto:d=>{if(defense(S.player.group)>=d.pow)return"The herd passed your camp. The walls held.";const v=shuffle(members(S.player.group)).slice(0,rnd(1,3));for(const p of v)kill(p,"was killed when the herd hit camp");return"The herd hit your camp while you were away."}},
  name_child:{title:"A Name",text:d=>`The baby is small and loud and completely real. ${P(d.child).sex==="F"?"A girl":"A boy"}. They need a name.`,input:"childname"},
};

// ================= conversations: the game decides what happens, Claude writes how each person says it =================
const AI={ns:null,tried:false,on:true,busy:false,ctl:null,cool:0,fails:0};
function aiInit(){if(AI.tried)return;AI.tried=true;try{AI.on=localStorage.getItem("twd.ai")!=="0"}catch(e){}
  try{const c=window.claude;if(c&&typeof c.use==="function")Promise.resolve(c.use("sample")).then(ns=>{AI.ns=ns||null;if(S&&UI.talkTo)markUI();const n=document.getElementById("cai");if(n)n.textContent=aiHelpText()}).catch(()=>{AI.ns=null})}catch(e){AI.ns=null}}
function aiReady(){return!!(AI.ns&&AI.on&&Date.now()>AI.cool)}
function aiStateText(){if(UI.talkBusy)return"thinking...";if(!AI.ns)return"";if(!AI.on)return"Claude voices: off";if(Date.now()<AI.cool)return"Claude voices: resting";return"Claude voices: on"}
function aiHelpText(){return AI.ns?"When you talk to people, Claude writes their words in their own voice, using your Claude usage. The first time, you'll be asked to allow it. You can switch it off in the talk box.":""}
function talkAbort(){if(AI.ctl){try{AI.ctl.abort()}catch(e){}AI.ctl=null}}
// the small details that make each person themselves, fixed for life by who they are
function persona(p){if(p._pz)return p._pz;const R=srng(hashStr(p.id+"/voice"));const sd=p.seed&&SEEDP[p.seed]||{};
  const o={quirk:sd.quirk||pick2(QUIRKS,R),values:sd.values||pick2(VALUES,R),flaw:sd.flaw||pick2(FLAWS,R),hook:sd.hook||(p.age<13?"":pick2(HOOKS,R)),morning:pick2(MORNING,R),kid:p.age<13?pick2(KIDQ,R):"",secret:sd.secret||p.facts.secret};
  Object.defineProperty(p,"_pz",{value:o,enumerable:false,writable:true});return o}
const ACTWORDS={follow:"agrees to come along with {pn} and starts following them",stay:"stops following {pn} and stays where they are",trade:"is willing to trade; a trade opens right after this line",
  attack:"loses their temper and swings at {pn}",romance_yes:"says yes: they want to be together with {pn}",child_yes:"agrees to try for a child with {pn}",break_up:"ends their relationship with {pn}",
  join_their:"welcomes {pn} into their group",join_mine:"agrees to join {pn}'s group, with their family",leave_mine:"hears that {pn} is leaving the group",take_lead:"hands leadership of their group to {pn}",end:"is done talking and turns back to what they were doing"};
function sentence(t){t=String(t||"").trim();return!t?"":/[.!?]$/.test(t)?t:t+"."}
function feelWords(t,pn){return{hostile:`hates ${pn}`,cold:`is cold toward ${pn}`,neutral:`doesn't know ${pn} well yet`,friendly:`likes ${pn}`,close:`is close to ${pn}`}[t]||`doesn't know ${pn} well yet`}
function heShe(p){return p.age<13?"they":p.sex==="F"?"she":"he"}

    for(const q of L){if(x<q.x0||x>q.x1||z<q.z0||z>q.z1)continue;if(q.k==="wall"||q.k==="rock")return false;if(q.k==="door"&&!q.d.open&&!q.d.broken)return false}}return true}
function zedNear(r){const pl=S.player;for(const z of S.zeds){if(Math.abs(z.x-pl.x)>r||Math.abs(z.z-pl.z)>r)continue;const d=dist(z.x,z.z,pl.x,pl.z);if(d<r&&(d<r*.45||losClear(z.x,z.z,pl.x,pl.z)))return true}return false}
function nearPeople(r){const pl=S.player;const here=bldAt(pl.x,pl.z);
  return S.people.filter(p=>p.alive&&p.age>=2&&Math.abs(p.x-pl.x)<r&&Math.abs(p.z-pl.z)<r&&dist(p.x,p.z,pl.x,pl.z)<r&&(bldAt(p.x,p.z)===here||isFollower(p))).sort((a,b)=>dist(a.x,a.z,pl.x,pl.z)-dist(b.x,b.z,pl.x,pl.z))}

// ---------- doors: open, shut, locked, boarded, broken ----------
function doorBld(D){return BMAP[D.b]}
function houseLocked(D){if(!D.ext||!S.flags.alarm)return false;const b=doorBld(D);if(!isHome(b)||b.id===S.player.home)return false;if((D.welcome||0)>S.t)return false;
  const g=S.player.group&&G(S.player.group);if(g&&b.site&&g.home===b.site)return false;return residentsHome(b).some(p=>p.age>=14)}
function doorLocked(D){if(D.broken)return false;if(D.bar>0)return"bar";if(D.lock)return"lock";if(houseLocked(D))return"home";return false}
function doorOpen(D){return D.open||D.broken}
function doorMaxHp(D){return 100+(D.bar||0)*150}
function playerSide(D){if(!D.ext)return"in";const d=D.dw;const a=d.p[d.inSide],o=d.p[d.outSide];const pl=S.player;return dist(pl.x,pl.z,a.x,a.z)<dist(pl.x,pl.z,o.x,o.z)?"in":"out"}
function doorBlocked(D){const bx=D.box;const hit=e=>e.x>bx.x0-.3&&e.x<bx.x1+.3&&e.z>bx.z0-.3&&e.z<bx.z1+.3;const pl=S.player;if(hit(pl))return true;for(const z of S.zeds)if(hit(z))return true;for(const p of S.people)if(p.alive&&hit(p))return true;return false}
// door state lives in S.doors so it survives a reload; only what differs from how the building was built is kept
function doorsIn(){for(const D of DOORS){if(D.lock0===undefined)D.lock0=D.lock;const s=S.doors[D.id];D.open=s?!!s.o:!D.ext&&!D.lock0;D.lock=s&&"l" in s?s.l:D.lock0;D.bar=s?s.b||0:0;D.hp=s?s.h??100:100;D.broken=!!(s&&s.x);D.welcome=s?s.w||0:0;D.refused=s?s.r||0:0;D.auto=false}}
function doorSave(D){const def=!D.ext&&!D.lock0;const s={};if(!!D.open!==def)s.o=D.open?1:0;if(D.lock!==D.lock0)s.l=D.lock;if(D.bar)s.b=D.bar;if(D.hp!==100)s.h=Math.round(D.hp);if(D.broken)s.x=1;if(D.welcome>S.t)s.w=D.welcome;if(D.refused&&S.t-D.refused<240)s.r=D.refused;
  if(Object.keys(s).length)S.doors[D.id]=s;else delete S.doors[D.id]}
function doorsOut(){for(const D of DOORS)doorSave(D)}
function lockedMsg(D){const k=doorLocked(D);return k==="bar"?(playerSide(D)==="in"?"The door's boarded up. Press E to take the boards down.":"Someone boarded this door from the inside."):k==="home"?"Locked. Someone's home. You could knock.":hasTool("pry")?"Locked. Your crowbar could open it.":"Locked. You could kick it in, but it'll be loud."}
function useDoor(D){const pl=S.player;if(!D||pl.alive===false)return;const lk=doorLocked(D);
  if(doorOpen(D)){if(D.broken){toast("The door's off its hinges. It won't close.");return}if(doorBlocked(D)){toast("Something's in the way.");return}D.open=false;D.auto=false;doorSave(D);return}
  if(!lk){D.open=true;D.auto=false;doorSave(D);return}
  if(lk==="bar"){if(playerSide(D)==="in")startTask(3.5,"Taking the boards down",()=>{D.bar=Math.max(0,D.bar-1);D.hp=Math.min(D.hp,doorMaxHp(D));if(rf()<.6)invAdd("wood",1,true);doorSave(D);noise(D.x,D.z,6);toast(D.bar?"One board down. More to go.":"The boards are off.")});
    else if(hasTool("pry"))startTask(6,"Prying the boards off",()=>{D.bar=Math.max(0,D.bar-1);D.hp=Math.min(D.hp,doorMaxHp(D));wearTool("pry",2);doorSave(D);noise(D.x,D.z,12);toast(D.bar?"A board comes loose. There are more.":"The last board comes away.")});
    else kickDoor(D);return}
  if(lk==="home"){if(D.refused&&S.t-D.refused<120)kickDoor(D);else knock(doorBld(D),D);return}
  if(lk==="lock"){if(hasTool("pry"))startTask(4,"Prying the lock",()=>{D.lock=null;wearTool("pry",2);doorSave(D);noise(D.x,D.z,10);skillUp("scavenge",.04);toast("The frame splinters and the lock gives.")});else kickDoor(D)}}
function kickDoor(D){const pl=S.player;if(W3.cd>0)return;W3.cd=.9;W3.swing=.2;pl.energy=Math.max(0,pl.energy-1.2);noise(D.x,D.z,15);
  D.hp-=14+pl.sk.fight*2+(weapon()?ITEMS[weapon().id].dmg:0);
  const b=doorBld(D);if(isHome(b)){for(const p of residentsHome(b)){p.trust=clamp(p.trust-6,-100,100);if(!p.kicked){p.kicked=S.t;mem(p,`${pl.name} tried to kick our door in.`,-12)}}}
  if(D.hp<=0){D.broken=true;D.open=true;D.bar=0;D.lock=null;doorSave(D);toast("The door bursts open.");journal(`You kicked in a door at ${b?b.n:"a building"}.`,"");return}
  doorSave(D);toast(D.hp<35?"The frame is cracking. One or two more.":"You kick the door. It holds.")}
function canBoard(){return hasTool("hammer")&&invHas("wood",2)&&invHas("nails",1)}
function boardDoor(D){if(!D||doorOpen(D)||D.bar>=3)return;if(!canBoard()){toast("You need a hammer, 2 wood and a box of nails to board up a door.");return}
  startTask(6,"Boarding up the door",()=>{if(!canBoard()||doorOpen(D))return;invTake("wood",2);invTake("nails",1);wearTool("hammer",2);D.bar=(D.bar||0)+1;D.hp=Math.min(doorMaxHp(D),D.hp+150);doorSave(D);noise(D.x,D.z,14);skillUp("build",.08);
    toast(D.bar>1?`You add another board. That's ${D.bar} now.`:"You nail boards across the door. It won't open now, from either side, until someone pries them off.");journal("You boarded up a door.","")})}
// knocking on a door where people are home
function knock(b,D){const pl=S.player;const res=residentsHome(b);if(!res.length){toast("Nobody answers.");return}
  const head=res.filter(p=>p.age>=16).sort((a,c)=>feel(c)-feel(a))[0]||res[0];
  const opens=!S.flags.clinic||(head.met&&feel(head)>-20)||rf()<.42+head.tr.kind*.35;noise(D.x,D.z,7);
  if(!opens){D.refused=S.t;doorSave(D);mem(head,`${pl.name} knocked on our door after it started. We didn't open.`,0);toast("Nobody answers. You hear someone inside, holding their breath.");return}
  D.welcome=S.t+180;D.open=true;doorSave(D);const ins=D.dw.p[D.dw.inSide];head.x=ins.x;head.z=ins.z;head.tx=head.x;head.tz=head.z;head.path=null;head.door=S.t+45;
  head.chat.push({w:"sys",x:`${head.met?head.name:"Someone"} opens the door${S.flags.alarm?" a crack":""}.`});
  head.chat.push({w:"them",x:styleSay(head,S.flags.clinic?pick(["Who's there? ...Oh. What do you want?","Are you alone? Are you bit?","Keep your voice down. They hear everything."]):pick(["Morning. Can I help you?","Oh, hi. Everything okay?","Yes?"]))});
  syncFigs();openTalk(head.id)}
// walking into somebody's home uninvited
function intrusion(b){const pl=S.player;if(!isHome(b)||b.id===pl.home)return;const res=residentsHome(b).filter(p=>p.act!=="asleep"&&p.age>=8);if(!res.length)return;
  const D=b.doors.find(d=>d.ext&&(d.welcome||0)>S.t);if(D)return;pl.flags.intr=pl.flags.intr||{};const k=b.id+":"+dayOf(S.t);if(pl.flags.intr[k])return;pl.flags.intr[k]=1;
  for(const p of res){const f=feel(p);const ok=f>35||p.fam.you;if(ok)continue;p.trust=clamp(p.trust-(S.flags.alarm?8:5),-100,100);p.aff=clamp(p.aff-4,-100,100);mem(p,`${pl.name} walked into our house without knocking.`,-4);
    bubble(p,styleSay(p,pick(S.flags.alarm?["Whoa, whoa. Who let you in?","Get out of my house.","Are you bit? Stay back."]:["Uh, hello? Can I help you?","This is my house.","Did you knock?"])))}}

// ---------- timed things you do with your hands ----------
function startTask(secs,label,done,o={}){if(W3.task)return;W3.task={t:0,n:secs,label,done,o};W3.ptarget=null;W3.path=null}
function cancelTask(why){if(!W3.task)return;W3.task=null;if(why)toast(why)}
function taskTick(dt){const T=W3.task;if(!T)return;T.t+=dt*Math.min(4,UI.speed);if(T.t>=T.n){W3.task=null;try{T.done()}catch(e){console.error(e)}save();markUI()}}

// ---------- noise draws the dead ----------
function noise(x,z,r){for(const zd of S.zeds){if(zd.st==="chase")continue;if(Math.abs(zd.x-x)>r||Math.abs(zd.z-z)>r)continue;const d=dist(zd.x,zd.z,x,z);if(d>r)continue;if(d>r*.5&&!losClear(zd.x,zd.z,x,z))continue;
  zd.st="hunt";zd.tx=x+(rf()-.5)*3;zd.tz=z+(rf()-.5)*3;const Z=zst(zd);Z.path=null}}

// ---------- walking along a path of waypoints ----------
// returns 2 when the path is done, 1 after a step, 0 when blocked
function walkAlong(e,path,st,s,who,r){while(st.pi<path.length){const w=path[st.pi];const dx=w.x-e.x,dz=w.z-e.z,l=Math.hypot(dx,dz);const last=st.pi===path.length-1;
    if(l<(last?.06:.22)){st.pi++;continue}const k=Math.min(l,s);return step(e,dx/l*k,dz/l*k,r,who)?1:0}return 2}
function cancelWalk(){W3.ptarget=null;W3.path=null;W3.talkOnArrive=null;W3.attackT=null;W3.useOnArrive=null}
function walkTo(x,z,keep){if(!keep){W3.talkOnArrive=null;W3.attackT=null;W3.useOnArrive=null}const pl=S.player;x=clamp(x,WB.x0+1,WB.x1-1);z=clamp(z,WB.z0+1,WB.z1-1);
  W3.ptarget={x,z};W3.path=navPath(pl.x,pl.z,x,z);W3.pst={pi:0};W3.repath=.6}

// ---------- townsfolk ----------
function moveNPCs(dt){const pl=S.player;const sp=1.45*Math.min(4,UI.speed);let idx=0;const now=performance.now();
  for(const p of S.people){if(!p.alive)continue;
    if(p.age<2){const m=P(p.parents[0])||P(p.parents[1]);if(m&&m.alive!==false&&m.x!=null){p.x=m.x;p.z=m.z;p.tx=m.x;p.tz=m.z}continue}
    if(W3.fset.has(p.id)){followerMove(p,idx++,dt);continue}
    if(UI.talkTo===p.id&&dist(p.x,p.z,pl.x,pl.z)<4)continue;
    const d=dist(p.x,p.z,p.tx,p.tz);if(d<.1){p.path=null;continue}
    const far=Math.abs(p.x-pl.x)>75||Math.abs(p.z-pl.z)>75;const s=sp*dt*(p.health<45?.6:1)*(far?3:1);
    if(far){p.path=null;const k=Math.min(d,s);p.x+=(p.tx-p.x)/d*k;p.z+=(p.tz-p.z)/d*k;continue}
    if(!p.path||p.ptx!==p.tx||p.ptz!==p.tz){p.path=navPath(p.x,p.z,p.tx,p.tz);p.pi=0;p.ptx=p.tx;p.ptz=p.tz}
    const r=walkAlong(p,p.path,p,s,"npc",.27);
    if(r===2){p.path=null;if(d>.3){p.x=p.tx;p.z=p.tz}}
    else if(r===0){p._st=(p._st||0)+dt;if(p._st>2.2){p._st=0;const w=p.path[p.pi];if(w&&free(w.x,w.z,.27,"npc")){p.x=w.x;p.z=w.z;p.pi++}else{p.x=p.tx;p.z=p.tz;p.path=null}}}
    else{p._st=0;const D=doorAt(p.x,p.z,.32);if(D&&!D.open)D.npcT=now+900}}}
function followerMove(p,idx,dt){const pl=S.player;const side=idx%2?1:-1,row=Math.floor(idx/2);const a=W3.ang+Math.PI+side*(.6+row*.25);const rr=1.35+row*.8;const plk=roomKey(pl.x,pl.z);
  let want={x:pl.x+Math.sin(a)*rr,z:pl.z+Math.cos(a)*rr},fight=null;
  if(p.age>=14&&p.tr.brave>.25&&p.health>30){let bd=6;for(const z of S.zeds){if(Math.abs(z.x-pl.x)>7||Math.abs(z.z-pl.z)>7)continue;const d=dist(z.x,z.z,pl.x,pl.z);if(d<bd&&dist(z.x,z.z,p.x,p.z)<10&&losClear(p.x,p.z,z.x,z.z)){bd=d;fight=z}}if(fight)want={x:fight.x,z:fight.z}}
  if(!fight&&(roomKey(want.x,want.z)!==plk||!free(want.x,want.z,.27,"npc")))want={x:pl.x,z:pl.z};
  const d=dist(p.x,p.z,want.x,want.z);
  if(d>40){snapOne(p,idx);return}
  if(d>(fight?1.1:want.x===pl.x&&want.z===pl.z?1.1:.3)){const spd=d>4?5.2:d>1.6?3.4:1.5;const s=Math.max(0,Math.min(d-(fight?1:0),spd*dt));
    let st=W3.fst.get(p.id);if(!st)W3.fst.set(p.id,st={path:null,pi:0,t:0});st.t-=dt;let r;
    if(roomKey(p.x,p.z)!==roomKey(want.x,want.z)||!losClear(p.x,p.z,want.x,want.z)){if(!st.path||st.t<=0){st.path=navPath(p.x,p.z,want.x,want.z);st.pi=0;st.t=.7}r=walkAlong(p,st.path,st,s,"npc",.27);if(r===2)st.path=null}
    else{st.path=null;const dx=want.x-p.x,dz=want.z-p.z,l=Math.hypot(dx,dz)||1;r=step(p,dx/l*s,dz/l*s,.27,"npc")?1:0}
    if(r===0){p._st=(p._st||0)+dt;if(p._st>1.6&&d>3){snapOne(p,idx);p._st=0}}else{p._st=0;const D=doorAt(p.x,p.z,.32);if(D&&!D.open)D.npcT=performance.now()+900}}
  p.tx=p.x;p.tz=p.z;p.path=null;p.loc=regionAt(p.x,p.z)}
function snapOne(p,i){const pl=S.player;const k=roomKey(pl.x,pl.z);for(let t=0;t<12;t++){const a=i*1.3+2.2+t*.9,r=1.2+(t>5?.6:0);const x=pl.x+Math.sin(a)*r,z=pl.z+Math.cos(a)*r;if(free(x,z,.27,"npc")&&roomKey(x,z)===k&&losClear(pl.x,pl.z,x,z)){p.x=x;p.z=z;p.tx=x;p.tz=z;return}}p.x=pl.x;p.z=pl.z;p.tx=p.x;p.tz=p.z}
function snapFollowers(){if(!S)return;const pl=S.player;let i=0;for(const p of S.people)if(isFollower(p)){if(dist(p.x,p.z,pl.x,pl.z)>5||roomKey(p.x,p.z)!==roomKey(pl.x,pl.z))snapOne(p,i);const st=W3.fst.get(p.id);if(st)st.path=null;i++}}
function snapCamera(){W3.camX=S.player.x;W3.camZ=S.player.z}

// ---------- you ----------
function playerMove(dt){const pl=S.player;const k=W3.keys;let mx=0,mz=0;
  if(k.w||k.arrowup){mx-=1;mz-=1}if(k.s||k.arrowdown){mx+=1;mz+=1}if(k.a||k.arrowleft){mx-=1;mz+=1}if(k.d||k.arrowright){mx+=1;mz-=1}
  if(mx||mz){cancelWalk();const l=Math.hypot(mx,mz);mx/=l;mz/=l}
  else{
    if(W3.attackT){const z=W3.zmap.get(W3.attackT);if(!z||!S.zeds.includes(z))W3.attackT=null;else{const d=dist(z.x,z.z,pl.x,pl.z);if(d<=reach()&&losClear(pl.x,pl.z,z.x,z.z)){W3.path=null;W3.ptarget=null;W3.ang=Math.atan2(z.x-pl.x,z.z-pl.z);swingAt(z)}else if((W3.repath-=dt)<=0){walkTo(z.x,z.z,true);W3.repath=.5}}}
    if(W3.talkOnArrive){const p=P(W3.talkOnArrive);if(!p||!p.alive)W3.talkOnArrive=null;else if(dist(p.x,p.z,pl.x,pl.z)<1.9&&losClear(p.x,p.z,pl.x,pl.z)){W3.talkOnArrive=null;W3.path=null;W3.ptarget=null;openTalk(p.id)}else if((W3.repath-=dt)<=0){walkTo(p.x,p.z,true);W3.repath=.6}}
    if(W3.useOnArrive&&useReached(W3.useOnArrive)){const u=W3.useOnArrive;W3.useOnArrive=null;W3.path=null;W3.ptarget=null;doUse(u)}
    if(W3.path){const st=W3.pst;while(st.pi<W3.path.length){const w=W3.path[st.pi];const dx=w.x-pl.x,dz=w.z-pl.z,l=Math.hypot(dx,dz);const last=st.pi===W3.path.length-1;if(l<(last?.12:.25)){st.pi++;continue}mx=dx/l;mz=dz/l;break}
      if(st.pi>=W3.path.length){W3.path=null;W3.ptarget=null;if(W3.useOnArrive){const u=W3.useOnArrive;W3.useOnArrive=null;if(useReached(u,1.5))doUse(u)}}}}
  W3.moving=false;if(!(mx||mz))return;if(W3.task)cancelTask();
  const enc=weight()>maxW();const run=W3.run&&pl.energy>8&&!enc;let spd=(run?5.4:3.2)*(enc?.6:1)*(pl.energy<10?.7:1)*(pl.hp<30?.75:1);if(onFord(pl.x,pl.z))spd*=.45;
  // a door in front of you opens if it can
  const D=doorAt(pl.x+mx*.5,pl.z+mz*.5,.28);if(D&&!doorOpen(D)){if(!doorLocked(D)){D.open=true;D.auto=true;W3.autoDoors.add(D);doorSave(D)}else{const t=performance.now();if(t-(W3.lockMsg||0)>2500){W3.lockMsg=t;toast(lockedMsg(D))}if(W3.path){W3.path=null;W3.ptarget=null}}}
  const s=spd*dt;const moved=step(pl,mx*s,mz*s,.3,"pl");
  if(!moved&&W3.path){W3.stuckT=(W3.stuckT||0)+dt;if(W3.stuckT>1.2){W3.path=null;W3.ptarget=null;W3.stuckT=0}}else W3.stuckT=0;
  W3.ang=Math.atan2(mx,mz);W3.moving=true;
  if(run){pl.energy=Math.max(0,pl.energy-dt*.12);W3.runN=(W3.runN||0)+dt;if(W3.runN>.6){W3.runN=0;noise(pl.x,pl.z,9)}}
  if(onFord(pl.x,pl.z))pl.warmth=Math.max(0,pl.warmth-dt*.3)}
// doors you pushed open by walking swing shut behind you
function autoDoors(){const pl=S.player;for(const D of W3.autoDoors){if(!D.open||!D.auto){W3.autoDoors.delete(D);continue}if(dist(D.x,D.z,pl.x,pl.z)>2.1&&!doorBlocked(D)){D.open=false;D.auto=false;doorSave(D);W3.autoDoors.delete(D)}}}
function useReached(u,extra=0){const pl=S.player;
  if(u.k==="cont"){const c=CONTS[u.id];if(!c)return true;return contReach(c,pl.x,pl.z)<.75+extra&&(!c.f||roomKey(pl.x,pl.z)===c.b+"/"+c.room||extra>0)}
  if(u.k==="door")return dist(u.D.x,u.D.z,pl.x,pl.z)<1.25+extra;
  if(u.k==="pile"){const p=S.piles.find(q=>q.id===u.id);return!p||dist(p.x,p.z,pl.x,pl.z)<1.2+extra}return true}
function doUse(u){if(u.k==="cont")tryOpenCont(u.id);else if(u.k==="door")useDoor(u.D);else if(u.k==="pile")openCont(u.id)}

// ---------- the dead ----------
// what each nearby walker is doing right now (kept out of the save)
function zst(z){let s=W3.zst.get(z.id);if(!s)W3.zst.set(z.id,s={tgt:null,lt:0,path:null,pi:0,pt:0,bang:0,cd:0});return s}
function hasLight(){return invHas("flashlight")}
function lightOn(){return W3.night&&W3.flOn&&hasLight()}
function moveZeds(dt){const pl=S.player;const wx=wxName();const sight=(W3.night?(lightOn()?7.5:5):11)*(wx==="fog"?.7:wx==="rain"?.85:1);
  const act=[];for(const z of S.zeds)if(Math.abs(z.x-pl.x)<55&&Math.abs(z.z-pl.z)<55)act.push(z);
  const tg=[pl,...W3.followers];const now=performance.now();
  for(const z of act){const Z=zst(z);if(z.stun>0){z.stun-=dt;continue}
    // look around a few times a second
    Z.lt-=dt;if(Z.lt<=0){Z.lt=.22+rf()*.18;let best=null,bd=1e9;const sr=z.st==="chase"?sight*1.6:sight;
      for(const t of tg){if(t.alive===false)continue;if(Math.abs(t.x-z.x)>sr||Math.abs(t.z-z.z)>sr)continue;const d=dist(z.x,z.z,t.x,t.z);if(d<sr&&d<bd&&losClear(z.x,z.z,t.x,t.z)){bd=d;best=t}}
      if(best){if(Z.tgt!==best)Z.path=null;Z.tgt=best;z.st="chase";z.tx=best.x;z.tz=best.z}
      else if(z.st==="chase"){z.st="hunt";Z.tgt=null;Z.path=null}}

  const sky=CC(SKY[wx]||SKY.clear).clone(),night=CC("#05080d");W3.scene.background=night.clone().lerp(sky,d);if(W3.scene.fog)W3.scene.fog.color.copy(W3.scene.background);

  const fire=nearFireObj();if(fire){W3.fireLight.position.set(fire.x,1.2,fire.z);W3.fireLight.intensity=W3.night?1.6:.5}else W3.fireLight.intensity=0;

  g.drawImage(mc,0,0,mc.width,mc.height,0,0,w,h);const sx=w/(WB.x1-WB.x0),sz=h/(WB.z1-WB.z0);const X=x=>(x-WB.x0)*sx,Z=z=>(z-WB.z0)*sz;

  g.font=`${Math.round(13*(opt.dpr||1))}px Saira Stencil One, sans-serif`;g.fillStyle="rgba(233,228,215,.75)";for(const k of ["town","woods","fields","hills","quarry","farm","church","school","lodge","mill","river"]){if(!PLACES[k])continue;const r=PLACES[k].r[0];const t=PLACES[k].n;g.fillText(t,X((r[0]+r[2])/2)-g.measureText(t).width/2,Z((r[1]+r[3])/2))}

  g.fillStyle="#d4574a";for(const z of S.zeds)if(Math.abs(z.x-pl.x)<35&&Math.abs(z.z-pl.z)<35)g.fillRect(X(z.x)-1,Z(z.z)-1,2,2);

// ---------- time jumps, the hour, the end ----------
function afterJump(m){const pl=S.player;if(m>=10){for(const z of S.zeds){if(Math.abs(z.x-pl.x)>32||Math.abs(z.z-pl.z)>32)continue;const d=dist(z.x,z.z,pl.x,pl.z);
      if(d<32&&d>4&&rf()<Math.min(.6,m/90)){const f=Math.min(.55,m/120);const ox=z.x,oz=z.z;z.x+=(pl.x-z.x)*f;z.z+=(pl.z-z.z)*f;if(!free(z.x,z.z,.3,"zed")||roomKey(z.x,z.z)!==roomKey(ox,oz)&&bldAt(z.x,z.z)){z.x=ox;z.z=oz}z.r=regionAt(z.x,z.z);W3.zst.delete(z.id)}}}
  if(m>=15)for(const p of S.people)if(p.alive&&!isFollower(p)&&p.age>=2){p.x=p.tx;p.z=p.tz;p.path=null}
  snapFollowers();cancelWalk()}
function act(mins,opt){advance(mins,opt||{});if(S.player.alive!==false)afterJump(mins)}
function worldHour(h){if(S.player.alive===false)return;
  for(const z of [...S.zeds]){if(PLACES[z.r]?.site&&ownerOf(z.r)&&dist(z.x,z.z,S.player.x,S.player.z)>22&&rf()<.6)S.zeds.splice(S.zeds.indexOf(z),1)}
  if(h===8||h===18)feedFollowers();
  if(S.player.fire&&S.player.fire.until<=S.t)S.player.fire=null;
  for(const p of S.piles)if(S.t-p.t>DAY*4&&dist(p.x,p.z,S.player.x,S.player.z)>30)p.c.items=[];cleanPiles();
  markUI()}
function feedFollowers(){const pl=S.player;for(const p of S.people){if(!isFollower(p)||p.group||p.age<2||p.hunger>65)continue;
  let f=Object.keys(p.pack||{}).find(k=>ITEMS[k]?.eat&&!ITEMS[k].eat.sick);if(f){p.pack[f]--;if(!p.pack[f])delete p.pack[f];p.hunger=clamp(p.hunger+ITEMS[f].eat.food*1.6,0,100);continue}
  const hb=BMAP[pl.home];if(hb&&dist(pl.x,pl.z,hb.x,hb.z)<16){if(pl.pantry==null)pl.pantry=rnd(6,12);if(pl.pantry>0){pl.pantry--;p.hunger=clamp(p.hunger+40,0,100);continue}}
  const inv=invMap();f=Object.keys(inv).filter(k=>ITEMS[k].eat&&!ITEMS[k].eat.sick).sort((a,b)=>ITEMS[a].eat.food-ITEMS[b].eat.food)[0];
