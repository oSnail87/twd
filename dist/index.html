const VERB={forage:"You forage for an hour",chop:"You work the deadfall",hunt:"You hunt for three hours",fish:"You fish the slow water for two hours",stone:"You pry loose some stone"};
function gather(kind){const pl=S.player;const r=here();const sv=pl.sk.survive;const got={};const g=(id,n)=>{n=Math.round(n);if(n>0){invAdd(id,n);got[id]=(got[id]||0)+n}};let mins=60;
  if(kind==="forage"){if(!S.flags.winter)g("berries",rnd(0,2)+Math.floor(sv/3)+(r==="woods"||r==="fields"?1:0));if(rf()<.45+sv*.04)g("herbs",rnd(1,2));if((r==="woods"||r==="lodge")&&rf()<.5)g("wood",1);skillUp("survive",.08)}
  if(kind==="chop"){const ax=hasTool("axe");mins=ax?90:60;g("wood",ax?rnd(2,4)+Math.floor(pl.sk.build/4):rnd(0,2));if(ax)wearTool("axe",2);skillUp("build",.05)}
  if(kind==="hunt"){mins=180;const w=weapon();const it=w?ITEMS[w.id]:null;if(!it)return;const p=.22+sv*.06+(it.gun?.25:it.reach?.12:.05);if(it.gun&&invHas("ammo"))invTake("ammo");if(rf()<p){g("raw_meat",rnd(1,3));if(rf()<.4)g("cloth",1)}wearWeapon(2);skillUp("survive",.15)}
  if(kind==="fish"){mins=120;const p=.3+sv*.05+(invHas("rope")?.15:0)+(weapon()&&ITEMS[weapon().id].reach?.1:0);let n=0;for(let i=0;i<3;i++)if(rf()<p)n++;g("raw_fish",n);skillUp("survive",.1)}
  if(kind==="stone"){g("stone",rnd(1,3)+(r==="quarry"?1:0));skillUp("build",.03)}
  act(mins,{work:true});if(pl.alive===false)return;
  const list=Object.entries(got).map(([k,n])=>ITEMS[k].n.toLowerCase()+(n>1?" ×"+n:""));const txt=list.length?`${VERB[kind]}: ${list.join(", ")}.`:`${VERB[kind]}. Nothing to show for it.`;
  journal(txt,list.length?"good":"");toast(txt);if(weight()>maxW())setTimeout(()=>toast("You're carrying too much. You'll move slowly until you drop something."),1800)}
function sleep(){const pl=S.player;if(zedNear(14)){toast("Not with the dead this close.");return}const safe=sleepSafe();const h=hourOf(S.t);
  let mins;if(h>=8&&h<19)mins=240;else{mins=((7-h+24)%24)*60-(S.t%60);if(mins<=0)mins+=DAY;mins=clamp(mins,120,600)}
  S.woke=null;advance(mins,{sleep:true,safe:safe>0});if(pl.alive===false)return;afterJump(mins);
  let visit=false;if(safe<2&&rf()<(safe===1?.1:.38)+Math.min(.3,zedsIn(here())/60)){visit=true;const n=rnd(1,safe===1?1:3);for(let i=0;i<n;i++){const a=rf()*6.28,d=rnd(6,10);const x=pl.x+Math.cos(a)*d,z=pl.z+Math.sin(a)*d;if(free(x,z,.4,"zed")){spawnZed(x,z);const zz=S.zeds[S.zeds.length-1];zz.st="hunt";zz.tx=pl.x;zz.tz=pl.z}}}
  const P2=pl.partner&&P(pl.partner);if(P2&&P2.alive&&dist(P2.x,P2.z,pl.x,pl.z)<10){P2.aff=clamp(P2.aff+2,-100,100);if(rf()<.25)mem(P2,`Fell asleep next to ${pl.name}. First good sleep in days.`,3)}
  const txt=visit?"Something wakes you: shuffling, close by. The dead found you in the dark.":S.woke?`You wake early. ${{thirst:"Your mouth is dry as sand.",hunger:"Your stomach won't let you sleep.",cold:"You're shaking with cold.",pain:"The pain wakes you."}[S.woke]}`:h>=8&&h<19?"You nap for a few hours.":safe===2?"You sleep. Actually sleep. For a few hours you forget.":safe===1?"You sleep behind a shut door, waking at every sound.":"You sleep badly in the open, one ear awake all night.";
  journal(txt,visit?"bad":"");if(visit)toast("The dead found you while you slept.")}
function chores(){const g=myGroup();const pl=S.player;act(120,{work:true});g.stock.food+=.8;g.stock.wood+=.6;g.stock.water+=.5;const ms=shuffle(members(g.id).filter(p=>p.age>=12)).slice(0,3);
  for(const p of ms){p.trust=clamp(p.trust+2,-100,100);p.aff=clamp(p.aff+1,-100,100);p.met=true;if(rf()<.4)mem(p,`${pl.name} pitched in with the work today.`,2)}skillUp("survive",.05);
  journal(`You haul water and split wood${ms.length?" with "+ms.map(p=>p.name).join(", "):""}. Nobody says much, but they notice.`,"good")}
function helpBuild(){const g=myGroup();const s=S.sites[g.home];const site=s.build.find(x=>x.by==="you")||s.build[0];if(!site)return;act(120,{work:true});site.prog+=3+S.player.sk.build*.8;skillUp("build",.12);
  const name=BLD[site.b].n.toLowerCase();if(site.prog>=BLD[site.b].work)finishSite(g.home,site);else journal(`You work on the ${name}. It's ${Math.round(site.prog/BLD[site.b].work*100)}% done.`);
  for(const p of members(g.id).filter(p=>p.role==="builder"))p.trust=clamp(p.trust+2,-100,100)}
function settle(){let g=myGroup();const k=here();if(ownerOf(k))return;const pl=S.player;

  if(g.leader!=="you")return;g.home=k;for(const p of members(g.id)){p.follow=false;placeTo(p,randIn(k,3))}assignRoles(g);
  news(`${g.name} has settled at ${PLACES[k].n}.`,"big");journal(`You've claimed ${PLACES[k].n} for ${g.name}. Plan what gets built from the Group panel.`,"big");UI.panel="group";if(UI.afterSettle){UI.afterSettle=false;UI.modal={type:"name_group"}}}
function listenIn(){const ps=nearPeople(10).filter(p=>p.age>=6&&!isFollower(p));if(ps.length<2)return;const a=pick(ps);const rest=ps.filter(q=>q!==a);const b=rest.find(q=>a.partner===q.id)||rest.sort((x,y)=>Math.abs(relGet(a,y))-Math.abs(relGet(a,x)))[0];

function orphan(p){if(!p.alive||p.age>=16||p.age<2||S.player.kids.includes(p.id))return false;return!p.parents.some(id=>{const q=id==="you"?S.player:P(id);return q&&q.alive!==false})}
function adopt(pid){const p=P(pid);const pl=S.player;if(!p||!orphan(p))return;pl.kids.push(p.id);p.parents.push("you");p.fam.you="guardian";pl.fam[p.id]="kid";p.trust=clamp(p.trust+25,-100,100);p.aff=clamp(p.aff+30,-100,100);

  news(`${pl.name} took in ${p.name}.`,"good",[p.id]);journal(`${p.name} is yours to look after now. ${p.age<10?"They hold your hand and don't let go.":"They pretend not to care. They care."}`,"big")}

// making things
function canCraft(r){for(const [k,v] of Object.entries(r.need))if(!invHas(k,v))return`Missing ${ITEMS[k].n.toLowerCase()}`;if(r.tool&&!hasTool(r.tool))return`Needs a ${r.tool}`;if(r.at==="fire"&&!nearFire())return"Needs a fire";return true}

function deposit(k){const g=myGroup();if(!g||!atHome())return;const n=invCount(k);if(!n||!DEPOSIT[k])return;const [s,m]=DEPOSIT[k];g.stock[s]+=n*m;invTake(k,n);const val=n*ITEMS[k].v;

function renderTalk(){const el=$("talk");if(!el)return;const p=UI.talkTo?P(UI.talkTo):null;if(!p||!p.alive||S.player.alive===false||UI.modal&&UI.modal.type!=="trade"){if(UI.talkTo&&(!p||!p.alive))UI.talkTo=null;el.hidden=true;el.innerHTML="";return}

function positionTalk(force){const el=$("talk");const p=UI.talkTo?P(UI.talkTo):null;if(!el||el.hidden||!p||!W3.ok)return;const f=FIGMAP.get(p.id);const s=project(f?f.x:p.x,1.6*(f&&f.lk?f.lk.s:1),f?f.z:p.z);

// ---------- trading ----------
function openTrade(pid){const p=P(pid);if(!p||!p.alive)return;if(dist(p.x,p.z,S.player.x,S.player.z)>6&&!p.follow){toast(`${p.met?p.name:"They"} can't trade from over there. Walk closer.`);return}UI.modal={type:"trade",pid,give:{},take:{}};render()}
function tradables(){const out={};const inv=invMap();for(const [k,n] of Object.entries(inv))if(ITEMS[k].v>0)out[k]=n;return out}
function valOf(k,p,mine){const it=ITEMS[k];if(!it)return 0;let v=it.v;if(p.want&&p.want.item===k)v*=mine?2:1.5;if(it.eat&&p.hunger<40)v*=mine?1.4:1.3;return v}
function tradeSums(){const m=UI.modal;const p=P(m.pid);let give=0,take=0;for(const [k,n] of Object.entries(m.give))give+=valOf(k,p,true)*n;for(const [k,n] of Object.entries(m.take))take+=valOf(k,p,false)*n;return{give,take}}
function tradeOk(){const {give,take}=tradeSums();const p=P(UI.modal.pid);const f=feel(p);const fair=f<-40?.7:f<0?.85:f<40?1:f<70?1.15:1.3;return take===0?give>0:give*fair>=take}
function tradeHtml(){const m=UI.modal;const p=P(m.pid);const mine=tradables();const theirs=Object.entries(p.pack||{}).filter(([k,n])=>n>0&&ITEMS[k]);const {give,take}=tradeSums();const ok=tradeOk();
  const row=(side,k,n,v)=>{const sel=m[side][k]||0;return `<tr><td>${typeof itemIcon==="function"?itemIcon(k,22):""} ${esc(ITEMS[k].n)} <span class="mute mono">×${n}</span></td><td class="num" title="Value">${Math.round(v)}</td><td class="qty"><button class="tag" data-act="tq" data-v="${side}|${k}|-1"${sel?"":" disabled"} aria-label="Less">−</button> <span class="mono">${sel}</span> <button class="tag" data-act="tq" data-v="${side}|${k}|1"${sel<n?"":" disabled"} aria-label="More">+</button></td></tr>`};
  return `<h2>Trade with ${esc(p.met?p.name:"a stranger")}</h2><p class="mute">${p.met?esc(p.name)+" "+tierWord(tier(p))+".":""} ${p.want&&p.want.type==="fetch"?`They asked you for ${esc(ITEMS[p.want.item].n.toLowerCase())}.`:""} Friends give better deals. What you get goes into your bags, or at your feet if there's no room.</p>
   <div class="fgrid"><div><div class="lbl">You give</div><div class="tscroll"><table><tbody>${Object.entries(mine).map(([k,n])=>row("give",k,n,valOf(k,p,true))).join("")||'<tr><td class="mute">Nothing to trade.</td></tr>'}</tbody></table></div></div>
   <div><div class="lbl">They give</div><div class="tscroll"><table><tbody>${theirs.map(([k,n])=>row("take",k,n,valOf(k,p,false))).join("")||'<tr><td class="mute">Nothing to spare.</td></tr>'}</tbody></table></div></div></div>
   <p class="mono">${give+take?`You give ${Math.round(give)} worth · you get ${Math.round(take)} worth · <span class="${ok?"pos":"neg"}">${take===0&&give>0?"a gift":ok?"they'd take this":"they want more"}</span>`:"Pick what to give and what you want back."}</p>
   <div class="row"><button class="btn pri" data-act="dotrade"${give+take>0?"":" disabled"}>${take===0?"Give it to them":"Offer the trade"}</button><button class="btn" data-act="closemodal">Never mind</button></div>`}
function doTrade(){const m=UI.modal;const p=P(m.pid);const pl=S.player;const {give,take}=tradeSums();
  if(!tradeOk()){p.chat.push({w:"them",x:styleSay(p,pick(["That's not a trade. That's robbery.","Add something and we'll talk.","No. Not for that."]))});toast(`${p.met?p.name:"They"} won't take that.`);render();return}
  const given={};for(const [k,n] of Object.entries(m.give)){const have=invCount(k);const q=Math.min(n,have);if(q<=0)continue;invTake(k,q);p.pack[k]=(p.pack[k]||0)+q;given[k]=(given[k]||0)+q}
  for(const [k,n] of Object.entries(m.take)){p.pack[k]=(p.pack[k]||0)-n;if(p.pack[k]<=0)delete p.pack[k];invAdd(k,n)}
  const names=Object.entries(given).map(([k,n])=>ITEMS[k].n.toLowerCase()+(n>1?" ×"+n:"")).join(", ");
  const w=p.want;if(w&&w.type==="fetch"&&(given[w.item]||0)>=w.qty){p.trust=clamp(p.trust+w.reward.trust,-100,100);p.aff=clamp(p.aff+w.reward.aff,-100,100);p.want=null;mem(p,`${pl.name} brought me ${ITEMS[w.item].n.toLowerCase()} when I needed it.`,8);
    p.chat.push({w:"them",x:styleSay(p,pick(["You actually did it. Thank you. I mean it.","*stares at it* I didn't think you'd come back. Thank you.","I owe you one. A real one."]))});

  else{p.trust=clamp(p.trust+1,-100,100);p.chat.push({w:"them",x:styleSay(p,pick(["Pleasure doing business.","Deal.","Fair enough."]))})}

function modalHtml(){const m=UI.modal;if(!m)return"";const wrap=(inner,label,cls="")=>`<div class="modal-bg"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${inner}</div></div>`;

  if(m.type==="dead")return wrap(deadHtml(),"The end");

function helpHtml(){return `<h2>How to play</h2><p>You're one person in a small town where everyone has a life of their own. Today the dead start walking. Survive, and decide who you want to be to the people around you.</p>
<table><tbody>
<tr><td>Walk</td><td>WASD or the arrow keys, or click the ground. Hold Shift to run, which is loud. Walking into a door opens it.</td></tr>
<tr><td>Talk</td><td>Click a person. A box opens beside them: type anything. Time stops while you talk. They remember what you say and do.</td></tr>
<tr><td>Doors</td><td>E opens and closes doors. Locked ones can be knocked on, pried with a crowbar or kicked in. B boards a door up if you have a hammer, wood and nails. The dead can't open doors, but they can break them down.</td></tr>
<tr><td>Search</td><td>Click furniture, or stand next to it and press E. Things turn up as you look. Drag them into your pockets, bag or rig. R turns an item while you drag it.</td></tr>
<tr><td>Inventory</td><td>Tab. Your clothes have pockets and your bag holds the most. Double-click to eat, drink, use or wear. Right-click for more.</td></tr>

<tr><td>Light</td><td>F switches your flashlight on and off at night. The dead see it too.</td></tr>

</tbody></table><p class="mute">The game saves itself in this browser.${typeof aiHelpText==="function"?" "+esc(aiHelpText()):""}</p>
<div class="row"><button class="btn pri" data-act="closemodal">Back to it</button><button class="btn" data-act="confirmnew">Start over</button></div>`}
function numWord(n){return["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"][n]||String(n)}
function deadHtml(){const pl=S.player;const days=dayOf(S.t);const met=S.people.filter(p=>p.met).length;const friends=S.people.filter(p=>p.met&&feel(p)>30);const mourn=friends.filter(p=>p.alive).sort((a,b)=>feel(b)-feel(a)).slice(0,6);const kids=pl.kids.map(id=>P(id)).filter(Boolean);const g=myGroup();const turned=pl.cause==="the bite";
  return `<h2>${turned?"You turned":"You didn't make it"}</h2><p>${esc(`Day ${days}. ${turned?"The bite took you, the way it takes everyone.":`It was ${pl.cause||"your wounds"}.`} You were ${pl.name}, ${pl.age}${pl.bg?", once a "+pl.bg.toLowerCase():""}.`)}</p>

  ${mourn.length?`<div><div class="lbl">Who will remember you</div><p>${esc(mourn.map(p=>`${p.name}${pl.fam[p.id]?" ("+pl.fam[p.id]+")":p.partner==="you"?" (your partner)":""}`).join(", "))}</p></div>`:""}
  ${kids.length?`<p>${esc(kids.map(k=>k.alive?`${k.name} is still out there.`:`${k.name} went before you.`).join(" "))}</p>`:""}

function choose(i){const m=UI.modal;if(!m||m.type!=="event")return;const ev=EVENTS[m.id];const c=ev.choices[i];UI.inChoice=true;let txt="";try{txt=c.go(m.data)||""}catch(err){console.error(err);txt="It's over before you can make sense of it."}UI.inChoice=false;

function itemSvg(id,r,px){const it=ITEMS[id];const [a,b]=it.sz;const W=a*10,H=b*10;const body=icoBody(it,W,H);
  if(!r)return `<svg class="ico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"${px?` width="${px}" height="${px}"`:""} aria-hidden="true">${body}</svg>`;
  return `<svg class="ico" viewBox="0 0 ${H} ${W}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="translate(${H},0) rotate(90)">${body}</g></svg>`}
function itemIcon(id,px=28){return `<span class="iicon" style="width:${px}px;height:${px}px">${itemSvg(id,0,px)}</span>`}

// ---------- which grid is which ----------
const CELL=40;
function gridOf(ref){const pl=S.player;if(!ref)return null;if(ref.startsWith("eq:")){const g=pl.eq[ref.slice(3)];return g&&g.c?g.c:null}
  if(ref==="open"){if(!UI.open)return null;const o=openContObj(UI.open.cid);return o?o.c:null}
  if(ref==="ground"){const p=pileAt(pl.x,pl.z,false);return p&&roomKey(p.x,p.z)===roomKey(pl.x,pl.z)?p.c:null}return null}
function groundPile(make){const pl=S.player;let p=pileAt(pl.x,pl.z,false);if(p&&roomKey(p.x,p.z)!==roomKey(pl.x,pl.z))p=null;if(!p&&make){p={id:"pile"+(S.nextU++),x:pl.x,z:pl.z,c:{g:[6,6],items:[]},t:S.t};S.piles.push(p)}return p}
function findInst(u){const pl=S.player;for(const s of SLOTS){const g=pl.eq[s];if(g&&g.u===u)return{g,slot:s}}
  for(const {slot,c} of pConts())for(const o of c.items)if(o.u===u)return{g:o,c,ref:"eq:"+slot};
  for(const ref of ["open","ground"]){const c=gridOf(ref);if(c)for(const o of c.items)if(o.u===u)return{g:o,c,ref}}return null}
function mine(ref){return ref&&ref.startsWith("eq:")}
// is c inside g (so g can't go into it)?
function nestedIn(c,g){if(!g.c)return false;if(g.c===c)return true;for(const o of g.c.items)if(nestedIn(c,o))return true;return false}

// ---------- opening a container ----------
function openCont(cid){const o=openContObj(cid);if(!o)return;UI.open={cid,t:0};UI.panel="inv";if(UI.talkTo)closeTalk(true);
  if(o.pile)for(const g of o.c.items)g.k=1;else{const s=o.st;if(s.c.items.every(g=>g.k))s.seen=true}
  render()}
function closeOpen(){UI.open=null;render()}
function searchSpeed(){return 1+S.player.sk.scavenge*.08}
// things turn up one at a time while you look
function invTick(dt){if(!UI.open)return;const pl=S.player;const cid=UI.open.cid;
  if(cid.startsWith("pile")){const p=S.piles.find(q=>q.id===cid);if(!p||dist(p.x,p.z,pl.x,pl.z)>2.4){UI.open=null;markUI()}return}
  const c=CONTS[cid];if(!c){UI.open=null;return}if(contReach(c,pl.x,pl.z)>1.9||(c.f&&roomKey(pl.x,pl.z)!==c.b+"/"+c.room)){UI.open=null;markUI();return}
  const s=contState(cid);const next=s.c.items.find(g=>!g.k);if(!next){if(!s.seen){s.seen=true;markUI()}return}
  if(zedNear(2.6))return;
  UI.open.t+=dt*Math.min(4,UI.speed)*searchSpeed();const [w,h]=isz(next);const need=.45+.22*w*h;UI.open.need=need;UI.open.cur=next.u;
  if(UI.open.t>=need){UI.open.t=0;next.k=1;if(!UI.drag)renderPanel();else markUI();if(s.c.items.every(g=>g.k)){s.seen=true;skillUp("scavenge",.03)}}
  else if(!UI.drag){const el=document.querySelector(`.it.unk[data-u="${next.u}"] .prog`);if(el)el.style.width=Math.round(UI.open.t/need*100)+"%"}}

// ---------- drawing the screen ----------
function itemHtml(g,ref,hidden,extra=""){const it=ITEMS[g.id];const [w,h]=isz(g);const st=`left:${g.x*CELL}px;top:${g.y*CELL}px;width:${w*CELL}px;height:${h*CELL}px`;
  if(hidden)return `<div class="it unk" data-u="${g.u}" style="${st}"><span class="q">?</span>${UI.open&&UI.open.cur===g.u?'<span class="prog"></span>':""}</div>`;
  const d=it.dur?durPct(g):null;
  return `<div class="it c-${it.cat}" data-u="${g.u}" data-ref="${ref}" style="${st}" title="${esc(it.n)}${it.st>1?" ×"+g.n:""}${extra}">${itemSvg(g.id,g.r)}<span class="nm">${esc(it.sn||it.n)}</span>${it.st>1&&g.n>1?`<span class="n">${g.n}</span>`:""}${d!=null&&d<99?`<span class="du"><i style="width:${Math.round(d)}%;${d<30?"background:var(--blood)":""}"></i></span>`:""}${g.c&&g.c.items.length?`<span class="has">${g.c.items.length}</span>`:""}</div>`}
function gridHtml(c,ref,o={}){const [W,H]=c.g;return `<div class="grid" data-ref="${ref}" style="width:${W*CELL}px;height:${H*CELL}px;--cell:${CELL}px">${c.items.map(g=>itemHtml(g,ref,o.hide&&!g.k)).join("")}</div>`}
function slotHtml(s){const g=S.player.eq[s];const it=g?ITEMS[g.id]:null;const d=g&&it.dur?durPct(g):null;
  return `<div class="slot${g?" full":""}" data-slot="${s}"><span class="lbl">${SLOTNAME[s]}</span>${g?`<div class="it c-${it.cat}" data-u="${g.u}" data-slot="${s}" title="${esc(it.n)}${gearStats(g.id)?" · "+gearStats(g.id):""}">${itemSvg(g.id,0)}${d!=null&&d<99?`<span class="du"><i style="width:${Math.round(d)}%;${d<30?"background:var(--blood)":""}"></i></span>`:""}</div>`:""}</div>`}
function invPanelHtml(){const pl=S.player;const w=weight(),m=maxW();const C=pConts();
  let me=`<div class="invhead"><span class="mono ${w>m?"neg":"mute"}">${w.toFixed(1)} / ${m.toFixed(0)} kg</span><span class="mono mute">armor ${armor()} · warmth ${clothesWarm()}</span></div>
  <div class="slots">${["head","outer","body","hands","legs","feet","rig","back","weapon","side"].map(slotHtml).join("")}</div>`;
  me+=C.length?C.map(({slot,g,c})=>`<div class="cbox"><div class="lbl">${CONT_LABEL[slot]} <span class="mute">· ${esc(ITEMS[g.id].n)}</span></div>${gridHtml(c,"eq:"+slot)}</div>`).join(""):`<p class="mute">Nothing with pockets on. Wear something.</p>`;
  let them="";if(UI.open){const o=openContObj(UI.open.cid);if(o){const pile=!!o.pile;const s=o.st;const hidden=pile?0:o.c.items.filter(g=>!g.k).length;const T=CONTS[UI.open.cid];
    them+=`<div class="ohead"><div><b>${esc(contName(UI.open.cid))}</b><div class="mono mute">${hidden?`Searching... ${o.c.items.length-hidden} found so far`:o.c.items.length?`${o.c.items.length} thing${o.c.items.length>1?"s":""}`:"Empty"}${T&&T.b&&isShop(BMAP[T.b])&&!S.flags.clinic?" · not yours":""}</div></div><div class="row"><button class="tag" data-act="takeall"${o.c.items.some(g=>g.k||pile)?"":" disabled"}>Take all</button><button class="x" data-act="closeopen" aria-label="Close">×</button></div></div>${gridHtml(o.c,"open",{hide:!pile})}`}}
  const gp=groundPile(false);if(!(UI.open&&gp&&UI.open.cid===gp.id)){const c=gp?gp.c:{g:[6,2],items:[]};them+=`<div class="ohead"><div><b>At your feet</b><div class="mono mute">${c.items.length?"Drag things here to drop them":"Drag things here to drop them"}</div></div></div>${gridHtml(c,"ground")}`}
  return `<div class="inv"><div class="invcol">${me}</div><div class="invcol">${them}<p class="mono mute hint">Drag to move. R turns what you're dragging. Shift-click moves it across. Double-click uses or wears it. Right-click for more.</p></div></div><div id="ctx" hidden></div>`}
function invAfterRender(){}

// ---------- moving things ----------
function takeFrom(src){const g=src.g;if(src.slot){S.player.eq[src.slot]=null}else if(src.c)cRemove(src.c,g)}
function putBack(src){const g=src.g;if(src.slot)S.player.eq[src.slot]=g;else if(src.c){if(cFits(src.c,...isz(g),g.x,g.y,g))cPut(src.c,g,g.x,g.y,g.r);else{const p=cFind(src.c,g);if(p)cPut(src.c,g,p.x,p.y,p.r);else stash(g)}}}
// somewhere for a thing to go: your pockets, or the floor
function stash(g){if(pStore(g))return"you";dropInst(g);cleanPiles();return"ground"}
function slotFor(id,want){const it=ITEMS[id];if(!it.slot)return null;if(it.slot==="weapon"){if(want==="side")return it.side?"side":null;if(want==="weapon")return"weapon";return S.player.eq.weapon&&it.side&&!S.player.eq.side?"side":"weapon"}return want&&want!==it.slot?null:it.slot}
function equipInst(src,want){const g=src.g;const s=slotFor(g.id,want);if(!s){toast(`That doesn't go there.`);return false}const pl=S.player;const old=pl.eq[s];
  if(old===g)return true;takeFrom(src);pl.eq[s]=g;g.r=0;
  if(old){// the thing you had on goes where the new one came from, or into your pockets
    if(src.c&&cFits(src.c,...isz(old),g.x,g.y,null)){cPut(src.c,old,g.x,g.y,0)}else if(src.slot&&slotFor(old.id,src.slot)){pl.eq[src.slot]=old}else{const p=src.c?cFind(src.c,old):null;if(p)cPut(src.c,old,p.x,p.y,p.r);else if(stash(old)==="ground")toast(`No room for your ${ITEMS[old.id].n.toLowerCase()}. It's at your feet.`)}}
  return true}
function unequip(s){const pl=S.player;const g=pl.eq[s];if(!g)return;pl.eq[s]=null;if(pStore(g))return;dropInst(g);toast(`No room. Your ${ITEMS[g.id].n.toLowerCase()} is at your feet.`)}
function quickMove(src,ref){const g=src.g;if(!mine(ref)&&!src.slot){// into your things
    takeFrom(src);if(pStore(g)){g.k=1;witnessTake();return true}putBack(src);toast("No room in your pockets or bag.");return false}
  const target=UI.open?gridOf("open"):null;takeFrom(src);
  if(target){if(nestedIn(target,g)){putBack(src);return false}const p=cFind(target,g);if(p){cPut(target,g,p.x,p.y,p.r);g.k=1;return true}putBack(src);toast("It won't fit in there.");return false}
  dropInst(g);g.k=1;return true}
function witnessTake(){if(!UI.open)return;const c=CONTS[UI.open.cid];if(c)witnesses(c,false)}
function splitInst(src){const g=src.g;if(g.n<2)return;const k=Math.floor(g.n/2);const n=mkInst(g.id,k);n.k=1;const c=src.c||null;let p=c?cFind(c,n):null;if(p){g.n-=k;cPut(c,n,p.x,p.y,p.r)}else if(pStore(n)){g.n-=k}else toast("No room to split it.")}
function dropSrc(src){takeFrom(src);const g=src.g;dropInst(g);g.k=1;cleanPiles()}
// eating, drinking, patching up
function useItem(id){if(!id)return;for(const {c} of pConts())for(const g of c.items)if(g.id===id){useInst({g,c});return}toast("You don't have that.")}
function useInst(src){const g=src.g;const it=ITEMS[g.id];const pl=S.player;const id=g.id;
  const consume=()=>{g.n-=1;if(g.n<=0){if(src.c)cRemove(src.c,g);else if(src.slot)pl.eq[src.slot]=null}};
  const leave=(aid)=>{const e=mkInst(aid);e.k=1;if(src.c&&g.n<=0&&cFits(src.c,...isz(e),g.x,g.y,null)){cPut(src.c,e,g.x,g.y,g.r)}else if(stash(e)==="ground")toast(`You set the ${ITEMS[aid].n.toLowerCase()} down.`)};
  if(it.eat){consume();pl.food=clamp(pl.food+it.eat.food,0,100);if(it.eat.water)pl.water=clamp(pl.water+it.eat.water,0,100);if(it.eat.sick&&rf()<it.eat.sick){pl.sick=1;journal("Your stomach turns. You shouldn't have eaten that raw.","bad")}else journal(`You eat the ${it.n.toLowerCase()}.`);advance(5)}
  else if(it.drink){consume();pl.water=clamp(pl.water+it.drink,0,100);if(it.after)leave(it.after);if(id==="whiskey"){pl.warmth=clamp(pl.warmth+10,0,100);pl.energy=clamp(pl.energy-3,0,100);journal("The whiskey burns all the way down. For a while, things are softer.")}else if(it.sick&&rf()<it.sick){pl.sick=1;journal("You drink the river water. Hours later your gut cramps. You're sick.","bad")}else journal(`You drink the ${it.n.toLowerCase()}.`);advance(3)}
  else if(it.heal||it.stopBleed||it.cure){consume();if(it.heal)pl.hp=clamp(pl.hp+it.heal+pl.sk.medic,0,100);if(it.stopBleed&&pl.bleeding){pl.bleeding=0;journal("You bind the wound tight. The bleeding stops.","good")}if(it.cure){if(pl.sick){pl.sick=0;journal("The antibiotics knock the fever down.","good")}else journal("You take the antibiotics. You weren't sick, so all it does is waste them.")}else if(!it.stopBleed)journal(`You use the ${it.n.toLowerCase()}.`);skillUp("medic",.05);advance(5)}
  else if(id==="cigarettes"){consume();pl.energy=clamp(pl.energy+4,0,100);journal("You smoke one. Your hands stop shaking for a while.")}
  else if(id==="radio"){advance(10);journal(radioLine());toast(radioLine())}
  else if(id==="photo"){const t=pick(["You look at the photo for a long time. Everyone in it is smiling. You can't remember what was funny.","The photo is creased from your pocket. You smooth it out and put it back.","You don't look at the photo. You just hold it."]);journal(t);toast(t)}
  else if(it.read){pl.flags.read=pl.flags.read||{};if(pl.flags.read[id]){toast("You've already read this one cover to cover.");return}pl.flags.read[id]=1;act(90);for(let i=0;i<6;i++)skillUp(it.read,.12);journal(`You read ${it.n.toLowerCase()} by the light you've got. Some of it sticks.`,"good")}
  else if(it.slot){equipInst(src)}
  else{toast(it.d||`You turn the ${it.n.toLowerCase()} over in your hands.`);return}
  save();render()}
function canUse(id){const it=ITEMS[id];return!!(it.eat||it.drink||it.heal||it.stopBleed||it.cure||it.read||["cigarettes","radio","photo"].includes(id))}
function useWord(id){const it=ITEMS[id];return it.eat?"Eat":it.drink?"Drink":it.heal||it.stopBleed||it.cure?"Use":it.read?"Read":id==="cigarettes"?"Smoke":id==="radio"?"Listen":id==="photo"?"Look at it":"Use"}
function repairInst(src){const g=src.g;const it=ITEMS[g.id];const pl=S.player;if(!it.fix||!Object.entries(it.fix).every(([k,v])=>invHas(k,v)))return;for(const [k,v] of Object.entries(it.fix))invTake(k,v);
  const ws=atHome()&&siteHas(myGroup().home,"workshop");g.dur=Math.min(it.dur,g.dur+it.dur*(ws?.7:.45)+pl.sk.craft*2);act(20,{work:true});skillUp("craft",.06);journal(`You patch up your ${it.n.toLowerCase()}.`);save();render()}
function takeAll(){const c=gridOf("open");if(!c)return;let n=0,left=0;for(const g of [...c.items]){if(!g.k&&!UI.open.cid.startsWith("pile"))continue;cRemove(c,g);if(pStore(g)){n++;g.k=1}else{c.items.push(g);left++}}
  if(n)witnessTake();if(left)toast(n?`You take what fits. ${left} thing${left>1?"s":""} won't.`:"No room for any of it.");cleanPiles();save();render()}

// ---------- dragging ----------
function srcOf(el){const u=el.dataset.u;const f=findInst(u);if(!f)return null;return f}
function cellAt(gridEl,x,y,w,h,gx,gy){const r=gridEl.getBoundingClientRect();return{x:Math.round((x-r.left)/CELL-gx-(w-1)/2*0),y:Math.round((y-r.top)/CELL-gy)}}
function dragStart(e,el){const src=srcOf(el);if(!src)return;const g=src.g;const r=el.getBoundingClientRect();const [w,h]=src.slot?ITEMS[g.id].sz:isz(g);
  const gx=src.slot?Math.min(w-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*w))):Math.floor((e.clientX-r.left)/CELL),gy=src.slot?Math.min(h-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*h))):Math.floor((e.clientY-r.top)/CELL);
  UI.press={src,el,x0:e.clientX,y0:e.clientY,gx:Math.max(0,gx),gy:Math.max(0,gy),r:src.slot?0:g.r}}
function dragMove(e){const P_=UI.press;if(!P_)return;if(!UI.drag){if(Math.hypot(e.clientX-P_.x0,e.clientY-P_.y0)<5)return;
    const gh=document.createElement("div");gh.className="it ghost c-"+ITEMS[P_.src.g.id].cat;document.body.appendChild(gh);UI.drag={...P_,gh};P_.el.classList.add("lift");closeMenu();drawGhost()}
  const D=UI.drag;D.cx=e.clientX;D.cy=e.clientY;placeGhost();targetAt(e.clientX,e.clientY)}
function drawGhost(){const D=UI.drag;const g=D.src.g;const s=ITEMS[g.id].sz;const w=D.r?s[1]:s[0],h=D.r?s[0]:s[1];D.gh.style.width=w*CELL+"px";D.gh.style.height=h*CELL+"px";D.gh.innerHTML=itemSvg(g.id,D.r)+(g.n>1?`<span class="n">${g.n}</span>`:"");D.w=w;D.h=h}
function placeGhost(){const D=UI.drag;if(!D||D.cx==null)return;D.gh.style.transform=`translate(${D.cx-D.gx*CELL-CELL/2}px,${D.cy-D.gy*CELL-CELL/2}px)`}
function clearMark(){document.querySelectorAll(".dropmark").forEach(x=>x.remove());document.querySelectorAll(".slot.ok,.slot.bad").forEach(x=>x.classList.remove("ok","bad"))}
function targetAt(x,y){const D=UI.drag;clearMark();D.tgt=null;const under=document.elementFromPoint(x,y);if(!under)return;
  const slotEl=under.closest(".slot");if(slotEl){const s=slotEl.dataset.slot;const ok=!!slotFor(D.src.g.id,s)&&!(D.src.g.c&&false);slotEl.classList.add(ok?"ok":"bad");D.tgt=ok?{slot:s}:null;return}
  const gridEl=under.closest(".grid");if(!gridEl)return;const ref=gridEl.dataset.ref;let c=gridOf(ref);const virtual=!c&&ref==="ground";if(!c&&!virtual)return;const C=c||{g:[6,2],items:[]};
  const r=gridEl.getBoundingClientRect();const cx=Math.floor((x-r.left)/CELL)-D.gx,cy=Math.floor((y-r.top)/CELL)-D.gy;const g=D.src.g;
  // dropping onto a stack of the same thing tops it up
  const onIt=under.closest(".it");if(onIt&&onIt.dataset.u!==g.u){const o=C.items.find(q=>q.u===onIt.dataset.u);if(o&&o.id===g.id&&ITEMS[g.id].st>1&&o.n<ITEMS[g.id].st&&(o.k||ref!=="open")){D.tgt={ref,stack:o};mark(gridEl,o.x,o.y,...isz(o),true);return}}
  const ok=cFits(C,D.w,D.h,cx,cy,g)&&!(c&&nestedIn(c,g));D.tgt=ok?{ref,x:cx,y:cy,r:D.r}:null;mark(gridEl,cx,cy,D.w,D.h,ok)}
function mark(gridEl,x,y,w,h,ok){const m=document.createElement("div");m.className="dropmark "+(ok?"ok":"bad");m.style.cssText=`left:${x*CELL}px;top:${y*CELL}px;width:${w*CELL}px;height:${h*CELL}px`;gridEl.appendChild(m)}
function dragEnd(e){const P_=UI.press;UI.press=null;const D=UI.drag;if(!D)return false;UI.drag=null;D.gh.remove();clearMark();D.el.classList.remove("lift");
  const t=D.tgt;const src=D.src;const g=src.g;
  if(t){if(t.slot){equipInst(src,t.slot)}
    else if(t.stack){const o=t.stack;const k=Math.min(ITEMS[g.id].st-o.n,g.n);o.n+=k;g.n-=k;if(g.n<=0)takeFrom(src)}
    else{let c=gridOf(t.ref);if(!c&&t.ref==="ground")c=groundPile(true).c;if(c){const from=src.ref;takeFrom(src);cPut(c,g,t.x,t.y,t.r);if(t.ref==="open"||t.ref==="ground")g.k=1;if(mine(t.ref)&&from&&!mine(from))witnessTake()}}

// ---------- the right-click menu ----------
function closeMenu(){const m=document.getElementById("ctx");if(m){m.hidden=true;m.innerHTML=""}UI.menu=null}
function openMenu(e,el){const src=srcOf(el);if(!src)return;const g=src.g;const it=ITEMS[g.id];const ref=src.ref||(src.slot?"slot":"");UI.menu={u:g.u};const opts=[];
  if(canUse(g.id))opts.push(["use",useWord(g.id)]);
  if(it.slot&&!src.slot)opts.push(["wear",it.slot==="weapon"?"Hold it":it.slot==="back"||it.slot==="rig"?"Put it on":"Wear it"]);
  if(it.slot==="weapon"&&it.side&&src.slot!=="side"&&!src.slot)opts.push(["belt","Put it on your belt"]);
  if(src.slot)opts.push(["unequip",it.slot==="weapon"?"Put it away":"Take it off"]);
  if(!mine(ref)&&!src.slot)opts.push(["take","Take it"]);
  if(mine(ref)&&UI.open)opts.push(["give","Put it in the "+contName(UI.open.cid).toLowerCase()]);
  if(it.st>1&&g.n>1&&src.c)opts.push(["split","Split the stack"]);
  if(it.fix&&g.dur<it.dur){const ok=Object.entries(it.fix).every(([k,v])=>invHas(k,v));opts.push(["fix",`Fix it (${Object.entries(it.fix).map(([k,v])=>ITEMS[k].n.toLowerCase()+(v>1?" ×"+v:"")).join(", ")})`,!ok])}
  if(ref!=="ground")opts.push(["drop","Drop it"]);
  opts.push(["look","Look at it"]);
  const m=document.getElementById("ctx");if(!m)return;m.innerHTML=`<div class="mtitle">${esc(it.n)}${g.n>1?" ×"+g.n:""}</div>`+opts.map(([k,t,dis])=>`<button data-act="inv" data-v="${k}|${g.u}"${dis?" disabled":""}>${esc(t)}</button>`).join("");
  m.hidden=false;const W=innerWidth,H=innerHeight;m.style.left=Math.min(e.clientX,W-230)+"px";m.style.top=Math.min(e.clientY,H-m.offsetHeight-10)+"px"}
function onInvAct(a,v,el,e){if(a==="takeall"){takeAll();return true}if(a==="closeopen"){closeOpen();return true}if(a!=="inv")return false;
  const [k,u]=v.split("|");closeMenu();const src=findInst(u);if(!src)return true;const g=src.g;const it=ITEMS[g.id];
  switch(k){case"use":useInst(src);return true;case"wear":equipInst(src);break;case"belt":equipInst(src,"side");break;case"unequip":unequip(src.slot);break;
    case"take":quickMove(src,src.ref);break;case"give":quickMove(src,src.ref);break;case"split":splitInst(src);break;case"fix":repairInst(src);return true;
    case"drop":dropSrc(src);break;case"look":toast(`${it.n}. ${it.d||""} ${gearStats(g.id)?"("+gearStats(g.id)+")":""} ${it.w?it.w*g.n+" kg.":""}`.replace(/\s+/g," ").trim());return true}
  cleanPiles();save();render();return true}

document.addEventListener("pointerdown",e=>{if(!S||UI.create)return;const m=document.getElementById("ctx");if(m&&!m.hidden&&!e.target.closest("#ctx"))closeMenu();

  UI.create=null;UI.panel=null;UI.open=null;UI.talkTo=null;UI.draft="";UI.paused=false;UI.speed=1;UI.peopleSel=null;UI.modal={type:"help"};
  w3reset();save();render()}

// ================= the town at dawn, behind the first screen =================
const TITLE={on:false,t0:0};
function startTitle(){if(TITLE.on||!W3.ok)return;TITLE.on=true;TITLE.t0=performance.now();titleLight();requestAnimationFrame(titleLoop)}
function titleLight(){const h=7.5;const d=dayLight(h);const az=clamp((h-5.5)/15,0,1)*Math.PI;W3.sunDir.set(Math.cos(az)*.85,.55+Math.sin(az)*.9,.42+(1-Math.sin(az))*.2).normalize();
  W3.sun.color.copy(CC("#fff1d6")).lerp(CC("#ffb070"),(1-d)*.8);W3.sun.intensity=.35+.95*d;W3.hemi.intensity=.18+.5*d;W3.hemi.color.copy(CC("#dfe8f0"));
  W3.scene.background=CC("#05080d").clone().lerp(CC(SKY.clear),d);W3.scene.fog=null;if(W3.precip){W3.scene.remove(W3.precip.pts);W3.precip=null}W3.wx=null;
  for(const L of [W3.spot,W3.plight,W3.room,W3.fireLight])if(L)L.intensity=0;
  for(const k in FIG.P)FIG.P[k].count=0;for(const o of W3.bm.values()){o.cut=0;o.target=0;o.settled=false}animCutaway(1)}
function titleLoop(ts){if(!UI.create||!W3.ok){TITLE.on=false;return}requestAnimationFrame(titleLoop);if(document.hidden)return;
  const t=(ts-TITLE.t0)/1000;const a=1.1+t*.016;const cx=46+Math.cos(a)*20,cz=-4+Math.sin(a)*16;
  const panel=document.querySelector("#create .cpanel");const pw=panel&&W3.rw>900?panel.getBoundingClientRect().right:0;
  const asp=W3.rw/Math.max(1,W3.rh);const vh=38;const vw=vh*asp;const off=pw/Math.max(1,W3.rw)*vw/2;
  const tx=cx-off*.7071,tz=cz+off*.7071;const C=W3.cam;C.left=-vw/2;C.right=vw/2;C.top=vh/2;C.bottom=-vh/2;C.updateProjectionMatrix();C.position.set(tx+30,34,tz+30);C.lookAt(tx,0,tz);
  const L=W3.sun;const sz=L.shadow.camera.right-L.shadow.camera.left;const tex=sz/L.shadow.mapSize.x;const fx=Math.round(tx/tex)*tex,fz=Math.round(tz/tex)*tex;
  L.target.position.set(fx,0,fz);L.position.set(fx+W3.sunDir.x*60,W3.sunDir.y*60,fz+W3.sunDir.z*60);L.target.updateMatrixWorld();
  W3.ren.render(W3.scene,W3.cam)}

// ================= starting up =================
function fixNext(){let m=0;const sc=s=>{const n=parseInt(String(s).replace(/^\D+/,""));if(n>m)m=n};for(const p of S.people)sc(p.id);for(const z of S.zeds)sc(z.id);NEXT=m+1}
function boot(){buildInteriors();buildCollision();layout();initWorldView($("world"));W3.mini=$("mini");aiInit();
  const s=loadSave();
  if(s&&s.v===3&&s.player&&Array.isArray(s.people)){S=s;reindex();fixNext();UI.create=null;w3reset();if(S.player.alive===false)UI.modal={type:"dead"}}
  else{S=null;UI.create=defaultChar()}
  render();requestAnimationFrame(frame)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&!UI.create)save()});addEventListener("pagehide",()=>{if(S&&!UI.create)save()});
// keep progress when a new version of the page arrives while it's open
let booted=false;const start=()=>{if(booted)return;booted=true;boot()};
try{window.claude?.hot?.snapshot?.(()=>{try{if(S&&!UI.create)save()}catch(e){}return {}})}catch(e){}
try{if(window.claude?.hot?.ready){window.claude.hot.ready(start);setTimeout(start,2500)}else start()}catch(e){start()}
</script>
