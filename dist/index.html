<title>TWD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One screen: the world fills the window; time and place sit top left, the map top right, your body and your options along the bottom.
   Panels slide in from the right, conversations open beside the person you're talking to. The game is always at night-desk darkness, so one palette. */
:root{
  --bg:#0d0f0d; --panel:rgba(17,20,18,.94); --panel-solid:#141815; --panel2:#1d221e; --panel3:#262c27; --line:#2f3831; --line2:#3d483f;
  --fg:#ebe6d9; --mute:#9aa395; --dim:#6d756a; --ember:#e48a3f; --ember-dk:#3a2512; --lichen:#a9c38d; --blood:#d4574a; --sky:#86aac4; --paper:#efe9dc; --ink:#1b1915;
  --f-display:"Saira Stencil One","Arial Narrow",Impact,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f0d;--fg:#ebe6d9}}
:root[data-theme="dark"]{--bg:#0d0f0d;--fg:#ebe6d9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ember);outline:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
table{font:inherit;border-collapse:collapse;width:100%}
th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid rgba(47,56,49,.6);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td,td.click:hover{background:var(--panel2)} td.click{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:21px} h3{font-size:17px}
p{margin:0}
ul{margin:0;padding-left:18px}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.mute{color:var(--mute)} .small{font-size:12px} .pos{color:var(--lichen)} .neg{color:var(--blood)} .warn{color:var(--ember)}
.num{font-family:var(--f-mono);font-size:12px;text-align:right}
.lbl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:7px 11px;text-align:left;display:inline-flex;flex-direction:column;gap:1px;min-width:0}
.btn:hover:not(:disabled){border-color:var(--ember)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn small{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.btn.pri{background:var(--ember);color:#1a120a;border-color:var(--ember)} .btn.pri small{color:#4a2c12}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:1px 7px;color:var(--fg);vertical-align:1px}
button.tag:hover:not(:disabled){border-color:var(--ember)} button.tag:disabled{opacity:.4;cursor:not-allowed}
.tag.warn{color:var(--ember);border-color:rgba(228,138,63,.5)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12.5px;line-height:1.3}
.chip:hover:not(:disabled){border-color:var(--sky)} .chip.on{border-color:var(--ember);background:var(--ember-dk)} .chip:disabled{opacity:.42;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);flex:0 0 auto}
.x{background:none;border:1px solid transparent;border-radius:4px;width:28px;height:28px;font-size:20px;line-height:1;color:var(--mute);flex:0 0 auto;display:grid;place-items:center;padding:0}
.x:hover{color:var(--fg);border-color:var(--line2)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.entry{border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.entry .mono{color:var(--mute)}
.entry.good{border-left-color:var(--lichen)} .entry.bad{border-left-color:var(--blood)} .entry.big{border-left-color:var(--ember)}
.journal{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px}
.meter{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.meter span:last-child{text-align:right}
.track{position:relative;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.track i{position:absolute;top:0;bottom:0}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{width:100%}

/* ---------- the world view ---------- */
#game{position:absolute;inset:0;overflow:hidden;background:#05080d}
#world{position:absolute;inset:0}
.w3{position:absolute;inset:0;overflow:hidden;touch-action:none}
.w3 canvas{display:block;width:100%;height:100%;cursor:default}
.w3::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 46%,transparent 58%,rgba(0,0,0,.34) 100%)}
.w3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.w3label{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font-family:var(--f-mono);font-size:11px;line-height:1.3;color:var(--fg);background:rgba(10,12,10,.78);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:3px 7px;will-change:transform}
.w3label b{font-weight:600}
.w3label.hover{font-size:11.5px;padding:5px 9px;text-align:center;margin-top:-6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.w3label.hover span{color:var(--mute)}
.w3label.say{white-space:normal;width:max-content;max-width:230px;font-family:var(--f-body);font-size:13px;line-height:1.35;color:var(--ink);background:var(--paper);border:none;border-radius:10px;padding:6px 10px;margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.w3label.say::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.w3label.bld{background:none;border:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:rgba(235,230,217,.86);text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.8)}
.w3label.dead{color:#e6a49c;background:rgba(40,10,8,.72);border-color:rgba(212,87,74,.4)}
.w3label.comp{font-size:10px;padding:1px 6px;color:var(--lichen);border-color:rgba(169,195,141,.35);margin-top:-2px}
.w3label.want{width:20px;height:20px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--ember);color:#1a120a;font-weight:600;border:none;margin-top:-4px;box-shadow:0 0 0 3px rgba(228,138,63,.25)}
.w3label.task{min-width:120px;text-align:center;padding:4px 8px 7px;margin-top:-8px}
.w3label.task i{position:absolute;left:6px;bottom:3px;height:2px;background:var(--ember);max-width:calc(100% - 12px)}
.w3prompt{z-index:2;font-size:11.5px;padding:4px 9px 4px 5px;margin-top:-8px;border-color:rgba(228,138,63,.35)}
.w3prompt b{display:inline-block;min-width:18px;text-align:center;background:var(--ember);color:#1a120a;border-radius:3px;padding:0 4px;margin-right:4px}
.w3prompt .mute{color:var(--mute)}
.w3hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.55) 100%)}
.w3area{z-index:1;position:absolute;left:50%;top:14%;transform:translateX(-50%);pointer-events:none;opacity:0;font-family:var(--f-display);font-size:30px;letter-spacing:.08em;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 30px rgba(0,0,0,.6);white-space:nowrap}
.w3fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}
#game.dead .w3{filter:grayscale(.85) brightness(.6);transition:filter 1.5s}

/* ---------- the corners ---------- */
.hud{position:absolute;z-index:5;pointer-events:none}
.hud button,.hud canvas{pointer-events:auto}
#hudtl{left:14px;top:12px;display:flex;flex-direction:column;gap:2px;padding:9px 14px 10px;background:linear-gradient(180deg,rgba(13,15,13,.82),rgba(13,15,13,.6));border:1px solid rgba(255,255,255,.06);border-radius:8px;max-width:min(420px,44vw)}
#hudtl .clk{font-family:var(--f-mono);font-size:12px} #hudtl .clk b{font-size:14px;font-weight:600;color:var(--fg)}
#hudtl .where{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;line-height:1.2}
#hudtl .where .mute{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
#hudtl .warn{color:var(--ember)}
#hudtr{right:14px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:200px;height:150px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(13,15,13,.75);box-shadow:var(--shadow)}
#ctrls{display:flex;gap:3px;background:rgba(13,15,13,.75);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:3px}
#ctrls button{background:none;border:1px solid transparent;border-radius:4px;min-width:28px;height:26px;padding:0 6px;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
#ctrls button:hover{color:var(--fg);border-color:var(--line2)}
#ctrls button.on{color:#1a120a;background:var(--ember)}
#log{left:14px;bottom:122px;width:min(440px,46vw);display:flex;flex-direction:column;gap:5px}
#log .entry{font-size:13px;line-height:1.35;background:linear-gradient(90deg,rgba(13,15,13,.82),rgba(13,15,13,.45));border-radius:0 6px 6px 0;padding:5px 10px;text-shadow:0 1px 2px rgba(0,0,0,.6);animation:logIn .35s ease-out}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#vitals{left:14px;bottom:70px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:7px 12px 8px;background:rgba(13,15,13,.78);border:1px solid rgba(255,255,255,.07);border-radius:8px;max-width:calc(100vw - 28px)}
.vital{width:74px}
.vital .lbl{font-size:9.5px;letter-spacing:.1em}
.vital .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px}
.vital .bar i{display:block;height:100%;background:var(--lichen);transition:width .6s}
.vital.mid .bar i{background:var(--ember)} .vital.low .bar i{background:var(--blood)}
.vital.low .lbl{color:var(--blood)}
#vitals .load{font-size:11px;padding-bottom:1px}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.cond{font-family:var(--f-mono);font-size:10.5px;color:var(--blood);border:1px solid rgba(212,87,74,.7);background:rgba(60,14,10,.5);border-radius:3px;padding:0 6px}
#bar{left:14px;right:14px;bottom:12px;display:flex;gap:10px;align-items:stretch;justify-content:space-between}
#bar .acts{display:flex;gap:6px;flex-wrap:nowrap;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
#bar .acts::-webkit-scrollbar{display:none}
.act{pointer-events:auto;background:rgba(20,24,21,.9);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;text-align:left;display:flex;flex-direction:column;gap:0;font-size:13px;line-height:1.25;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:220px}
.act small{font-family:var(--f-mono);font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act:hover:not(:disabled){border-color:var(--ember)}
.act.pri{border-color:rgba(228,138,63,.7)}
.act:disabled{opacity:.45;cursor:not-allowed}
#bar .tabs{display:flex;gap:3px;align-items:stretch;flex:0 0 auto;background:rgba(13,15,13,.85);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:3px}
.tab{background:none;border:1px solid transparent;border-radius:5px;padding:4px 10px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.tab small{font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:none}
.tab:hover{color:var(--fg);border-color:var(--line2)}
.tab.on{color:var(--fg);background:var(--panel3);border-color:var(--ember)}
.tab .warn{font-weight:600}
.toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:90;background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--ember);border-radius:6px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(560px,calc(100vw - 32px));pointer-events:none}
.toast[hidden]{display:none}

/* ---------- panels ---------- */
#panel{position:absolute;z-index:20;right:14px;top:12px;bottom:70px;width:min(540px,calc(100vw - 28px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px);animation:panelIn .18s ease-out}
#panel[hidden]{display:none}
#panel.p-inv{width:min(920px,calc(100vw - 28px))}
#panel.p-map{width:min(760px,calc(100vw - 28px))}
@keyframes panelIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
#panel>header h2{font-size:20px;color:var(--ember)}
.pbody{flex:1;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.profile h3{font-size:19px}
#bigmap{width:100%;display:block;border-radius:6px;border:1px solid var(--line);cursor:crosshair;background:#0a0c0a}
.lotgrid{display:grid;gap:3px;margin:6px 0}
.tile{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden;font-family:var(--f-mono);font-size:10px;color:#141414;padding:0}
.tile:hover{border-color:var(--sky)} .tile.sel{outline:2px solid var(--ember);outline-offset:1px}
.tile.site{background:repeating-linear-gradient(45deg,var(--panel2) 0 4px,var(--panel3) 4px 8px);color:var(--fg)}
.tile .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--ember)}

/* ---------- your body: the health screen ---------- */
#panel.p-health{width:min(840px,calc(100vw - 28px))}
.hp-wrap{display:grid;grid-template-columns:minmax(170px,230px) minmax(0,1fr);gap:16px;align-items:start}
.hp-body{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(ellipse at 50% 45%,rgba(134,170,196,.08),transparent 70%);border:1px solid var(--line);border-radius:8px;padding:8px 6px}
.bsvg{width:100%;height:auto;max-height:calc(100vh - 250px);display:block}
.bsvg .blr{font-family:var(--f-mono);font-size:9px;fill:var(--dim)}
.bpart{cursor:pointer} .bpart:hover .bfill{filter:brightness(1.3)}
.hp-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.hsum{display:flex;flex-wrap:wrap;gap:5px}
.hsum span{font-family:var(--f-mono);font-size:11px;border-radius:3px;padding:1px 7px;border:1px solid var(--line2);color:var(--mute)}
.hsum .k2{color:var(--ember);border-color:rgba(228,138,63,.55);background:rgba(58,37,18,.5)} .hsum .k3{color:var(--blood);border-color:rgba(212,87,74,.7);background:rgba(60,14,10,.5)}
.wcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid #a08f4e;border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.wcard.s2{border-left-color:var(--ember)} .wcard.s3{border-left-color:var(--blood)}
.wcard b{font-weight:600}
.wstat{margin:0;padding-left:17px;color:#cfc9bb;font-size:13px;line-height:1.45}
.wacts{gap:6px} .wacts .btn{padding:6px 10px}
.hmsg{background:rgba(169,195,141,.1);border:1px solid rgba(169,195,141,.35);border-radius:5px;padding:6px 9px;font-size:13.5px}
.hadvice{font-size:12.5px;color:var(--mute);margin:0;line-height:1.45}
.sups{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sup{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px 2px 3px}
.vbtn{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;border-radius:4px}
.vbtn:hover .lbl{color:var(--fg)}
button.cond{cursor:pointer;line-height:1.5} button.cond:hover{background:rgba(90,22,16,.75)}
@media (max-width:760px){.hp-wrap{grid-template-columns:1fr}.hp-body{position:static}.bsvg{max-height:300px}}

/* ---------- the inventory: block grids ---------- */
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.invcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.invhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(5,58px);gap:6px}
.slot{width:58px;height:58px;position:relative;background:rgba(0,0,0,.28);border:1px dashed var(--line2);border-radius:5px;display:grid;place-items:center}
.slot>.lbl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:8.5px;letter-spacing:.06em;color:var(--dim);pointer-events:none}
.slot.full{border-style:solid;background:var(--panel2)} .slot.full>.lbl{top:auto;bottom:-1px;transform:none;font-size:7.5px;color:var(--mute);z-index:2;text-shadow:0 1px 2px #000}
.slot .it{position:absolute;inset:3px;width:auto;height:auto}
.slot.ok{border-color:var(--lichen);background:rgba(169,195,141,.15)} .slot.bad{border-color:var(--blood);background:rgba(212,87,74,.12)}
.cbox{display:flex;flex-direction:column;gap:5px}
.grid{position:relative;flex:0 0 auto;max-width:100%;border:1px solid var(--line2);border-radius:3px;background-color:rgba(0,0,0,.32);
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:var(--cell) var(--cell);box-sizing:content-box}
.it{position:absolute;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);border-radius:3px;background:rgba(60,64,58,.55);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.it:hover{border-color:rgba(255,255,255,.5);z-index:3}
.it svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.it .nm{position:absolute;left:3px;top:1px;right:3px;font-family:var(--f-mono);font-size:8.5px;line-height:1.2;color:rgba(235,230,217,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px #000}
.it .n{position:absolute;right:3px;bottom:1px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--fg);text-shadow:0 1px 2px #000;pointer-events:none}
.it .du{position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:rgba(0,0,0,.5);pointer-events:none}
.it .du i{display:block;height:100%;background:var(--lichen)}

    for(const [a0,a1] of segs)if(a1-a0>.02)out.push({o:L.o,c:L.c,a0,a1,ext,out:ext?Math.sign(L.c):0})}

// ---------- collision: a spatial hash of boxes ----------
const COL={c:4,m:new Map()};
const ckey=(i,j)=>(i+200)*1000+(j+200);
function colAdd(bx){const c=COL.c;for(let i=Math.floor(bx.x0/c);i<=Math.floor(bx.x1/c);i++)for(let j=Math.floor(bx.z0/c);j<=Math.floor(bx.z1/c);j++){const k=ckey(i,j);let L=COL.m.get(k);if(!L)COL.m.set(k,L=[]);L.push(bx)}}
const BGRID=new Map();
function buildCollision(){COL.m.clear();BGRID.clear();
  for(const b of BUILDINGS){for(const w of b.walls){const r=wallBox(b,w);colAdd({...rectWorld(b,r.u0,r.v0,r.u1,r.v1),k:"wall",b:b.id})}
    for(const r of b.rooms)for(const f of r.f)if(!f.nb&&!f.mount)colAdd({...f.w,k:"furn",b:b.id});
    for(const d of b.doors)colAdd({...d.box,k:"door",d});
    const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2;for(let i=Math.floor(x0/10);i<=Math.floor(x1/10);i++)for(let j=Math.floor(z0/10);j<=Math.floor(z1/10);j++){const k=ckey(i,j);let L=BGRID.get(k);if(!L)BGRID.set(k,L=[]);L.push(b)}}
  for(const c of CARS){const ca=Math.abs(Math.cos(c.rot)),sa=Math.abs(Math.sin(c.rot));const hx=.95*ca+2.05*sa,hz=.95*sa+2.05*ca;colAdd({x0:c.x-hx,x1:c.x+hx,z0:c.z-hz,z1:c.z+hz,k:"car"})}
  for(const q of QWALLS)colAdd({x0:q[0],z0:q[1],x1:q[2],z1:q[3],k:"rock"});
  for(const c of Object.values(CONTS)){if(!c.f)continue;const b=BMAP[c.b];const f=c.f;const cu=(f.u0+f.u1)/2,cv=(f.v0+f.v1)/2;const fu=Math.sin(f.rot),fv=Math.cos(f.rot);
    const hw=(Math.abs(fu)>.5?(f.v1-f.v0):(f.u1-f.u0))/2,hd=(Math.abs(fu)>.5?(f.u1-f.u0):(f.v1-f.v0))/2;const su=fv,sv=-fu;

    for(const [s_,f_] of cand){const p=toWorld(b,cu+su*s_+fu*f_,cv+sv*s_+fv*f_);if(free(p.x,p.z,.3,"pl")&&roomAt(p.x,p.z)?.ri===c.room){c.ux=p.x;c.uz=p.z;c.ok=true;break}}
    if(!c.ok){let best=null,bd=1e9;for(const sp of b.spots){if(sp.room!==c.room)continue;const d=dist(sp.x,sp.z,c.x,c.z);if(d<bd){bd=d;best=sp}}if(best){c.ux=best.x;c.uz=best.z}}}}
// how far the player is from a piece of furniture's footprint
function contReach(c,x,z){if(!c.f){const car=c.car;return Math.max(0,dist(x,z,car.x,car.z)-2)}const w=c.f.w;const dx=Math.max(0,w.x0-x,x-w.x1),dz=Math.max(0,w.z0-z,z-w.z1);return Math.hypot(dx,dz)}
const QWALLS=[[60,-96,122,-94],[60,-60,122,-58],[120,-96,122,-58],[60,-96,62,-78],[60,-72,62,-58]];
function bldAt(x,z){const L=BGRID.get(ckey(Math.floor(x/10),Math.floor(z/10)));if(!L)return null;for(const b of L)if(Math.abs(x-b.x)<b.w/2&&Math.abs(z-b.z)<b.d/2)return b;return null}
function roomAt(x,z){const b=bldAt(x,z);if(!b)return null;const l=toLocal(b,x,z);const ri=roomIdxAtLocal(b,l.u,l.v);return{b,ri:ri<0?0:ri}}
function roomKey(x,z){const r=roomAt(x,z);return r?r.b.id+"/"+r.ri:"out"}
let WALLED=new Set();// camps the dead can't walk into
// who: "pl" player, "npc" townsfolk (walk through unlocked doors), "zed" the dead, "far" (ignore furniture)
function free(x,z,r=.3,who="pl"){if(x<WB.x0+.5||x>WB.x1-.5||z<WB.z0+.5||z>WB.z1-.5)return false;
  if(z>42-r&&z<52+r&&!(x>23+r&&x<33-r)&&!(x>-62+r&&x<-52-r))return false;
  const c=COL.c;const i0=Math.floor((x-r)/c),i1=Math.floor((x+r)/c),j0=Math.floor((z-r)/c),j1=Math.floor((z+r)/c);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const L=COL.m.get(ckey(i,j));if(!L)continue;for(const bx of L){if(x+r<=bx.x0||x-r>=bx.x1||z+r<=bx.z0||z-r>=bx.z1)continue;
    if(bx.k==="door"){const d=bx.d;if(d.open||d.broken)continue;if(who==="npc"&&!d.lock&&!d.bar)continue;if(who==="far")continue;return false}
    if(bx.k==="furn"&&who==="far")continue;return false}}
  if(who==="zed"&&WALLED.size&&WALLED.has(regionAt(x,z)))return false;

// the closed door blocking a spot, if any
function doorAt(x,z,r=.45){const c=COL.c;for(let i=Math.floor((x-r)/c);i<=Math.floor((x+r)/c);i++)for(let j=Math.floor((z-r)/c);j<=Math.floor((z+r)/c);j++){const L=COL.m.get(ckey(i,j));if(!L)continue;
  for(const bx of L)if(bx.k==="door"&&!(x+r<=bx.x0||x-r>=bx.x1||z+r<=bx.z0||z-r>=bx.z1))return bx.d}return null}
function step(e,dx,dz,r,who){if(!free(e.x,e.z,r,who)){e.x+=dx;e.z+=dz;return true}const nx=e.x+dx,nz=e.z+dz;

// ---------- paths: through doorways, around buildings, over the river ----------
function inQuarry(x,z){return x>60&&x<122&&z>-96&&z<-58}
function roomRoute(b,from,to){if(from===to)return[];const prev=new Map([[from,null]]);const q=[from];
  while(q.length){const r=q.shift();if(r===to)break;for(const d of b.dws){if(d.ext||d.r[0]<0||d.r[1]<0)continue;const i=d.r.indexOf(r);if(i<0)continue;const n=d.r[1-i];if(prev.has(n))continue;prev.set(n,{r,d,i});q.push(n)}}
  if(!prev.has(to))return[];const pts=[];let cur=to;while(prev.get(cur)){const {r,d,i}=prev.get(cur);pts.unshift(d.p[1-i]);pts.unshift(d.p[i]);cur=r}return pts}
function exitRoute(b,ri,tx,tz){let best=null,bl=1e9;for(const d of b.exits){const inner=roomRoute(b,ri,d.r[d.inSide]);const o=d.p[d.outSide];let L=dist(o.x,o.z,tx,tz);let px=null;for(const p of inner){if(px)L+=dist(px.x,px.z,p.x,p.z);px=p}
  if(d.door&&d.door.lock&&!d.door.broken)L+=60;if(L<bl){bl=L;best={pts:[...inner,d.p[d.inSide],o],d}}}return best}
function segHitsRect(ax,az,bx,bz,r){// Liang-Barsky
  let t0=0,t1=1;const dx=bx-ax,dz=bz-az;const p=[-dx,dx,-dz,dz],q=[ax-r.x0,r.x1-ax,az-r.z0,r.z1-az];
  for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-9){if(q[i]<0)return false}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}return t0<t1}
function blockersOn(a,b,skip){const out=[];const x0=Math.min(a.x,b.x)-8,x1=Math.max(a.x,b.x)+8,z0=Math.min(a.z,b.z)-8,z1=Math.max(a.z,b.z)+8;
  for(const B of BUILDINGS){if(B===skip)continue;if(B.x+B.w/2<x0||B.x-B.w/2>x1||B.z+B.d/2<z0||B.z-B.d/2>z1)continue;const r={x0:B.x-B.w/2-.45,x1:B.x+B.w/2+.45,z0:B.z-B.d/2-.45,z1:B.z+B.d/2+.45};if(segHitsRect(a.x,a.z,b.x,b.z,r))out.push([B,r,dist(a.x,a.z,B.x,B.z)])}
  return out.sort((p,q)=>p[2]-q[2])}
function detour(a,b,depth=0){if(depth>4)return[b];const hit=blockersOn(a,b);if(!hit.length)return[b];const [B,r0]=hit[0];const m=.8;const r={x0:r0.x0-m+.45,x1:r0.x1+m-.45,z0:r0.z0-m+.45,z1:r0.z1+m-.45};
  const C=[{x:r.x0,z:r.z0},{x:r.x1,z:r.z0},{x:r.x1,z:r.z1},{x:r.x0,z:r.z1}];const inner={x0:r0.x0,x1:r0.x1,z0:r0.z0,z1:r0.z1};let best=null,bl=1e9;
  for(let i=0;i<4;i++){const c=C[i];if(!segHitsRect(a.x,a.z,c.x,c.z,inner)&&!segHitsRect(c.x,c.z,b.x,b.z,inner)){const L=dist(a.x,a.z,c.x,c.z)+dist(c.x,c.z,b.x,b.z);if(L<bl){bl=L;best=[c]}}
    for(const j of [(i+1)%4,(i+3)%4]){const d=C[j];if(!segHitsRect(a.x,a.z,c.x,c.z,inner)&&!segHitsRect(d.x,d.z,b.x,b.z,inner)){const L=dist(a.x,a.z,c.x,c.z)+dist(c.x,c.z,d.x,d.z)+dist(d.x,d.z,b.x,b.z);if(L<bl){bl=L;best=[c,d]}}}}
  if(!best)return[b];const out=[];let p=a;for(const c of best){out.push(...detour(p,c,depth+1));p=c}out.push(...detour(p,b,depth+1));return out}
function outdoorRoute(a,b){const legs=[];let cur=a;
  const qa=inQuarry(a.x,a.z),qb=inQuarry(b.x,b.z);if(qa!==qb){const g1={x:qa?66:56,z:-75},g2={x:qa?56:66,z:-75};legs.push(g1,g2)}
  const n1=a.z<47,n2=b.z<47;if(n1!==n2){const bx=28,fx=-57;const cx=Math.abs(a.x-bx)+Math.abs(b.x-bx)<=Math.abs(a.x-fx)+Math.abs(b.x-fx)?bx:fx;legs.push({x:cx,z:n1?39:55},{x:cx,z:n1?55:39})}
  const pts=[];for(const l of [...legs,b]){pts.push(...detour(cur,l));cur=l}return pts}
function navPath(x0,z0,x1,z1){const A=roomAt(x0,z0),B=roomAt(x1,z1);const end={x:x1,z:z1};
  if(A&&B&&A.b===B.b)return[...roomRoute(A.b,A.ri,B.ri),end];
  const pts=[];let s={x:x0,z:z0};
  if(A){const ex=exitRoute(A.b,A.ri,x1,z1);if(ex){pts.push(...ex.pts);s=ex.pts[ex.pts.length-1]}}
  if(B){let best=null,bl=1e9;for(const d of B.b.exits){const o=d.p[d.outSide];const inner=roomRoute(B.b,d.r[d.inSide],B.ri);let L=dist(s.x,s.z,o.x,o.z);if(d.door&&d.door.lock&&!d.door.broken)L+=60;if(L<bl){bl=L;best={o,i:d.p[d.inSide],inner}}}
    if(best){pts.push(...outdoorRoute(s,best.o),best.i,...best.inner,end);return pts}}
  pts.push(...outdoorRoute(s,end));return pts}
// a random free spot inside a building (or a room of it)
function insidePos(b,room){const L=room==null?b.spots:b.spots.filter(s=>s.room===room);const s=pick(L.length?L:b.spots);return{x:s.x+(rf()-.5)*.3,z:s.z+(rf()-.5)*.3}}
function bedPos(b,i=0){return b.beds.length?b.beds[i%b.beds.length]:null}
function nearBuilding(x,z,r=2.2){let best=null,bd=1e9;for(const b of BUILDINGS){const dx=Math.max(0,Math.abs(x-b.x)-b.w/2),dz=Math.max(0,Math.abs(z-b.z)-b.d/2);const d=Math.hypot(dx,dz);if(d<r&&d<bd){bd=d;best=b}}return best}
function frontDoor(b){return b.exits[0]}
function doorOut(b){const d=frontDoor(b);return d?d.p[d.outSide]:{x:b.x,z:b.z+b.d/2+1}}

// ================= the block inventory =================
// An item instance: {u, id, n (stack), dur, r (rotated), x, y, c (its own grid, for bags and clothes with pockets)}
function mkInst(id,n=1){const it=ITEMS[id];const g={u:"i"+(S.nextU++),id,n:Math.max(1,Math.min(n,it.st||1)),dur:it.dur||0,r:0,x:0,y:0};if(it.grid)g.c={g:[...it.grid],items:[]};return g}
function isz(g){const s=ITEMS[g.id].sz;return g.r?[s[1],s[0]]:[s[0],s[1]]}
function cFits(c,w,h,x,y,skip){if(x<0||y<0||x+w>c.g[0]||y+h>c.g[1])return false;for(const o of c.items){if(o===skip)continue;const [ow,oh]=isz(o);if(x<o.x+ow&&x+w>o.x&&y<o.y+oh&&y+h>o.y)return false}return true}
function cFind(c,g,skip){const s=ITEMS[g.id].sz;const opts=s[0]===s[1]?[0]:[0,1];for(const r of opts){const w=r?s[1]:s[0],h=r?s[0]:s[1];for(let y=0;y+h<=c.g[1];y++)for(let x=0;x+w<=c.g[0];x++)if(cFits(c,w,h,x,y,skip))return{x,y,r}}return null}
function cPut(c,g,x,y,r){g.x=x;g.y=y;g.r=r;if(!c.items.includes(g))c.items.push(g)}
function cRemove(c,g){const i=c.items.indexOf(g);if(i>=0)c.items.splice(i,1)}
function cCount(c,id){let n=0;for(const o of c.items)if(o.id===id)n+=o.n;return n}
// stack into what's there, then place new blocks. Returns how many didn't fit.
function cAdd(c,id,n,scatter){const it=ITEMS[id];if(!it)return 0;
  if(it.st>1)for(const o of c.items){if(o.id!==id||n<=0)continue;const room=it.st-o.n;if(room>0){const k=Math.min(room,n);o.n+=k;n-=k}}
  while(n>0){const g=mkInst(id,Math.min(n,it.st));let p=null;
    if(scatter){const s=it.sz;for(let t=0;t<14&&!p;t++){const r=s[0]!==s[1]&&rf()<.35?1:0;const w=r?s[1]:s[0],h=r?s[0]:s[1];const x=rnd(0,c.g[0]-w),y=rnd(0,c.g[1]-h);if(x>=0&&y>=0&&cFits(c,w,h,x,y))p={x,y,r}}}
    if(!p)p=cFind(c,g);if(!p)break;cPut(c,g,p.x,p.y,p.r);n-=g.n}
  return n}
function cFree(c){let used=0;for(const o of c.items){const [w,h]=isz(o);used+=w*h}return c.g[0]*c.g[1]-used}

// ---------- what you carry ----------
const CONT_ORDER=["legs","rig","body","outer","back"];
const CONT_LABEL={legs:"Pockets",rig:"Rig",body:"Front pocket",outer:"Jacket pockets",back:"Bag"};
function pConts(){const pl=S.player;const out=[];for(const s of CONT_ORDER){const g=pl.eq[s];if(g&&g.c)out.push({slot:s,g,c:g.c})}return out}
function gearEq(s){return S.player.eq[s]||null}
function weapon(){return S.player.eq.weapon||null}
// counts of loose things you carry, by kind (what the old code called the inventory)
function invMap(){const m={};for(const {c} of pConts())for(const o of c.items)m[o.id]=(m[o.id]||0)+o.n;return m}
function invCount(id){let n=0;for(const {c} of pConts())n+=cCount(c,id);for(const s of SLOTS){const g=S.player.eq[s];if(g&&g.id===id)n++}return n}
function invHas(id,n=1){return invCount(id)>=n}
function invAdd(id,n=1,quiet){if(!ITEMS[id])return 0;if(n<0){invTake(id,-n);return 0}if(n===0)return 0;
  for(const {c} of pConts()){n=cAdd(c,id,n);if(n<=0)return 0}
  dropToGround(id,n);if(!quiet&&typeof toast==="function")toast(`No room for ${itemPhrase(id,n)}. You set ${n>1?"them":"it"} down at your feet.`);return n}
function invTake(id,n=1){const L=pConts();for(let i=L.length-1;i>=0;i--){const c=L[i].c;for(const o of [...c.items]){if(n<=0)return;if(o.id!==id)continue;const k=Math.min(o.n,n);o.n-=k;n-=k;if(o.n<=0){cRemove(c,o);if(o.c)spill(o)}}}
  const pl=S.player;for(const s of ["side","weapon",...SLOTS]){if(n<=0)return;const g=pl.eq[s];if(g&&g.id===id){pl.eq[s]=null;n--;if(g.c)spill(g)}}}
// put an instance somewhere in your containers; false if there's no room
function pStore(g,skipC){if(ITEMS[g.id].st>1)for(const {c} of pConts()){if(c===skipC)continue;for(const o of c.items){if(o.id===g.id&&o!==g&&o.n<ITEMS[g.id].st){const k=Math.min(ITEMS[g.id].st-o.n,g.n);o.n+=k;g.n-=k;if(g.n<=0)return true}}}
  for(const {c,g:holder} of pConts()){if(c===skipC||holder===g)continue;const p=cFind(c,g);if(p){cPut(c,g,p.x,p.y,p.r);return true}}return false}
// a bag or jacket left your body: its contents go into your other pockets, or on the ground
function spill(g){if(!g.c||!g.c.items.length)return;const left=[];for(const o of [...g.c.items]){cRemove(g.c,o);if(!pStore(o,g.c))left.push(o)}for(const o of left)dropInst(o)}
function equipNew(id){const g=mkInst(id);const it=ITEMS[id];const slot=it.slot==="weapon"&&S.player.eq.weapon&&it.side?"side":it.slot;S.player.eq[slot]=g;return g}
function instW(g){let w=ITEMS[g.id].w*g.n;if(g.c)for(const o of g.c.items)w+=instW(o);return w}
function weight(){const pl=S.player;let w=0;for(const s of SLOTS){const g=pl.eq[s];if(g)w+=instW(g)-ITEMS[g.id].w*.5}return w}
function maxW(){const pl=S.player;return 16+pl.sk.fight*.4+pl.sk.build*.25}
function clothesWarm(){let w=0;for(const s of ["head","body","outer","hands","legs","feet"]){const g=gearEq(s);if(g)w+=ITEMS[g.id].warm||0}return w}
function armor(){let a=0;for(const s of SLOTS){const g=gearEq(s);if(g)a+=ITEMS[g.id].armor||0}return a}
function breakSlot(s){const pl=S.player;const g=pl.eq[s];pl.eq[s]=null;if(g&&g.c)spill(g);return g}
function wearWeapon(n){const w=weapon();if(!w)return"";w.dur-=n;if(w.dur<=0){breakSlot("weapon");const pl=S.player;if(pl.eq.side){pl.eq.weapon=pl.eq.side;pl.eq.side=null}
  const t=` Your ${ITEMS[w.id].n.toLowerCase()} breaks.`;journal(t.trim(),"bad");return t}return""}
function wearClothes(h){for(const s of ["head","body","outer","hands","legs","feet","back","rig"]){const g=gearEq(s);if(!g||!g.dur)continue;g.dur-=h*.12;if(g.dur<=0){breakSlot(s);journal(`Your ${ITEMS[g.id].n.toLowerCase()} falls apart.`,"bad")}}}
function allCarried(){const out=[];const pl=S.player;for(const s of SLOTS)if(pl.eq[s])out.push({g:pl.eq[s],slot:s});for(const {c} of pConts())for(const o of c.items)out.push({g:o,c});return out}
function hasTool(t){return allCarried().some(x=>ITEMS[x.g.id].tool===t)}
function wearTool(t,n){const x=allCarried().find(x=>ITEMS[x.g.id].tool===t);if(!x)return;const g=x.g;g.dur-=n;if(g.dur<=0){if(x.slot)breakSlot(x.slot);else cRemove(x.c,g);journal(`Your ${ITEMS[g.id].n.toLowerCase()} breaks.`,"bad")}}
function skillUp(k,a=.12){S.player.sk[k]=Math.min(10,+(S.player.sk[k]+a).toFixed(2))}
function durPct(g){const it=ITEMS[g.id];return it.dur?clamp(g.dur/it.dur*100,0,100):100}

// ---------- the ground ----------
function pileAt(x,z,make){let best=null,bd=1.4;for(const p of S.piles){const d=dist(p.x,p.z,x,z);if(d<bd){bd=d;best=p}}
  if(!best&&make){best={id:"pile"+(S.nextU++),x,z,c:{g:[6,6],items:[]},t:S.t};S.piles.push(best)}return best}
function dropInst(g,x,z){const pl=S.player;const p=pileAt(x??pl.x,z??pl.z,true);let pos=cFind(p.c,g);while(!pos&&p.c.g[1]<60){p.c.g[1]+=2;pos=cFind(p.c,g)}if(pos)cPut(p.c,g,pos.x,pos.y,pos.r);p.t=S.t;return p}
function dropToGround(id,n){const it=ITEMS[id];while(n>0){const g=mkInst(id,Math.min(n,it.st));dropInst(g);n-=g.n}}
function cleanPiles(){S.piles=S.piles.filter(p=>p.c.items.length)}

// ---------- furniture, cars and what's inside ----------
function contState(cid){let s=S.cont[cid];if(!s){const C=CONTS[cid];const T=CONT[C.k]||{g:[4,3]};s=S.cont[cid]={c:{g:[...T.g],items:[]},rolled:false,rev:0,lock:!!T.locked}}return s}
function isShop(b){return b&&!["house","farmhouse","trailer","cabin"].includes(b.type)}
function rollLoot(cid){const s=contState(cid);if(s.rolled)return s;s.rolled=true;const C=CONTS[cid];const pl=S.player;const day=dayOf(S.t);const b=C.b?BMAP[C.b]:null;
  const shop=isShop(b)||!b;const picked=C.b===pl.home?0:Math.min(.7,(day-1)*(shop?.04:.02)+(S.flags.clinic&&shop?.06:0));
  const mult=(1-picked)*(1+pl.sk.scavenge*.05);
  for(const [id,ch,mn=1,mx=1] of (LOOT[C.k]||[])){if(!ITEMS[id])continue;if(rf()<ch*mult)cAdd(s.c,id,rnd(mn,mx),true)}
  if(C.b===pl.home&&!pl.flags.homeSeeded)seedHome(b);
  s.c.items.sort((a,b)=>a.y-b.y||a.x-b.x);return s}
// your own house has a few things you'd know were there
function seedHome(b){const pl=S.player;pl.flags.homeSeeded=true;const add=(k,list)=>{const c=Object.values(CONTS).find(c=>c.b===b.id&&c.k===k);if(!c)return;const s=contState(c.id);const fresh=!s.rolled;s.rolled=true;for(const [id,n] of list)cAdd(s.c,id,n);if(fresh)for(const [id,ch,mn=1,mx=1] of (LOOT[k]||[]))if(rf()<ch)cAdd(s.c,id,rnd(mn,mx),true);s.c.items.sort((a,c)=>a.y-c.y||a.x-c.x)};
  add("closet",[["backpack",1],["tshirt",1]]);add("cupboard",[["canned_food",2],["kitchen_knife",1],["water_bottle",1]]);add("fridge",[["water_bottle",2]]);add("nightstand",[["flashlight",1]]);add("medicine",[["bandage",2]])}
function contName(cid){if(cid.startsWith("pile")){const p=S.piles.find(q=>q.id===cid);return p&&p.n||"On the ground"}const C=CONTS[cid];return C?C.n:"Container"}
function openContObj(cid){if(cid.startsWith("pile")){const p=S.piles.find(p=>p.id===cid);return p?{c:p.c,rev:1e9,pile:p}:null}const s=rollLoot(cid);return{c:s.c,rev:s.rev,st:s}}
// ================= your body: where you're hurt, what each wound is doing, and what it needs =================
// Twelve parts. A wound sits on one part at a named spot and keeps its own bleeding, infection and healing.
// Looking after one is simple: wash it, wrap it, eat and drink, and take antibiotics if it turns.
// pl.hp is still your overall strength; wounds drain it (bleeding, fever) and a broken leg slows you down.
// pl.bleeding stays as the total of what's bleeding right now, so older code that reads it keeps working.

const BODY={
  head:{n:"head",armor:["head"],hit:.05},
  neck:{n:"neck",armor:[],hit:.035},
  chest:{n:"chest",armor:["outer","body"],hit:.13},
  belly:{n:"belly",armor:["outer","body"],hit:.09},
  rarm:{n:"right arm",armor:["outer","body"],hit:.17,limb:"arm",side:"right"},
  larm:{n:"left arm",armor:["outer","body"],hit:.17,limb:"arm",side:"left"},
  rhand:{n:"right hand",armor:["hands"],hit:.07,limb:"hand",side:"right"},
  lhand:{n:"left hand",armor:["hands"],hit:.07,limb:"hand",side:"left"},
  rleg:{n:"right leg",armor:["legs"],hit:.085,limb:"leg",side:"right"},
  lleg:{n:"left leg",armor:["legs"],hit:.085,limb:"leg",side:"left"},
  rfoot:{n:"right foot",armor:["feet"],hit:.025,limb:"foot",side:"right"},
  lfoot:{n:"left foot",armor:["feet"],hit:.025,limb:"foot",side:"left"}};
const BODY_KEYS=Object.keys(BODY);
// named spots on each part: [name, how far down the part (0 top, 1 bottom), how far to one side (-1..1)]
const SPOTS={
  head:[["scalp",.12,0],["forehead",.3,0],["cheek",.55,-.55],["jaw",.82,.3],["ear",.45,.95]],
  neck:[["throat",.55,0],["side of the neck",.45,.75]],
  chest:[["collarbone",.1,.35],["chest",.45,-.3],["ribs",.78,.65]],
  belly:[["stomach",.35,0],["side",.5,-.85],["hip",.85,.7]],
  arm:[["shoulder",.05,0],["upper arm",.3,0],["elbow",.52,0],["forearm",.75,0],["forearm",.7,0],["wrist",.95,0]],
  hand:[["palm",.45,0],["knuckles",.3,.2],["fingers",.82,0],["thumb",.4,-.9]],
  leg:[["thigh",.22,0],["knee",.48,0],["shin",.72,0],["calf",.68,.4],["ankle",.97,0]],
  foot:[["ankle",.1,0],["heel",.35,0],["top of the foot",.55,0],["toes",.9,0]]};
// kinds of wound. bleed: how fast it starts; clot: how fast that slows by itself, per hour; days: to heal under good conditions
const WOUND={
  scratch:{n:"Scratch",bleed:.12,clot:.15,pain:4,days:1.2,dirt:.55},
  cut:{n:"Cut",bleed:.45,clot:.05,pain:9,days:3,dirt:.3},
  deep:{n:"Deep cut",bleed:1.05,clot:.012,pain:18,days:6,dirt:.3},
  bite:{n:"Bite",bleed:.55,clot:.03,pain:16,days:5,dirt:1},
  bruise:{n:"Bruise",bleed:0,clot:0,pain:6,days:2,dirt:0,closed:true},
  fracture:{n:"Broken bone",bleed:0,clot:0,pain:30,days:9,dirt:0,closed:true},
  incision:{n:"Surgical incision",bleed:0,clot:0,pain:7,days:5,dirt:0}};
// what you can wash a wound with, and wrap it in, best first: [item, how good, what to call it]
const CLEANERS=[["rubbing_alcohol",1,"rubbing alcohol"],["whiskey",.9,"whiskey"],["boiled_water",.8,"boiled water"],["water_bottle",.7,"bottled water"]];
const DRESSINGS=[["bandage",1,"a bandage"],["poultice",.9,"an herb poultice"],["cloth",.75,"a strip of cloth"]];
// a broken bone gets bound: a splint if you have one, otherwise wrapped tight
const BINDS=[["splint",1,"the splint"],["bandage",.85,"a bandage"],["cloth",.7,"strips of cloth"]];

function body(){const pl=S.player;if(!pl.body){pl.body={w:[],ache:0,pk:0,abx:0,nid:1};
    // an older save that only knew "bleeding": give it a real wound
    if(pl.bleeding>0)addWound("cut",pick(["larm","rarm"]))}
  return pl.body}
function wounds(){return body().w}
function woundById(id){return wounds().find(w=>w.id===id)||null}
function spotName(p,s,v){const b=BODY[p];if(b.side)return `${b.side} ${s}`;if(v&&["cheek","ear","side","hip","collarbone","side of the neck","ribs"].includes(s))return `${v<0?"right":"left"} ${s}`;return s}
function addWound(k,p,o={}){const B=body();const b=BODY[p];

// wash and wrap everything you can, in the order it matters
function tendAll(){const done=new Map(),miss=new Set();let mins=0;const note=(w,v)=>{if(!done.has(w))done.set(w,[]);done.get(w).push(v)};

  for(const w of W)if(needsWrap(w)&&wBleed(w)>.25){if(wrapWound(w,null)){note(w,"wrapped");mins+=5}else miss.add("wrap")}

// ---------- reading a wound ----------

function roleFit(p,r){return({scavenger:p.sk.scavenge+p.tr.brave,hunter:p.sk.survive+p.sk.fight*.5,forager:p.sk.survive,fisher:p.sk.survive*.8,farmer:p.sk.survive+(p.job.startsWith("farm")?3:0),woodcutter:p.sk.build*.5+p.sk.fight*.5+.5,builder:p.sk.build+(p.job==="builder"||p.job==="foreman"?2:0),guard:p.sk.fight+p.tr.brave*2,medic:p.sk.medic*1.5+(p.job==="nurse"||p.job==="doctor"?4:0),cook:p.sk.survive*.5+p.tr.kind,crafter:p.sk.craft})[r]||0}

function groupsHour(h,tmp){

function planBuilds(g){const site=S.sites[g.home];if(!site||site.build.length>=2)return;const L=g.leader==="you"?{id:"you",tr:{brave:.6,kind:.7}}:P(g.leader);if(!L)return;const st=g.stock;const n=groupSize(g.id);

function autoTile(site,b){const P_=PLACES[site].site;const s=S.sites[site];const free=i=>!s.grid[i]&&!s.build.some(x=>x.tile===i);const idx=[];for(let i=0;i<P_.gw*P_.gh;i++)if(free(i))idx.push(i);if(!idx.length)return -1;

function playerBirth(){const pl=S.player;const partner=P(pl.preg.with);pl.preg=null;const c=makePerson({age:0,job:"kid",style:"kid",sur:partner?.sur||""});c.born=S.t;c.parents=["you",partner?.id];c.group=pl.group;c.role="kid";c.x=pl.x;c.z=pl.z;c.tx=c.x;c.tz=c.z;
  c.trust=60;c.aff=80;c.fam.you="mom";pl.fam[c.id]="kid";S.people.push(c);PMAP[c.id]=c;pl.kids.push(c.id);if(partner){partner.kids.push(c.id);famLink(partner,c,c.sex==="F"?"daughter":"son","dad",85)}

// wants (personal requests)
function makeWant(p){const opts=[];const lostFam=Object.entries(p.fam).map(([id,r])=>[P(id),r]).filter(([q])=>q&&q.status==="turned");
  if(lostFam.length&&!p.want){const [q,r]=lostFam[0];opts.push({type:"mercy",about:q.id,text:`My ${r}, ${q.name}... they turned. They're still out there, somewhere around ${PLACES[regionAt(q.x,q.z)]?.n||"town"}. I can't do it. Will you put them to rest?`,reward:{trust:30,aff:20}})}
  const missing=Object.entries(p.fam).map(([id,r])=>[P(id),r]).filter(([q])=>q&&q.alive&&q.group!==p.group);
  if(missing.length){const [q,r]=missing[0];opts.push({type:"find",about:q.id,text:`Have you seen my ${r}, ${q.name}? We got separated when everything went to hell. If you find them, tell them I'm alive. Tell them where I am.`,reward:{trust:20,aff:20}})}
  if(p.job==="nurse"||p.job==="doctor"||p.role==="medic")opts.push({type:"fetch",item:"bandage",qty:3,text:"We're out of bandages. If you're going into town, could you bring me three? Cloth works too if you make them yourself.",reward:{trust:12,aff:8}});
  if(p.kids.length)opts.push({type:"fetch",item:"canned_fruit",qty:1,text:`My kid hasn't had anything sweet in days. If you find a can of peaches or anything like it... I'd owe you.`,reward:{trust:10,aff:14}});
  if(p.mem.some(m=>/cigarette|smok/.test(m.x))||rf()<.2)opts.push({type:"fetch",item:"cigarettes",qty:1,text:"I'd kill for a smoke. Not literally. Probably.",reward:{trust:6,aff:10}});
  if(p.role==="guard"||p.tr.brave>.7)opts.push({type:"fetch",item:pick(["crowbar","machete","bat"]),qty:1,text:"I'm on the wall every night with a broom handle. Find me something real to fight with?",reward:{trust:15,aff:8}});
  opts.push({type:"fetch",item:pick(["water_bottle","canned_food","flashlight","duct_tape"]),qty:rnd(1,2),text:"",reward:{trust:8,aff:6}});
  const w=opts[0]&&(opts[0].type==="mercy"||opts[0].type==="find")?opts[0]:pick(opts);if(!w.text)w.text=`Could you find me ${itemPhrase(w.item,w.qty)}? I'll make it worth your while.`;p.want=w}
// ================= what people need, and what they do about it =================
// Every hour each person weighs what they need (food, water, sleep, safety, company, the people they love) against who
// they are (brave or timid, kind or cold, social or not) and what they remember, then picks something to do. They have the
// same choices you have: eat, drink, sleep, hide, board up a door, search a building, fetch water, forage, hunt, find their
// family, team up with the neighbors, join a group, steal, sit with a friend. What they take comes out of the same cupboards
// you search, and the dead they meet are the same dead you meet.

// ---------- what a household has at home: food in meals, water in drinks ----------
function hs(bid){if(!S.hs)S.hs={};let H=S.hs[bid];if(!H){const n=Math.max(1,S.people.filter(p=>p.alive&&p.home===bid&&!p.group).length);H=S.hs[bid]={food:Math.round(n*(3+rf()*7)),water:Math.round(n*(2+rf()*4)),boards:rf()<.45?rnd(1,3):0,med:rnd(0,2)}}return H}
const MEALS=k=>{const it=ITEMS[k];return it&&it.eat&&!it.eat.sick?it.eat.food/30:0};
const DRINKS={water_bottle:1,boiled_water:1,river_water:.9};
function packHas(p,k){return(p.pack&&p.pack[k])||0}
function packAdd(p,k,n=1){if(!p.pack)p.pack={};p.pack[k]=(p.pack[k]||0)+n}
function packTake(p,k,n=1){if(!p.pack||!p.pack[k])return 0;const t=Math.min(n,p.pack[k]);p.pack[k]-=t;if(p.pack[k]<=0)delete p.pack[k];return t}
function packCount(p){let n=0;for(const k in p.pack||{})n+=p.pack[k];return n}
function packMeals(p){let m=0;for(const k in p.pack||{})m+=MEALS(k)*p.pack[k];return m}
function packDrinks(p){let m=0;for(const k in DRINKS)m+=packHas(p,k)*DRINKS[k];return m}
// the best thing they could swing at the dead (0 if they've got nothing)
function npcArm(p){let best=0;for(const k in p.pack||{}){const it=ITEMS[k];if(it&&it.slot==="weapon"&&it.dmg>best&&(!it.gun||packHas(p,"ammo")))best=it.dmg}return best}
function npcGun(p){for(const k in p.pack||{})if(ITEMS[k]&&ITEMS[k].gun&&packHas(p,"ammo"))return k;return null}
function hisHer(p){return p.age<13?"their":p.sex==="F"?"her":"his"}
function atHomeB(p){const b=bldAt(p.x,p.z);return!!b&&b.id===p.home}
function homeBoarded(bid){const b=BMAP[bid];return!!b&&b.exits.some(d=>d.door&&d.door.bar>0)}
function unboarded(b){return b.exits.slice(1).some(d=>d.door&&!d.door.bar&&!d.door.broken)}
function setAct(p,act,ex){p.act=act;p.expo=ex}
function tally(k){if(!S.stats.tally)S.stats.tally={};S.stats.tally[k]=(S.stats.tally[k]||0)+1}

// ---------- one look at the whole town, once an hour ----------
function mindCtx(h,d,tmp){const pl=S.player;const live=!S.jump&&pl.alive!==false&&!pl.coma;const near=new Set();
  if(live)for(const p of S.people)if(p.alive&&Math.abs(p.x-pl.x)<50&&Math.abs(p.z-pl.z)<50)near.add(p.id);
  const cnt={};for(const z of S.zeds)cnt[z.r]=(cnt[z.r]||0)+1;const dz={};
  for(const k in PLACES){const div=k==="town"?100:k==="road"||k==="school"?35:["woods","fields","hills","wilds"].includes(k)?70:40;dz[k]=(cnt[k]||0)/div}
  const H=BMAP.clinic;let hz=0;for(const z of S.zeds)if(Math.abs(z.x-H.x)<15&&Math.abs(z.z-H.z)<15)hz++;
  const byHome={};for(const p of S.people)if(p.alive&&!p.group&&p.home&&!isFollower(p))(byHome[p.home]=byHome[p.home]||[]).push(p);
  const F=S.flags;
  return{h,d,tmp,live,near,dz,hosp:hz/3,byHome,night:h<6||h>=22,alarm:!!F.alarm,clinic:!!F.clinic,day1work:d===1&&!F.alarm&&h>=8&&h<17,
    groups:Object.values(S.groups).filter(g=>!g.dead&&g.home&&groupSize(g.id)>0)}}
// how badly someone needs food and water: 0 is fine, 1 is desperate
function needs(p,c){const mates=c.byHome[p.home]||[p];const n=Math.max(1,mates.length);const H=p.home&&BMAP[p.home]&&!p.group?hs(p.home):null;
  const meals=(H?H.food:0)+packMeals(p),drinks=(H?H.water:0)+packDrinks(p);const taps=!S.flags.waterOff&&H;
  const fd=meals/(n*2),wd=taps?9:drinks/(n*2.5);
  return{food:Math.max(clamp((2.5-fd)/2.5,0,1),clamp((40-p.hunger)/40,0,1)),water:Math.max(clamp((2-wd)/2,0,1),clamp((40-(p.thirst??85))/40,0,1)),fd,wd,H,n}}

// ---------- the body: hunger, thirst, sleep, fear, company ----------
function needsHour(p,c){const asleep=p.act==="asleep";
  if(p.thirst==null)p.thirst=85;if(p.rest==null)p.rest=80;if(p.fear==null)p.fear=0;if(p.soc==null)p.soc=60;
  p.hunger=clamp(p.hunger-(asleep?1.6:2.4),0,100);p.thirst=clamp(p.thirst-(asleep?2:3.4),0,100);
  p.rest=clamp(p.rest+(asleep?13:-(p.plan&&p.plan.out?6:4)),0,100);
  if(p.hunger<=0)p.health-=1.5;if(p.thirst<=0)p.health-=3;
  const company=isFollower(p)||(c.byHome[p.home]||[]).length>1||p.group&&groupSize(p.group)>1;p.soc=clamp(p.soc+(company?1:-3),0,100);
  if(!asleep)eatDrink(p,c);
  fearHour(p,c);
  const tm=60-(p.hunger<30?14:0)-(p.thirst<30?14:0)-p.fear*.25-(p.soc<25?8:0)+(p.partner?5:0);p.mood=clamp(p.mood+(tm-p.mood)*.06,0,100);
  // the people who love you hear that you're awake
  if(p.fam.you&&!p.follow&&!p.heard&&S.flags.wake&&!S.player.coma&&S.player.alive!==false){const pl=S.player;if(dist(p.x,p.z,pl.x,pl.z)<40||rf()<.02*Math.min(8,pl.flags.talks||0))p.heard=true}}
function eatDrink(p,c){const meal=c.h===7||c.h===12||c.h===18;const home=!p.group&&p.home&&atHomeB(p)?hs(p.home):null;
  if(p.group&&!isFollower(p)){const g=G(p.group);if(g&&g.home&&regionAt(p.x,p.z)===g.home&&p.thirst<45&&g.stock.water>=.25){g.stock.water-=.25;p.thirst=clamp(p.thirst+35,0,100)}}
  else{
    if(p.hunger<(meal?75:45)){let k=null;for(const q in p.pack||{})if(MEALS(q)&&(!k||MEALS(q)>MEALS(k)))k=q;
      if(home&&home.food>=1&&(p.hunger<45||!k||p.hunger<75&&home.food>4)){home.food-=1;p.hunger=clamp(p.hunger+42,0,100)}
      else if(k){packTake(p,k);p.hunger=clamp(p.hunger+MEALS(k)*42,0,100)}}
    const b=bldAt(p.x,p.z);const tap=!S.flags.waterOff&&b&&b.taps&&b.taps.length;
    if(p.thirst<(meal?80:50)){if(tap)p.thirst=100;else if(home&&home.water>=1){home.water-=1;p.thirst=clamp(p.thirst+42,0,100)}
      else{const k=Object.keys(DRINKS).find(q=>packHas(p,q));if(k){packTake(p,k);packAdd(p,"empty_bottle");p.thirst=clamp(p.thirst+40,0,100);if(k==="river_water"&&rf()<.2)p.health-=6}}}}}
function fearHour(p,c){const F=S.flags;let t=0;
  if(F.alarm)t=c.d<=1?50:c.d<=3?38:28;else if(F.clinic)t=10+p.tr.curious*5;
  t+=Math.min(30,(c.dz[regionAt(p.x,p.z)]||0)*25);
  if(p.seen&&S.t-p.seen<120)t+=22;
  if(p.mem.some(m=>m.v<=-8&&S.t-m.t<DAY))t+=12;
  const g=p.group?G(p.group):null;
  if(g&&g.home&&regionAt(p.x,p.z)===g.home)t-=12+Math.min(16,siteCount(g.home,"wall")*3)+Math.min(10,groupSize(g.id)*.6);
  else if(isFollower(p))t-=10;
  else if(atHomeB(p)){t-=4+Math.min(12,((c.byHome[p.home]||[]).length-1)*3);if(homeBoarded(p.home))t-=8}
  if(npcArm(p))t-=8;t-=p.tr.brave*22;if(p.age<13)t+=8;
  t=clamp(t,0,100);p.fear=clamp(p.fear+(t-p.fear)*.35,0,100)}

// ---------- choosing ----------
function mindHour(p,c){if(p.age<2)return;
  if(p.group){campHour(p,c);return}
  if(p.age<13){kidHour(p,c);return}
  const cur=p.plan;if(cur&&cur.until>S.t&&!urgent(p,c,cur)){planTick(p,c);return}
  startPlan(p,choosePlan(p,c),c)}
function urgent(p,c,cur){if(cur.pre&&c.alarm)return true;if(cur.out&&cur.st!=="back"&&(p.fear>90||p.health<30))return true;
  if(cur.k!=="sleep"&&p.rest<8&&!cur.out)return true;if(cur.k==="sleep"&&c.alarm&&(p.hunger<12||p.thirst<12))return true;return false}
function choosePlan(p,c){const O=[];const add=(k,s,o)=>{if(s>0)O.push(Object.assign({k,s},o||{}))};const N=needs(p,c);p._n=N;const h=c.h,tr=p.tr;const adult=p.age>=16;
  const home=p.home&&BMAP[p.home]?BMAP[p.home]:null;
  if(!c.alarm){// an ordinary day, until it isn't
    if(c.night)add("sleep",80);else if(p.rest<20)add("sleep",50);
    const w=JOBS[p.job]?.work;if(c.day1work&&w&&w!=="home"&&(adult||h<15))add("work",62);
    if(c.clinic&&dayOf(S.t)===1&&["nurse","doctor","deputy"].includes(p.job))add("duty",58+tr.brave*20+tr.kind*10);
    if(c.clinic&&adult&&h<12)add("gawk",12+tr.curious*30+tr.brave*8-(p.job==="nurse"||p.job==="doctor"?60:0));
    if(!c.night&&h>=9&&h<21&&adult)add("errand",14+tr.social*14+(h===12||h===18?14:0)+rf()*6);
    if(h>=18&&h<23&&p.age>=21)add("bar",8+tr.social*24+tr.temper*4-tr.faith*6);
    if(h>=17&&h<22)add("social",12+(100-p.soc)*.3+tr.social*14);
    add("home",h>=17&&h<22?34:26);return pickBest(p,O)}
  // after the alarm, it's about staying alive
  if(c.night)add("sleep",55+(100-p.rest)*.35-(p.fear>75?14:0));else if(p.rest<25)add("sleep",42+(25-p.rest));
  if(p.health<50)add("rest",30+(50-p.health));
  if(p.mood<40&&p.mem.some(m=>m.v<=-8&&S.t-m.t<DAY&&m.a!=="you"))add("mourn",24+(40-p.mood)*.4);
  if(home)add("hide",22+p.fear*.45+(1-tr.brave)*12+(c.d<=1?8:0));
  if(c.d===1&&h<18&&["nurse","doctor","deputy"].includes(p.job))add("duty",28+tr.brave*26+tr.kind*12-p.fear*.3);
  if(c.d===1&&h<18&&p.job==="teacher")add("duty",30+tr.kind*28-p.fear*.25);
  const fam=famMissing(p,c);if(fam)add("gofam",fam.u,{q:fam.q.id});
  const day=!c.night;
  if(home&&HOMES.includes(home.type)&&unboarded(home)&&(N.H&&N.H.boards>0||packHas(p,"wood")>=2&&packHas(p,"nails")))add("board",14+p.fear*.32+p.sk.build*4);
  if(day&&adult&&c.d<=2&&h>=8&&h<20)add("stock",10+N.food*30+N.water*22+tr.ambit*10+tr.brave*8-p.fear*.25-(c.dz.town||0)*12);
  if(day&&adult)add("scavenge",6+N.food*55+N.water*35+tr.brave*12+p.sk.scavenge*3-p.fear*.35-(c.dz.town||0)*18);
  if(S.flags.waterOff&&adult&&N.water>0)add("water",10+N.water*62-p.fear*.2-(c.dz.river||0)*10-(c.night?25:0));
  if(day&&adult&&(p.sk.survive>=2||N.food>.6)){add("forage",4+N.food*38+p.sk.survive*5-p.fear*.25-(c.dz.fields||0)*10);if(npcArm(p)||p.sk.survive>=3)add("hunt",2+N.food*40+p.sk.survive*5-p.fear*.25-(c.dz.woods||0)*10)}
  if(adult&&c.groups.length){const tg=bestGroup(p,c,N);if(tg)add("seek",tg.s,{g:tg.g.id})}
  if(adult){const pk=pactWith(p,c,N);if(pk)add("pact",pk.s,{q:pk.q.id})}
  if(adult&&c.d>=2&&!p.seed&&p.hh!=="you"&&!p.fam.you){const s=(1-tr.brave)*22+p.fear*.32+N.food*10-(fam?40:0)-p.mem.filter(m=>m.v>=5).length*2;if(s>30)add("flee",s-6)}
  if(adult&&N.food>.65&&p.hunger<35&&tr.honest<.45)add("steal",6+N.food*28+(1-tr.honest)*18-tr.kind*14-p.fear*.15+(c.night?10:0));
  if(h>=17&&h<23||p.soc<25)add("social",8+(100-p.soc)*.32+tr.social*12-p.fear*.18);
  add("home",16);
  return pickBest(p,O)}
function pickBest(p,O){let b=null;const cur=p.plan&&p.plan.until>S.t?p.plan.k:null;for(const o of O){o.s+=rf()*8+(o.k===cur?10:0);if(!b||o.s>b.s)b=o}return b||{k:"home",s:0}}
// the person they'd go out into all of this for
function famMissing(p,c){let best=null;const pl=S.player;
  for(const [id,rel] of Object.entries(p.fam)){
    if(id==="you"){if(p.follow||pl.alive===false||!["partner","sibling","little sibling","kid","son","parent","mom or dad","guardian"].includes(rel))continue;
      if(pl.coma?c.alarm&&c.d===1&&!S.flags.triedYou&&p.age>=14:p.heard&&dist(p.x,p.z,pl.x,pl.z)>8){const u=pl.coma?50:60;if(!best||u>best.u)best={q:pl,u}}continue}
    const q=P(id);if(!q||!q.alive||q.group&&q.group===p.group||isFollower(q)||dist(q.x,q.z,p.x,p.z)<7)continue;
    if(q.home===p.home&&!q.group&&atHomeB(q)&&!atHomeB(p)&&q.age>=13)continue;
    if(q.home===p.home&&!q.group&&atHomeB(q)&&atHomeB(p))continue;
    const r=relGet(p,q);if(r<20)continue;
    let u=q.age<13?72:q.age<18?58:p.partner===q.id?52:r>60?36:24;if(q.group)u*=.45;if(q.plan&&q.plan.k==="with")u*=.3;u+=p.tr.kind*8-(p.fear>85?12:0);
    if(!best||u>best.u)best={q,u}}
  return best}
// which camp a household would go to, and how much they want to
const RALLY={walt:"r_farm",grace:"r_church",ray:"r_school",cole:"r_quarry"};
function bestGroup(p,c,N){const mates=(c.byHome[p.home]||[p]).filter(q=>q.hh===p.hh);if(mates.some(q=>q!==p&&q.age>=16&&q.tr.ambit>p.tr.ambit))return null;
  if(mates.some(q=>q.seed&&RALLY[q.seed]&&!S.flags[RALLY[q.seed]]))return null; // they mean to start their own
  const kids=mates.some(q=>q.age<13);let best=null;
  for(const g of c.groups){if(p.rej&&p.rej[g.id]&&S.t-p.rej[g.id]<DAY*3)continue;if(g.pol.closed)continue;
    let s=0;const L=g.leader==="you"?null:P(g.leader);const ms=members(g.id);
    for(const q of mates){for(const m of ms)s+=Math.max(-5,relGet(q,m))/25;if(L)s+=relGet(q,L)/12;if(Object.keys(q.fam).some(id=>P(id)?.alive&&P(id).group===g.id))s+=22}
    if(g.home==="church")s+=p.tr.faith*10+p.tr.kind*4;if(g.home==="quarry")s+=p.tr.brave*6+p.tr.ambit*4-p.tr.kind*6-(kids?6:0);if(g.home==="farm")s+=(p.job.startsWith("farm")?8:0)+3;if(g.home==="school")s+=(kids?4:0)+p.tr.honest*3;
    if(g.leader==="you")for(const q of mates)s+=feel(q)/8;
    const gs=groupSize(g.id);s-=gs/5+Math.max(0,gs-14)*.9;
    if(!best||s>best.s)best={g,s}}
  if(!best)return null;if(!S.hold)S.hold={};if(S.hold[p.hh]==null)S.hold[p.hh]=clamp(Math.round(rf()*4+(1-p.tr.social)*4+p.tr.brave*2-(kids?1:0)),1,12);
  const s=6+p.fear*.3+N.food*26+N.water*18+(1-p.soc/100)*8+p.tr.social*10+(kids?6:0)+Math.min(12,(c.d-1)*3)-p.tr.ambit*10-(1-p.tr.social)*8-(c.d<S.hold[p.hh]?30:0)+best.s*.6;
  return{g:best.g,s}}
// which neighbors they'd move in with
function pactWith(p,c,N){if(c.h<8||c.h>19||p.pactT&&S.t-p.pactT<DAY||p.hh==="you"||p.fam.you)return null;const home=BMAP[p.home];if(!home||!HOMES.includes(home.type))return null;
  const mates=c.byHome[p.home]||[];if(mates.length>=6||mates.some(q=>q!==p&&q.age>=16&&q.tr.social>p.tr.social&&q.hh===p.hh))return null;
  let best=null;for(const [bid,qs] of Object.entries(c.byHome)){if(bid===p.home||bid===S.player.home)continue;const b=BMAP[bid];if(!b||!HOMES.includes(b.type))continue;
    const dd=dist(b.x,b.z,home.x,home.z);if(dd>32||qs.length+mates.length>8||qs.some(q=>q.hh==="you"||q.fam.you))continue;
    const heads=qs.filter(q=>q.age>=16);if(!heads.length)continue;let r=-100;for(const q of heads)r=Math.max(r,relGet(p,q));if(r<-5)continue;
    const s=8+p.fear*.3+(mates.length<=1?14:mates.length<=2?6:0)+Math.max(N.food,N.water)*12+p.tr.social*10+p.tr.kind*5+r*.25-dd*.3-(1-p.tr.social)*6+Math.min(9,(c.d-1)*3);
    if(!best||s>best.s)best={q:heads.sort((a,b)=>relGet(p,b)-relGet(p,a))[0],s}}
  return best}

// ---------- doing ----------

function arrivedAt(p,c,pl){if(!c.live||!c.near.has(p.id)){p.x=p.tx;p.z=p.tz;return true}return dist(p.x,p.z,p.tx,p.tz)<3}
function planTick(p,c){const pl=p.plan;
  if(pl.k==="with"){const L=P(pl.lead);if(!L||!L.alive||L.group&&L.group!==p.group&&!p.group){if(L&&L.group&&L.alive){joinGroup(p,L.group,true)}p.plan=null;return}placeTo(p,{x:L.tx+(rf()-.5)*1.6,z:L.tz+(rf()-.5)*1.6});setAct(p,`with ${L.name}`,L.expo??.3);return}

  if(pl.st==="do"){onWork(p,c,pl);if(p.plan!==pl)return;pl.n--;if(pl.n<=0){if(pl.ret){pl.st="back";goHome(p);setAct(p,"heading home",.6);pl.until=S.t+180}else pl.until=S.t}return}

function onArrive(p,c,pl){const k=pl.k;

  else if(k==="gofam")reunite(p,c,pl);
  else if(k==="seek")askJoin(p,c,pl);
  else if(k==="pact")offerPact(p,c,pl);
  else if(k==="steal")trySteal(p,c,pl);
  else if(k==="errand"&&pl.bid==="diner")p.hunger=clamp(p.hunger+40,0,100);
  else if(k==="social"&&pl.q){const q=P(pl.q);if(q&&q.alive)bond(p,q,"talking")}
  else if(k==="bar"){p.soc=clamp(p.soc+20,0,100);const there=S.people.filter(q=>q!==p&&q.alive&&q.plan&&q.plan.k==="bar");if(there.length){const q=pick(there);relAdd(p,q,(compat(p,q)-.4)*6+rf()*3)}}}
function onWork(p,c,pl){const k=pl.k;

  if(k==="forage")pl.got+=(.4+p.sk.survive*.25)*(.5+rf())*(S.flags.winter?.4:1);
  if(k==="hunt"&&rf()<.22+p.sk.survive*.06+(npcArm(p)?.1:0))pl.got+=rnd(2,5);

// bring it all home: what they found goes into the house, they keep a little on them
function unpack(p,pl){const H=p.home&&BMAP[p.home]&&!p.group?hs(p.home):null;if(!H)return;

  let keepF=1,keepW=1;for(const k of Object.keys(p.pack||{})){const m=MEALS(k);if(m){const n=p.pack[k]-(keepF>0?1:0);keepF=0;if(n>0){H.food+=m*n;packTake(p,k,n)}}
    else if(DRINKS[k]){const n=p.pack[k]-(keepW>0&&k==="water_bottle"?1:0);if(k==="water_bottle")keepW=0;if(n>0){H.water+=DRINKS[k]*n;packTake(p,k,n)}}
    else if(k==="wood"&&p.pack[k]>=2&&packHas(p,"nails")){H.boards+=Math.floor(p.pack[k]/2);packTake(p,k,p.pack[k]);packTake(p,"nails",1)}
    else if(["bandage","painkillers","antibiotics"].includes(k)&&p.pack[k]>1){H.med+=p.pack[k]-1;packTake(p,k,p.pack[k]-1)}}
  if(pl.found>=6&&rf()<.25)news(`${fullName(p)} came back from ${BMAP[pl.bid]?.n||"town"} with a full bag.`,"",[p.id])}

// ---------- the cupboards are the same ones you search ----------
const SHOPS=["grocery","pharmacy","gas","hardware","diner","bar","library","sheriff"];
function contLeft(b){let n=0;for(const C of b.cs){const s=S.cont[C.id];if(!s||!s.rolled||s.c.items.length)n++}return n}
function lootTarget(p,c,k,base){const home=base||BMAP[p.home]||{x:p.x,z:p.z};const N=p._n||{food:0,water:0};let best=null,bs=-1e9;
  for(const b of BUILDINGS){if(b.site||b.id===S.player.home||b.id===p.home||!b.cs.length)continue;const shop=SHOPS.includes(b.id);if(k==="stock"&&!shop)continue;
    if(!shop&&(!HOMES.includes(b.type)||(c.byHome[b.id]||[]).length))continue;
    const left=contLeft(b);if(!left)continue;const vis=(S.bl&&S.bl[b.id])||0;
    let s=left*1.2-dist(b.x,b.z,home.x,home.z)/9-vis*1.4+(shop?4:0)+rf()*4;
    if(N.water>.4&&(b.id==="grocery"||b.id==="gas"))s+=4;if(p.health<60&&b.id==="pharmacy")s+=4;if(b.id==="clinic")s-=20;

// what they'd want to carry out of a building
function npcWants(p,id){const it=ITEMS[id];if(!it)return 0;if(MEALS(id)||DRINKS[id])return 3;if(["bandage","painkillers","antibiotics"].includes(id))return 2;
  if(it.slot==="weapon"&&it.dmg>npcArm(p))return 3;if(id==="ammo"&&npcGun(p))return 2;if(["nails","wood","duct_tape","hammer"].includes(id))return 1;if(["flashlight","lighter","cards","cigarettes","whiskey"].includes(id)&&!packHas(p,id))return 1;return 0}
function lootSome(p,b,max){if(!b)return 0;let got=0;const cap=(p.age<16?8:14)+(packHas(p,"backpack")?6:0);
  for(const C of shuffle([...b.cs]).slice(0,4)){if(got>=max||packCount(p)>=cap)break;const s=rollLoot(C.id);
    const items=[...s.c.items].sort((a,o)=>npcWants(p,o.id)-npcWants(p,a.id));
    for(const o of items){if(got>=max||packCount(p)>=cap)break;const w=npcWants(p,o.id);if(w<=0||w===1&&rf()<.5)continue;
      const it=ITEMS[o.id];if(it.slot==="weapon")for(const q in p.pack)if(ITEMS[q]?.slot==="weapon")delete p.pack[q];
      cRemove(s.c,o);s.rev=(s.rev||0)+1;packAdd(p,o.id,it.slot?1:o.n);got++}}
  if(!S.bl)S.bl={};S.bl[b.id]=(S.bl[b.id]||0)+1;return got}
function stealTarget(p,c){const home=BMAP[p.home]||{x:p.x,z:p.z};let best=null,bs=-1e9;
  for(const [bid,qs] of Object.entries(c.byHome)){if(bid===p.home||bid===S.player.home)continue;const b=BMAP[bid];if(!b||!HOMES.includes(b.type))continue;const H=hs(bid);if(H.food<3)continue;
    const d=dist(b.x,b.z,home.x,home.z);if(d>40)continue;const s=H.food-d/6-qs.length*2-qs.reduce((a,q)=>a+Math.max(0,relGet(p,q)),0)/20;if(s>bs){bs=s;best=b}}

// ---------- the people they love ----------
function reunite(p,c,pl){const pl0=S.player;
  if(pl.q==="you"){if(pl0.coma){S.flags.triedYou=p.id;mem(p,`I went to the hospital for ${pl0.name.split(" ")[0]}. The dead were already inside. I couldn't get to them.`,-6,"you");p.fear=Math.min(100,p.fear+15);news(`${fullName(p)} tried to get into the hospital to reach someone and was driven back by the dead.`,"",[p.id]);pl.until=S.t;return}
    if(dist(p.x,p.z,pl0.x,pl0.z)<8||!c.live){p.follow=true;p.plan=null;p.heard=false;const r=p.fam.you;mem(p,`Found ${pl0.name.split(" ")[0]}. Alive. Awake. I'm not letting go again.`,12,"you");p.trust=clamp(p.trust+10,-100,100);p.aff=clamp(p.aff+10,-100,100);
      journal(`${p.name} found you. Your ${pl0.fam[p.id]||r||"family"}. Neither of you can say anything for a long time.`,"big");if(c.live&&W3.ok){bubble(p,styleSay(p,pick(["You're awake. You're really awake.","I looked everywhere for you. Everywhere.","Oh my God. Come here."])),4);snapFollowers()}markUI();return}
    pl.st="go";pl.wait=0;placeTo(p,{x:pl0.x+(rf()-.5)*2,z:pl0.z+(rf()-.5)*2});return}
  const q=P(pl.q);if(!q||!q.alive){pl.until=S.t;return}
  if(c.live&&c.near.has(p.id)&&dist(p.x,p.z,q.x,q.z)>6){pl.st="go";pl.wait=(pl.wait||0);placeTo(p,{x:q.x,z:q.z});return}
  const rel=p.fam[q.id]||"family";
  if(q.group&&q.group!==p.group){p.famHint=q.group;mem(p,`${q.name} is with ${G(q.group).name} now.`,2,q.id);pl.until=S.t;return}
  q.plan={k:"with",lead:p.id,t:S.t,until:S.t+4*60,st:"do"};if(q.home!==p.home&&(q.age<18||p.partner===q.id)){q.home=p.home}
  mem(p,`Got to ${q.name}. ${q.age<13?"Never letting go of that hand again.":"We're together. That's what matters."}`,6,q.id);mem(q,`${p.name} came for me.`,8,p.id);relAdd(p,q,6);

// a household arrives at a camp and asks to be let in
function joinVerdict(g,ps){if(g.leader==="you")return!g.pol.closed;const L=P(g.leader);if(!L)return true;const n=groupSize(g.id);const days=g.stock.food/Math.max(1,n);
  let s=8+L.tr.kind*26+L.tr.ambit*8-(n>14?(n-14)*3:0)+(days>4?10:days<1.5?-15:0)+(g.pol.stance==="hostile"?-14:g.pol.stance==="friendly"?8:0);
  for(const q of ps){s+=relGet(L,q)/8;if(q.age>=16)s+=(q.sk.fight+q.sk.medic+q.sk.build+q.sk.survive)*.7;else s-=3;if(q.job==="doctor"||q.job==="nurse")s+=8}
  const H=ps[0]&&ps[0].home&&S.hs&&S.hs[ps[0].home];if(H)s+=Math.min(12,H.food*.4);return s+rf()*14>24}

// everyone they bring, and some of what they had
function bringIn(g,ps){const homes=new Set(ps.map(q=>q.home));for(const q of ps){joinGroup(q,g.id,true);placeTo(q,randIn(g.home,3));q.plan=null;mem(q,`We made it to ${PLACES[g.home].n}. ${g.name} took us in.`,4)}

// neighbors moving in together: one roof, one pantry, more eyes at night

function formPact(p,q){const A=p.home,B=q.home;const sc=bid=>{const H=hs(bid);const b=BMAP[bid];return H.food+H.water*.6+H.boards*3+b.beds.length*2+(homeBoarded(bid)?6:0)};

  const n1=p.sur||p.name,n2=q.sur||q.name;mem(p,`We moved in with the ${n2===n1?q.name:n2} household. Safer together.`,4,q.id);mem(q,`We teamed up with the ${n1===n2?p.name:n1} household. Safer together.`,4,p.id);
  news(`The ${n1} and ${n2===n1?q.name:n2} households moved in together at ${BMAP[host].n} to pool what they have.`,"good",[p.id,q.id])}
function trySteal(p,c,pl){const b=BMAP[pl.bid];const H=hs(pl.bid);const there=(c.byHome[pl.bid]||[]).filter(q=>q.alive);const awake=there.filter(q=>q.act!=="asleep"&&q.age>=12);
  if(rf()<.55+(c.night?.25:0)-awake.length*.15){const n=Math.min(H.food,rnd(2,5));H.food-=n;pl.got=n;for(const q of there)if(q.age>=12)mem(q,`Someone got in and took food from us. ${rf()<.3?"I think I know who.":""}`.trim(),-4,p.id);if(rf()<.3)news(`Food went missing from ${b.n} overnight.`,"bad");return}
  for(const q of awake){relAdd(p,q,-45);mem(q,`Caught ${p.name} stealing our food.`,-8,p.id)}mem(p,`Got caught taking food from ${b.n}.`,-6,awake[0]?awake[0].id:p.id);
  news(`${fullName(p)} was caught stealing food from ${b.n}.`,"bad",[p.id]);if(awake.length&&rf()<.35){hurt(p,rnd(5,20),`was beaten for stealing food`);if(rf()<.4)hurt(pick(awake),rnd(4,14),`was hurt catching a thief`)}}

// ---------- doors ----------
function secureHome(p){const b=BMAP[p.home];if(!b||!S.flags.alarm||typeof doorSave!=="function")return;for(const d of b.exits){const D=d.door;if(!D||D.broken||!D.open)continue;if(typeof doorBlocked==="function"&&doorBlocked(D))continue;D.open=false;D.auto=false;doorSave(D)}}
function boardOne(p){const b=BMAP[p.home];if(!b||typeof doorSave!=="function")return;const H=hs(p.home);const d=b.exits.slice(1).find(d=>d.door&&!d.door.bar&&!d.door.broken);if(!d)return;
  if(H.boards>0)H.boards--;else if(packHas(p,"wood")>=2&&packHas(p,"nails")){packTake(p,"wood",2);packTake(p,"nails",1)}else return;
  const D=d.door;D.open=false;D.bar=(D.bar||0)+1;D.hp=Math.min(doorMaxHp(D),(D.hp||100)+150);doorSave(D);if(c_near(p))noise(D.x,D.z,10);

// ---------- kids ----------
function kidHour(p,c){if(p.plan&&p.plan.k==="with"&&p.plan.until>S.t){planTick(p,c);return}

    if(c.night){if(home)goHome(p,true);setAct(p,"asleep",0);return}if(home&&!atHomeB(p))placeTo(p,insidePos(home));setAct(p,pick(["playing at home","drawing at the kitchen table","watching TV"]),0);return}
  if(b&&b.id==="schoolbldg"&&p.home!=="schoolbldg"&&!atHomeB(p)){const par=p.parents.map(P).find(q=>q&&q.alive);if(rf()<.3)placeTo(p,insidePos(b));setAct(p,`waiting at the school${par?" for "+par.name:""}`,.12);return}

  if(home&&!atHomeB(p)&&!b)placeTo(p,insidePos(home));setAct(p,p.fear>55?"hiding at home":pick(["playing quietly at home","hiding under the kitchen table","drawing at home"]),.04)}

// ---------- in a camp ----------
const ROLE_EX={scavenger:1,hunter:.45,forager:.5,fisher:.45,woodcutter:.4,guard:.2,farmer:.1,builder:.1,medic:.05,cook:.05,crafter:.05,kid:.04,elder:.04};
function campSafe(g){if(!g.home)return 1;const ms=members(g.id);return 1/(1+siteCount(g.home,"wall")*.25+ms.filter(p=>p.role==="guard").length*.15)}
function campHour(p,c){const g=G(p.group);if(!g)return;const home=g.home;const hurtNow=p.health<45;const h=c.h;let dest=null,act="",ex=.12;p.plan=null;
  const work=h>=8&&h<17;
  if(c.night){dest=home?sitePos(home,true):null;act="asleep";ex=.03}
  else if(work&&!hurtNow&&p.role&&p.age>=12){const R=ROLES[p.role];const away=R.loc!=="home";
    let w=null;
    if(away&&p.fear>88){dest=home?randIn(home,3):null;act="too scared to leave camp";ex=.1}
    else if(w=waterRun(p,g)){dest=w;act="hauling water up from the river";ex=.5}
    else{const L=R.loc==="home"?home:R.loc;dest=L?randIn(L,3):null;act=R.act;const r=groupWork(p,g,c.tmp,c);if(r){dest=r.dest||dest;act=r.act||act}ex=ROLE_EX[p.role]??.15}}
  else{let q=null;if(h>=17&&p.age>=8&&rf()<.55&&p.soc<85){const fr=members(g.id).filter(o=>o!==p&&o.age>=8&&o.act!=="asleep"&&relGet(p,o)>10);if(fr.length)q=fr.sort((a,b)=>relGet(p,b)+rf()*25-relGet(p,a)-rf()*25)[0]}
    if(q){const v=pairVerb(p,q,c);dest={x:q.tx+(rf()-.5)*1.2,z:q.tz+(rf()-.5)*1.2};act=`${v} with ${q.name}`;bond(p,q,v);ex=.08}
    else{dest=home?randIn(home,3):null;act=hurtNow?"resting, injured":h>=17?"by the fire":"eating"}}
  if(!home){const lead=g.leader==="you"?S.player:P(g.leader);if(lead)dest={x:lead.x+(rf()-.5)*6,z:lead.z+(rf()-.5)*6}}
  if(dest&&(rf()<.6||p.act!==act))placeTo(p,dest);p.act=act;p.expo=ex*(home&&regionAt(p.tx,p.tz)===home?campSafe(g):1)}

// a camp with no well sends people to the river with every bottle and bucket they have
const WR={};
function waterRun(p,g){const n=groupSize(g.id);if(!g.home||g.stock.water>=n*1.4||p.age<14)return null;if(["medic","cook","guard"].includes(p.role)&&n>4)return null;
  const R=WR[g.id]&&WR[g.id].t===S.t?WR[g.id]:(WR[g.id]={t:S.t,n:0});if(R.n>=Math.max(2,Math.ceil(n/5)))return null;R.n++;
  const cen=campXZ(g);const z=cen.z<47?40.3:53.7;let x=clamp(cen.x+rnd(-6,6),-118,118);for(let i=0;i<8&&!free(x,z,.3,"npc");i++)x=clamp(x+rnd(-5,5),-118,118);
  g.stock.water+=.9+p.sk.survive*.1;return{x,z}}

// ---------- company ----------
function friendFor(p,c){const near=c.alarm;let best=null,bs=-1e9;
  for(const q of S.people){if(q===p||!q.alive||q.age<8||q.group||isFollower(q)||q.act==="asleep")continue;const r=relGet(p,q);if(r<15&&!(q.home===p.home&&r>-10))continue;
    const same=q.home===p.home;if(near&&!same&&dist(q.x,q.z,p.x,p.z)>14)continue;if(!near&&!same&&r<35)continue;
    const s=r+(same?15:0)+(p.partner===q.id?25:0)+rf()*20;if(s>bs){bs=s;best=q}}
  return best}
function pairVerb(p,q,c){const both=k=>p.tr[k]+q.tr[k];if(p.partner===q.id)return pick(["curled up on the couch","talking quietly","holding hands"]);if(p.age<13||q.age<13)return pick(["playing a board game","reading a story","playing cards"]);
  if((packHas(p,"whiskey")||packHas(q,"whiskey"))&&p.age>=21&&q.age>=21&&rf()<.5)return"sharing a drink";if((packHas(p,"cards")||packHas(q,"cards"))&&rf()<.6||both("curious")>1.2&&rf()<.4)return"playing cards";
  if(both("faith")>1.5&&rf()<.5)return"praying";return pick(["talking","talking","sitting","telling old stories","swapping jokes"])}
// time together: how they come out of it depends on who they both are
function bond(p,q,v){const cp=compat(p,q);let d=1.5+cp*5.5+(v==="sharing a drink"?1.5:0)+(v==="playing cards"?.8:0)-(p.tr.temper>.7&&q.tr.temper>.7?2.5:0);if(v==="sharing a drink"&&rf()<.12&&(p.tr.temper>.7||q.tr.temper>.7))d=-6;
  relAdd(p,q,d);p.soc=clamp(p.soc+25,0,100);q.soc=clamp((q.soc??60)+20,0,100);p.mood=clamp(p.mood+2,0,100);q.mood=clamp(q.mood+2,0,100);
  if(v==="sharing a drink"){const k=packHas(p,"whiskey")?p:q;if(rf()<.35)packTake(k,"whiskey")}
  if(q.plan&&["home","hide"].includes(q.plan.k)||q.group&&q.act&&/fire|eating/.test(q.act))q.act=`${v} with ${p.name}`;
  const r=relGet(p,q);if(canPair(p,q)&&r>=50&&attraction(p,q)>.55&&rf()<.12){p.partner=q.id;q.partner=p.id;mem(p,`${q.name} and I are together now.`,8,q.id);mem(q,`${p.name} and I are together now.`,8,p.id);news(`${fullName(p)} and ${fullName(q)} are together now.`,"good",[p.id,q.id])}
  if(d<0){mem(p,`${q.name} and I got into it over a bottle.`,-3,q.id);mem(q,`${p.name} and I got into it over a bottle.`,-3,p.id)}}

// ---------- the dead, away from you ----------
// near you, the dead in the street do this for real; everywhere else, it's the odds of what they're doing where they are
function riskHour(p,c){if(!c.alarm&&!(c.clinic&&p.plan&&(p.plan.k==="duty"||p.plan.k==="gawk")))return;const ex=p.expo??.06;if(ex<=0)return;
  let dens=c.dz[regionAt(p.tx,p.tz)]||0;if(p.plan&&(p.plan.k==="duty"||p.plan.k==="gawk")&&p.job!=="teacher")dens=Math.max(dens,c.hosp);
  if(!p.group&&p.home&&atHomeB(p)){if((c.byHome[p.home]||[]).length>=3)dens*=.7;if(homeBoarded(p.home))dens*=.55}
  if(rf()<Math.min(.4,dens*ex*.045))encounter(p,c)}
function encounter(p,c){const b=bldAt(p.tx,p.tz);const at=b?b.n:PLACES[regionAt(p.tx,p.tz)]?.n||"town";const arm=npcArm(p);
  const odds=.15+p.sk.fight*.07+arm*.035+p.tr.brave*.12-(p.health<50?.12:0)-(p.age<16?.2:0)+(p.group?.08:0)+(p.seed?.15:0);
  p.fear=Math.min(100,p.fear+25);p.seen=S.t;
  if(rf()<odds){const k=rf()<.3?2:1;cullNear(p.tx,p.tz,k);p.kills=(p.kills||0)+k;if(rf()<.25)hurt(p,rnd(4,14),`was hurt fighting off the dead at ${at}`);
    if(rf()<.3)mem(p,`Put down ${k>1?"two of the dead":"one of the dead"} at ${at}. My hands haven't stopped shaking.`,-1,p.id);if(rf()<.1)news(`${fullName(p)} fought off the dead at ${at}.`,"",[p.id]);return}
  const r=rf();
  if(r<.5){mem(p,`The dead nearly had me at ${at}. I ran.`,-3,p.id);return}
  if(r<.78||p.seed&&r<.92&&rf()<.6){hurt(p,rnd(10,30),`was attacked by the dead at ${at}`);return}
  if(r<.92){p.bitten=S.t+rnd(5,30)*60;tally("bit away");mem(p,"I got bit. I haven't told anyone.",-10,p.id);if(rf()<.3)news(`Rumor: ${fullName(p)} was seen with a bloody bandage on their arm.`,"",[p.id]);return}

function cullNear(x,z,k){const pl=S.player;const L=S.zeds.filter(q=>!q.pid&&Math.abs(q.x-x)<30&&Math.abs(q.z-z)<30&&dist(q.x,q.z,pl.x,pl.z)>45).sort((a,b)=>dist(a.x,a.z,x,z)-dist(b.x,b.z,x,z));
  for(const q of L.slice(0,k))S.zeds.splice(S.zeds.indexOf(q),1)}
// the ones the dead pull down often get back up
function riseLater(p,mins){if(!S.rise)S.rise=[];S.rise.push({id:p.id,t:S.t+mins,x:p.x,z:p.z})}
function riseTick(){if(!S||!S.rise||!S.rise.length)return;S.rise=S.rise.filter(r=>{if(S.t<r.t)return true;const p=P(r.id);if(!p||p.status!=="dead")return false;
  p.status="turned";spawnZed(r.x,r.z,{name:fullName(p),pid:p.id});if(typeof FIG!=="undefined"&&FIG.corpses)FIG.corpses=FIG.corpses.filter(c=>c.f.id!==p.id);
