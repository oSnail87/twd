<title>Still Breathing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: field notebook. Vitals strip on top; center = the isometric world with tabs under it; left = what you can do here; right = the town's news wire. */
:root{
  --bg:#0f110f; --panel:#161a17; --panel2:#1e231f; --line:#2d352f;
  --fg:#e9e4d7; --mute:#9ba496; --ember:#e48a3f; --lichen:#a9c38d; --blood:#d4574a; --sky:#86aac4;
  --f-display:"Saira Stencil One","Arial Narrow",Impact,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.mute{color:var(--mute)}
.lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;border-bottom:1px solid var(--line);padding-bottom:10px}
header.top h1{font-size:28px;color:var(--ember);line-height:1}
.clock{font-family:var(--f-mono);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.clock b{color:var(--fg);font-weight:600}
.vitals{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.vital{min-width:78px}
.vital .bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:3px}
.vital .bar i{display:block;height:100%;background:var(--lichen)}
.vital.low .bar i{background:var(--blood)} .vital.mid .bar i{background:var(--ember)}
.cond{font-family:var(--f-mono);font-size:11px;color:var(--blood);border:1px solid var(--blood);border-radius:3px;padding:0 6px}
.grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,270px);gap:14px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:minmax(0,290px) minmax(0,1fr)} .news{grid-column:1/-1}}
@media (max-width:780px){.grid{grid-template-columns:minmax(0,1fr)} .vitals{margin-left:0} .centercol{order:-1}}
.centercol{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.loc h2{font-size:22px;line-height:1.1}
.loc .desc{color:var(--mute);font-size:14px}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.btn:hover:not(:disabled){border-color:var(--ember)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.btn.pri{background:var(--ember);color:#1a120a;border-color:var(--ember)} .btn.pri small{color:#3a2512}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px}
.chip:hover{border-color:var(--sky)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mute);flex:0 0 auto}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 11px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.tab.on{color:var(--fg);border-bottom-color:var(--ember)}
.journal{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.entry{border-left:2px solid var(--line);padding:2px 0 2px 10px}
.entry .mono{color:var(--mute)}
.entry.good{border-left-color:var(--lichen)} .entry.bad{border-left-color:var(--blood)} .entry.big{border-left-color:var(--ember)}
.news{max-height:calc(100vh - 110px);overflow:auto}
.news .entry{font-size:13.5px}
.talk{display:flex;flex-direction:column;gap:10px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:4px}
.msg{max-width:85%;padding:8px 11px;border-radius:8px;white-space:pre-wrap}
.msg.you{align-self:flex-end;background:#2c3a31}
.msg.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.sys{align-self:center;font-family:var(--f-mono);font-size:11.5px;color:var(--mute);text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input,.row > select{flex:1;min-width:0}
.meter{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px}
.meter .track{flex:1;height:6px;background:var(--panel2);position:relative;border-radius:3px;min-width:60px}
.meter .track i{position:absolute;top:0;bottom:0;border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);text-align:left;font-weight:400}
td,th{padding:5px 8px;border-bottom:1px solid var(--line)}
td.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-mono);font-size:12px}
tr.click:hover td{background:var(--panel2);cursor:pointer}
.scroll{overflow-x:auto}
.lotgrid{display:grid;gap:3px;max-width:560px}
.tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:3px;background:#1a1f1b;font-family:var(--f-mono);font-size:10px;display:flex;align-items:center;justify-content:center;position:relative;padding:0;overflow:hidden}
.tile.b{color:#14100b;font-weight:600}
.tile.site{background:repeating-linear-gradient(45deg,#2c2f22,#2c2f22 4px,#1e211a 4px,#1e211a 8px);color:var(--ember)}
.tile .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--ember)}
.tile.sel{outline:2px solid var(--sky)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.modal-bg{position:fixed;inset:0;background:rgba(6,7,6,.8);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--panel);border:1px solid var(--ember);border-radius:8px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:26px;color:var(--ember)}
.modal p{margin:0;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:6px}
.create{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.create h1{font-size:clamp(42px,9vw,92px);color:var(--ember);line-height:.9}
.create .lede{font-size:17px;max-width:62ch}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.pickset{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13.5px}
.pick.on{border-color:var(--ember);color:var(--ember)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:4px;padding:7px 9px;min-width:0}
.dur{height:3px;background:var(--bg);border-radius:2px;margin-top:4px;overflow:hidden}.dur i{display:block;height:100%;background:var(--lichen)}
.tag{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--mute);background:transparent}
button.tag{background:var(--panel2);color:var(--fg);cursor:pointer}button.tag:hover{border-color:var(--ember)}
.pos{color:var(--lichen)}.neg{color:var(--blood)}.warn{color:var(--ember)}
/* world view */
.viewslot{position:relative;height:clamp(320px,58vh,620px);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b0f14}
.w3{position:absolute;inset:0;touch-action:none}
.w3 canvas:not(.mini){display:block;width:100%;height:100%}
.w3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.w3label{position:absolute;left:0;top:0;font-family:var(--f-mono);font-size:11px;background:rgba(15,17,15,.82);border:1px solid var(--line);color:var(--fg);padding:2px 6px;border-radius:3px;white-space:nowrap}
.w3label.hover{border-color:var(--sky)} .w3label.hover span{color:var(--mute)}
.w3label.comp{border-color:var(--lichen);color:var(--lichen)}
.w3label.want{border-color:var(--ember);color:var(--ember);font-weight:600}
.w3label.place{background:none;border:none;font-family:var(--f-display);font-size:15px;color:rgba(233,228,215,.75);letter-spacing:.08em;text-shadow:0 1px 3px #000}
.w3hint{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 330px);line-height:1.35;color:rgba(233,228,215,.6);font-size:10.5px;pointer-events:none;text-shadow:0 1px 2px #000}
.w3prompt{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(15,17,15,.9);border:1px solid var(--ember);padding:5px 12px;border-radius:4px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.w3fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);padding:20px;text-align:center}
.mini{position:absolute;right:8px;top:8px;border:1px solid var(--line);border-radius:4px;background:rgba(10,12,10,.7);pointer-events:none}
.w3btns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.w3btns button{background:rgba(15,17,15,.85);border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);font-size:11px;padding:4px 8px}
.w3btns button.on{border-color:var(--ember);color:var(--ember)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--ember);border-radius:6px;padding:10px 14px;z-index:60;max-width:min(90vw,520px)}
[hidden]{display:none!important}
.w3label.dead{border-color:var(--blood);color:var(--blood)}
.w3label.bld{background:rgba(15,17,15,.55);color:var(--mute);font-size:10px;border-color:transparent}
.w3area{position:absolute;left:12px;top:10px;font-family:var(--f-display);font-size:22px;color:var(--fg);text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;letter-spacing:.06em}
.w3hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.55))}
.w3prompt.passive{border-color:var(--line);color:var(--mute);cursor:default}
button.tag:disabled,.chip:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:700px){.w3hint{display:none}.w3 canvas.mini{width:104px;height:80px}.w3area{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.entry.fresh{animation:fade .5s ease}@keyframes fade{from{background:#2a3324}to{background:transparent}}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="app"></div>
