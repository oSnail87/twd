<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#14171a;--bg2:#1c2024;--panel:rgba(20,23,26,.93);--fg:#e9e4da;--mut:#9d978b;--dim:#6d685f;--line:#2e3337;--line2:#454b50;--acc:#e8a050;--good:#9cc27a;--bad:#e06a50;--warn:#e8c060;

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:var(--bg2);border:1px solid var(--line2);border-radius:5px;padding:6px 11px}

button.pri{background:var(--acc);color:#1a1208;border-color:var(--acc);font-weight:600}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:8px 10px;width:100%}
input:focus{outline:none;border-color:var(--acc)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.tag.you{color:var(--acc)}.tag.str{color:#b8d4ff}.tag.riv{color:#ff9c88}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:240px;background:#f4efe4;color:#1b1a17;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f4efe4}

.site{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(20,23,26,.88);border:1px solid var(--acc);border-radius:6px;padding:4px 8px;font-family:var(--f-mono);font-size:11px;color:var(--acc);white-space:nowrap}
.site:hover{background:var(--acc);color:#1a1208}
.ptag{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:10px;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
.hud{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;backdrop-filter:blur(3px)}
#clock{left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#clock .t{font-family:var(--f-mono);font-size:15px;font-weight:600}#clock .w{color:var(--mut);font-size:12.5px}
#clock .sp{margin-top:6px;display:flex;gap:4px}#clock .sp button{padding:2px 8px;font-family:var(--f-mono);font-size:11px}

#res{right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto auto;gap:2px 14px;font-family:var(--f-mono);font-size:12px;min-width:190px}
#res .k{color:var(--mut)}#res .v{text-align:right}
#bar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100vw - 24px));padding:8px}
#ticker{font-size:13px;line-height:1.35;max-height:96px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:6px;padding:0 4px}
#ticker div{opacity:.95}#ticker .talk{color:#d8cfb8;font-style:italic}#ticker div.old{opacity:.55}
#cmdrow{display:flex;gap:6px}#cmd{flex:1}
#tools{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}

#tools .k{color:var(--dim);margin-left:4px}
#hint{font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-top:5px;padding:0 4px}
#side{position:absolute;right:12px;top:150px;bottom:150px;width:min(372px,calc(100vw - 24px));overflow:auto;display:none}
#side.open{display:block}

#side h3{font-size:13px;font-family:var(--f-mono);color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:var(--mut)}
.row{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:5px 0;cursor:pointer}
.row:hover{border-color:var(--line2)}
.row .n{font-weight:600}.row .s{font-size:12.5px;color:var(--mut)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}.meter i{display:block;height:100%;background:var(--good)}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:10px;padding:1px 8px;font-size:11.5px;margin:2px 3px 2px 0;font-family:var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#menu{position:absolute;display:none;min-width:200px;padding:6px}
#menu .h{font-weight:600;padding:2px 6px 6px}#menu .h small{display:block;font-weight:400;color:var(--mut);font-size:12px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:4px}
#menu button:hover{background:var(--bg2)}
#modal{position:absolute;inset:0;background:rgba(5,6,7,.55);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:18px 20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.card p{margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px}
.opt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.opt.pri small,button.pri small{color:#4a3415}
.why{font-size:13px;margin:4px 0 0 0;padding-left:16px}.why li{margin:1px 0}
.why .p{color:var(--good)}.why .m{color:var(--bad)}
#talk{left:12px;bottom:12px;width:min(340px,calc(100vw - 24px));display:none;max-height:50vh;flex-direction:column}
#talk.open{display:flex}
#talk .log{overflow:auto;flex:1;margin:6px 0;font-size:13.5px}
#talk .log div{margin:4px 0}#talk .log .me{color:var(--acc)}#talk .log .sys{color:var(--mut);font-style:italic;font-size:12.5px}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,23,26,.6),rgba(10,11,12,.95));padding:16px}
#title h1{font-family:var(--f-title);font-weight:400;font-size:clamp(40px,8vw,72px);margin:0;color:var(--acc);letter-spacing:.03em;line-height:1}
#title .sub{color:var(--mut);margin:6px 0 18px}
#title .card{width:min(520px,100%)}
#title label{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button.on{border-color:var(--acc);color:var(--acc)}
#build{position:absolute;inset:0;background:rgba(5,6,7,.6);display:none;align-items:center;justify-content:center;padding:16px}
#build.open{display:flex}
#build .card{width:min(620px,100%)}
#bsvg{width:100%;height:auto;background:#3d4a2f;border-radius:8px;touch-action:none;user-select:none;display:block}
#bstep{font-size:14px;margin:8px 0 4px}#bprog{font-family:var(--f-mono);font-size:11.5px;color:var(--mut)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);border-radius:7px;padding:7px 14px;display:none;max-width:80vw;text-align:center}
#place{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:none;text-align:center}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 100%);opacity:.4;transition:opacity 1.2s,background .4s}
#vig.red{background:radial-gradient(ellipse at center,rgba(90,0,0,0) 38%,rgba(120,8,4,.75) 100%);transition:opacity .2s}
#menu .sep{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;padding:7px 8px 2px;border-top:1px solid var(--line);margin-top:4px}
#menu .sep:empty{padding:0;margin:4px 0}
.task{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-size:11px;color:var(--acc)}
.tag small{display:block;font-size:9.5px;color:#d8d0c0;text-align:center;opacity:.9}
button.off{opacity:.55}
#grab{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,4,2,.35)}
#grab.open{display:flex;animation:grabin .18s ease-out}
#grab .card{border-color:#a8382a;box-shadow:0 0 40px rgba(160,20,10,.45)}
#grab h2{color:#ff7a5a}
.gm{height:12px;background:#2a1210;border:1px solid #6a2a20;border-radius:6px;overflow:hidden;margin:10px 0}.gm i{display:block;height:100%;background:linear-gradient(90deg,#c8402a,#e8a050);transition:width .08s}
@keyframes grabin{from{transform:scale(1.04);opacity:0}to{transform:none;opacity:1}}
/* meeting someone: letterbox bars, the camera in close, and a caption you click through */
#scene{position:absolute;inset:0;pointer-events:none;display:none}
#scene.open{display:block}
#scene .lb{position:absolute;left:0;right:0;height:11vh;background:#050607;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#scene .top{top:0;transform:translateY(-100%)}#scene .bot{bottom:0;transform:translateY(100%)}
#scene.in .top,#scene.in .bot{transform:none}
#scene .cap{position:absolute;left:50%;bottom:calc(11vh + 14px);transform:translateX(-50%) translateY(8px);width:min(660px,calc(100vw - 24px));pointer-events:auto;cursor:pointer;background:rgba(12,14,16,.92);border:1px solid var(--line2);border-radius:10px;padding:13px 18px 10px;opacity:0;transition:opacity .45s,transform .45s;max-height:calc(78vh - 28px);overflow:auto}
#scene.in .cap{opacity:1;transform:translateX(-50%)}
#scene .who{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);min-height:15px}
#scene .who.nar{color:var(--dim)}
#scene .line{font-size:16.5px;line-height:1.5;min-height:25px;margin-top:3px}
#scene .line.nar{font-style:italic;color:#cbc3b3}
#scene .ch{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;margin-top:8px}
#scene .ch:empty{display:none}
#scene .ch button{text-align:left;padding:6px 10px;background:rgba(28,32,36,.9);font-size:13.5px;line-height:1.3}
#scene .ch button small{display:block;color:var(--mut);font-size:11.5px;margin:1px 0 0 22px}
#scene .ch .k{display:inline-block;width:22px;font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
#scene .ch .sep{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 0;padding-top:7px;border-top:1px solid var(--line)}
#scene .hint{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);text-align:right;margin-top:4px;min-height:13px}
@media (max-width:560px){#scene .ch{grid-template-columns:1fr}}
#app.scening #bar,#app.scening #clock,#app.scening #res,#app.scening #side,#app.scening #talk,#app.scening #menu,#app.scening #place{display:none!important}
@media (max-width:700px){#res{top:auto;bottom:auto;top:96px;left:12px;right:auto;grid-template-columns:auto auto auto auto;min-width:0}#side{top:150px;bottom:170px}#clock{right:12px}}
</style>
<div id="app">
<canvas id="gl"></canvas>

  <div id="ticker"></div>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ================= helpers =================
const rf=Math.random;const ri=(a,b)=>a+Math.floor(rf()*(b-a+1));const pick=a=>a[Math.floor(rf()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;const dist=(ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);const lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rf()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
const listAnd=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
const HOUR=60,DAY=1440;
// how fast the clock runs at 1×: game minutes per real second. One second is a minute, so a minute of play is an hour in camp.
const CLOCK=1;
const dayOf=t=>Math.floor(t/DAY)+1;const hourOf=t=>Math.floor((t%DAY)/60);
function clockStr(t){const h=hourOf(t),m=Math.floor(t%60);const hh=h%12||12;return`${hh}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`}

// ================= people =================
const FNAME={F:["Ruth","Maria","Dana","Keisha","Tara","Lena","Joanne","Brooke","Alicia","Megan","Rosa","Carol","Hannah","Nina","Gail","Priya","Sheila","Amber","Lucy","Denise","Tess","Ivy","Wren","June"],
  M:["Jake","Marcus","Owen","Dale","Hector","Ray","Tom","Luis","Caleb","Andre","Gene","Wes","Darnell","Pete","Sam","Eli","Victor","Hank","Trevor","Felix","Gus","Nate","Abe","Cody"]};
const KNAME={F:["Lily","Ava","Mia","Rosie","Emma","Zoe","Kayla","Nora"],M:["Ben","Noah","Leo","Tyler","Max","Danny","Milo","Jonah"]};
const SURN=["Harlan","Okafor","Reyes","Pruitt","Whitlock","Castillo","Brennan","Yazzie","Kowalski","Dunn","Moreau","Tran","Abbott","Holm","Vance","Delgado","Fisher","Keane","Lund","Mercer","Odom","Sato","Booker","Quill"];
const JOBS_BEFORE={farmer:{n:"farmer",sk:{farm:3,build:1}},nurse:{n:"nurse",sk:{med:3,cook:1}},mechanic:{n:"mechanic",sk:{build:2,scav:2}},teacher:{n:"teacher",sk:{med:1,cook:1}},
  deputy:{n:"sheriff's deputy",sk:{fight:3,scav:1}},cook:{n:"line cook",sk:{cook:3,farm:1}},carpenter:{n:"carpenter",sk:{build:3}},trucker:{n:"trucker",sk:{scav:2,fight:1}},
  vet:{n:"veterinarian",sk:{med:2,farm:1}},soldier:{n:"army vet",sk:{fight:3,build:1}},clerk:{n:"store clerk",sk:{scav:2,cook:1}},rancher:{n:"rancher",sk:{farm:2,fight:1}},
  pastor:{n:"pastor",sk:{med:1}},student:{n:"college student",sk:{scav:1}},hunter:{n:"hunting guide",sk:{fight:2,scav:1,farm:1}},retiree:{n:"retired machinist",sk:{build:2}}};
const SKILLS={farm:"Farming",build:"Building",fight:"Fighting",scav:"Scavenging",med:"Medicine",cook:"Cooking"};
// personality axes run from -1 to 1
const TRAITS={brave:["brave","timid"],loyal:["loyal","independent"],kind:["kind","selfish"],diligent:["hardworking","lazy"],social:["chatty","quiet"],temper:["hotheaded","even-tempered"],faith:["devout","skeptical"]};
const MOTIVES={family:"keeping their family safe",safety:"staying alive, whatever it takes",belonging:"being part of something again",purpose:"being useful",revenge:"making the dead pay for what they took",faith:"doing right by God",freedom:"never being told what to do"};
const QUIRKS=["hums old country songs while they work","counts things when they're nervous","won't eat anything green","keeps a dead phone charged out of habit","tells terrible jokes on purpose","sleeps with their boots on","talks to the chickens","keeps a list of everyone they've lost","whittles when they can't sleep","has an opinion about every kind of knot","swears in Spanish when they hit their thumb","reads the same paperback over and over"];
const HOPES=["a hot shower","seeing the ocean someday","finding their brother in Denver","a real bed","the radio coming back on","a garden that's just for flowers","teaching kids again","a cold beer","one quiet night"];
const FEARS=["the dark","being alone","fire","being the one who turns","the kids getting hurt","running out of insulin","crowds","deep water"];
const LOOK={skin:["#f0d2b4","#e3bd98","#c99873","#a8744e","#8a5a3a","#5e3e2a"],hair:["#1d1a18","#4a3020","#c9a85a","#8a3a1f","#9a9a96"],
  top:["#56636c","#6c5a4a","#4f5b48","#7a6a58","#6e4f4f","#3f4a52","#8a6e52","#5a4f6a","#3d5a50","#7a3a32","#2f3e58","#a89a7a"],pants:["#3a4a6a","#2f3b52","#8a7a5a","#2a2a2e","#5a5e62","#4a4038"]};

// ================= the land: a world map of places, each its own scene =================
// mx/mz place it on the world map (in miles-ish units); each place loads as its own isometric scene when you go there.
// pop is how many people were there when it started: the dead there come from them.
// kind picks the scene's layout; beds/farm/water/def/wood/hide only matter if you make camp there; danger sets how many of the dead are around
const LOCS={
  start:{n:"Route 9 pileup",mx:0,mz:8,kind:"road",danger:1,pop:5,camp:false,d:"Where you started: a stalled line of cars on the highway."},
  farm:{n:"Harlan Farm",mx:-46,mz:-34,kind:"farm",pop:2,beds:4,farm:1.5,water:1.2,def:.8,wood:1,hide:1,danger:1,d:"A farmhouse, a barn and open fields. Good soil and a hand-pumped well, but you can see it for miles."},
  mill:{n:"Cutter's Mill",mx:-48,mz:27,kind:"mill",pop:1,beds:3,farm:1.1,water:1.6,def:1.1,wood:1.1,hide:1,danger:1,d:"An old stone mill on the river. Water all year and thick walls, a long walk from town."},
  church:{n:"St. Agnes Church",mx:22,mz:-16,kind:"church",pop:7,beds:6,farm:.7,water:.9,def:1.3,wood:.8,hide:.8,danger:2,d:"A brick church with a fenced yard on the edge of Millbrook. Close to the stores, and close to the dead."},
  scout:{n:"Pine Ridge Camp",mx:54,mz:46,kind:"scout",pop:2,beds:6,farm:.6,water:1.1,def:.9,wood:1.6,hide:1.4,danger:1,d:"A scout camp deep in the pines, with cabins by a lake. Hidden and quiet, but poor ground for crops."},
  motel:{n:"Starlite Motel",mx:-14,mz:16,kind:"motel",pop:7,beds:8,farm:.7,water:.8,def:.7,wood:.9,hide:.7,danger:2,d:"A row of rooms right off the highway. Plenty of beds, and easy to find for anyone."},
  grocery:{n:"Grocery",mx:38,mz:-48,kind:"store",pop:9,beds:2,farm:.3,water:.8,def:.9,wood:.6,hide:.6,danger:3,col:"#8a7a5a",d:"Millbrook's grocery. Picked over, but nobody got into the stockroom."},
  pharmacy:{n:"Pharmacy",mx:52,mz:-46,kind:"store",pop:6,beds:1,farm:.3,water:.7,def:.8,wood:.6,hide:.6,danger:3,col:"#6a7a8a",d:"The corner pharmacy. Medicine, if the dead haven't got it."},
  hardware:{n:"Hardware Store",mx:40,mz:-34,kind:"store",pop:5,beds:2,farm:.3,water:.7,def:1,wood:.8,hide:.6,danger:2,col:"#8a5a3a",d:"Tools, nails, rope, tarps. Everything you need to build."},
  police:{n:"Police Station",mx:58,mz:-33,kind:"police",pop:8,beds:3,farm:.3,water:.8,def:1.6,wood:.6,hide:.6,danger:4,d:"Brick walls and a locked armory, overrun the first night."},

// ================= a new game =================

// ================= the camp =================

    if(GUNS[k])log(`${p.name} puts ${pronoun(p,"p")} ${ITEMS[k]} in with the camp's things${p.carry.ammo?`, with ${p.carry.ammo} rounds`:""}.${S.player.gun?"":" You could carry it yourself (Stores, I)."}`)}p.carry=null}
function addBld(type,x,z,o){o=o||{};const B=BUILDS[type];const b={id:nid("b"),type,loc:o.loc||S.player.loc,x,z,rot:o.rot||0,done:!!o.done,prog:o.done?B.hrs:0,opt:o.opt||{},name:o.name||B.n,grow:0,hp:100};
  S.blds.push(b);S.bv++;if(typeof onBld==="function")onBld(b);return b}
function campBlds(){return S.camp?S.blds.filter(b=>b.loc===S.camp.site):[]}

function bedsTotal(){if(!S.camp)return 0;return(SITES[S.camp.site].beds||0)+campBlds().filter(b=>b.done).reduce((a,b)=>a+(BUILDS[b.type].beds||0),0)}

function defense(){if(!S.camp)return 0;const s=SITES[S.camp.site];const g=here().filter(p=>p.job==="guard"&&!p.kid);

// ================= time =================
const MOVE=3.6/CLOCK;// units per game minute, walking: about 3.6 a second at 1×

function footSpeed(o){if(!LOCS[o.loc])return 1;const g=grid(o.loc).a[gc(o.z)*GN+gc(o.x)];o.climb=g===2;return g===2?.35:1}

// ================= the dead =================
function spawnWalker(loc,x,z){if(x==null){const E=SH-1;for(let i=0;i<12;i++){const e=rf()*4|0;const t=rf()*2-1;[x,z]=[[t*E,-E],[E,t*E],[t*E,E],[-E,t*E]][e];

  const w={id:nid("w"),loc,x,z,tx:null,tz:null,path:null,cool:0,look:{skin:pick(["#8a9a7a","#9aa08a","#7a8a6a","#a0a890"]),top:pick(LOOK.top),pants:pick(LOOK.pants)}};S.walkers.push(w);return w}

// ================= the hour =================

function jobSpot(p){const c=S.camp;const j=p.job;const B=t=>bldDone(t);

// ================= camp stores: one shared block grid =================
// The grid is what everyone in camp shares. Counts live in S.res (food, water, wood...), S.items (loose things) and S.crafted;
// syncInv() keeps a block for every stack, keeps blocks where the player put them, and caps what doesn't fit.
// grid model adapted from the old game's block inventory
function iSize(k){if(k.startsWith("c:")){const c=S.crafted.find(c=>c.id===k.slice(2));return c?[c.size[0],c.size[1],1]:[1,1,1]}return ISZ[k]||[1,1,1]}
function gsz(o){const s=iSize(o.k);return o.r?[s[1],s[0]]:[s[0],s[1]]}
function cFits(c,w,h,x,y,skip){if(x<0||y<0||x+w>c.g[0]||y+h>c.g[1])return false;for(const o of c.items){if(o===skip)continue;const [ow,oh]=gsz(o);if(x<o.x+ow&&x+w>o.x&&y<o.y+oh&&y+h>o.y)return false}return true}
function cFind(c,k,skip){const s=iSize(k);const opts=s[0]===s[1]?[0]:[0,1];for(const r of opts){const w=r?s[1]:s[0],h=r?s[0]:s[1];for(let y=0;y+h<=c.g[1];y++)for(let x=0;x+w<=c.g[0];x++)if(cFits(c,w,h,x,y,skip))return{x,y,r}}return null}
function invGrid(){const rows=6+bldDone("shed").length*4;if(!S.inv)S.inv={g:[10,rows],items:[],u:1};S.inv.g[1]=rows;return S.inv}
// put n of something into a grid: top up stacks first, then new blocks. Returns how many didn't fit.
function gAdd(c,k,n){const st=iSize(k)[2];for(const o of c.items){if(o.k!==k||n<=0)continue;const room=st-o.n;if(room>0){const d=Math.min(room,n);o.n+=d;n-=d}}
  while(n>0){const p=cFind(c,k);if(!p)break;c.items.push({u:c.u=(c.u||1)+1,k,n:Math.min(st,n),x:p.x,y:p.y,r:p.r});n-=Math.min(st,n)}return n}
function gCount(c,k){return c.items.filter(o=>o.k===k).reduce((a,o)=>a+o.n,0)}
// move one block from one grid to another, at a spot or wherever it fits; stacks merge
function gMove(from,to,o,x,y,r){if(x!=null){const [w,h]=r?[iSize(o.k)[1],iSize(o.k)[0]]:[iSize(o.k)[0],iSize(o.k)[1]];
    const tgt=to.items.find(q=>q!==o&&q.k===o.k&&x>=q.x&&y>=q.y&&x<q.x+gsz(q)[0]&&y<q.y+gsz(q)[1]);
    if(tgt){const room=iSize(o.k)[2]-tgt.n;const d=Math.min(room,o.n);if(d<=0)return false;tgt.n+=d;o.n-=d;if(o.n<=0)from.items.splice(from.items.indexOf(o),1);return true}
    if(!cFits(to,w,h,x,y,from===to?o:null))return false;if(from!==to){from.items.splice(from.items.indexOf(o),1);to.items.push(o)}o.x=x;o.y=y;o.r=r?1:0;return true}
  if(from===to)return false;const left=gAdd(to,o.k,o.n);if(left===o.n)return false;o.n=left;if(o.n<=0)from.items.splice(from.items.indexOf(o),1);return true}
// what you and whoever's with you can carry home
function haulRows(){return 3+withYou().filter(p=>!p.kid).length*3+withYou().filter(p=>p.kid).length}
function haul(){const h=S.haul;const rows=Math.max(haulRows(),...h.items.map(o=>o.y+gsz(o)[1]));h.g[1]=rows;return h}
function unloadHaul(){const h=S.haul;if(!h.items.length)return;const got={};for(const o of h.items){const key=RES[o.k]?o.k:"i:"+o.k;got[key]=(got[key]||0)+o.n}h.items=[];addLoot(got);log(`You unload what you carried: ${lootWords(got)}.`,"good")}
function kindOf(k){return k.startsWith("c:")?"crafted":RES[k]?(k==="meds"?"meds":k):CONDS_ITEM[k]?"personal":"item"}
const CONDS_ITEM={};for(const c of Object.values(CONDS))CONDS_ITEM[c.item]=true;
function shortName(k){if(k.startsWith("c:"))return invNameOf(k);return RES[k]==="Medicine"?"Meds":RES[k]||({epipen:"EpiPen",heartpills:"Heart pills",insulin:"Insulin",fishhook:"Hooks",alcohol:"Vodka",bulb:"Flashlight",battery:"Battery",boards:"Boards",line:"Fish line"})[k]||cap1(k)}
function invNameOf(k,n){if(k.startsWith("c:")){const c=S.crafted.find(c=>c.id===k.slice(2));return c?c.n:"something"}return RES[k]||ITEMS[k]||k}
// make the blocks match the counts
function syncInv(){const c=invGrid();const full=[];
  // a block that no longer fits after a storehouse burned goes back to the pile and is re-placed
  for(const o of [...c.items]){const [w,h]=gsz(o);if(o.y+h>c.g[1]){c.items.splice(c.items.indexOf(o),1);o.lost=true}}
  const want=[];for(const cr of S.crafted)want.push(["c:"+cr.id,1,cr.owner]);
  for(const [k,n] of Object.entries(S.items))if(n>0)want.push([k,n]);
  for(const k of Object.keys(RES))want.push([k,Math.floor(S.res[k]+1e-6)]);
  const seen=new Set();
  for(const [k,n] of want){seen.add(k);const st=iSize(k)[2];let have=c.items.filter(o=>o.k===k);let tot=have.reduce((a,o)=>a+o.n,0);
    if(tot>n){let cut=tot-n;for(const o of [...have].reverse()){if(cut<=0)break;const d=Math.min(o.n,cut);o.n-=d;cut-=d;if(o.n<=0)c.items.splice(c.items.indexOf(o),1)}}
    else if(tot<n){let add=n-tot;for(const o of have){const room=st-o.n;if(room>0&&add>0){const d=Math.min(room,add);o.n+=d;add-=d}}
      while(add>0){const p=cFind(c,k);if(!p)break;const o={u:c.u++,k,n:Math.min(st,add),x:p.x,y:p.y,r:p.r};c.items.push(o);add-=o.n}
      if(add>0){full.push(k);if(RES[k])S.res[k]-=add;else if(k.startsWith("c:")){}else S.items[k]=Math.max(0,(S.items[k]||0)-add)}}}
  c.items=c.items.filter(o=>seen.has(o.k));

  for(const o of c.items){if(CONDS_ITEM[o.k]&&!o.owner){const who=members().find(p=>p.cond&&CONDS[p.cond].item===o.k);if(who)o.owner=who.id}if(o.owner&&!(P(o.owner)?.status==="member"))o.owner=null}
  if(full.length&&S.t-(S.flags.fullMsg||-1e9)>DAY/2){S.flags.fullMsg=S.t;log(`Camp storage is full. ${listAnd([...new Set(full)].map(k=>invNameOf(k).toLowerCase()))} had nowhere to go${bldDone("shed").length?"":". A storehouse would help"}.`,"warn")}
  return c}
function invFree(){const c=invGrid();let used=0;for(const o of c.items){const [w,h]=gsz(o);used+=w*h}return c.g[0]*c.g[1]-used}
function itemCount(k){return S.items[k]||0}

function ownerOf(k){const o=(S.inv?.items||[]).find(o=>o.k===k&&o.owner);if(o)return P(o.owner);if(CONDS_ITEM[k])return members().find(p=>p.cond&&CONDS[p.cond].item===k)||null;return null}

// ================= people help themselves =================
function useHour(h){if(!S.camp)return;const ppl=here();
  // tools and weapons get picked up by whoever's job uses them, and put back at night
  if(h===7){for(const o of S.inv?.items||[])o.by=null;for(const p of ppl)p.gun=null;
    const want={tool:["build","farm","wood"],weapon:["guard","scav"],light:["guard"],water:["water"]};
    // guns go out first, the best first, and the guards get first pick of them
    const gr=o=>GUNS[o.k]?1+(GUN_RANK[o.k]||0):0;const items=[...(S.inv?.items||[])].sort((a,b)=>gr(b)-gr(a));const order=[...ppl].sort((a,b)=>(b.job==="guard")-(a.job==="guard"));
    for(const o of items){const u=o.k.startsWith("c:")?S.crafted.find(c=>"c:"+c.id===o.k)?.use:ITEM_USE[o.k];if(!u||!want[u])continue;
      const p=order.find(p=>want[u].includes(p.job)&&!S.inv.items.some(q=>q.by===p.id)&&(!o.owner||o.owner===p.id||p.tr.kind<-.35));if(p){o.by=p.id;if(GUNS[o.k])p.gun=o.k;if(rf()<.3)stores(`${p.name} took the ${invNameOf(o.k).toLowerCase()} for ${JOBS[p.job].v}.`)}}}
  if(h===22){for(const o of S.inv?.items||[])o.by=null;for(const p of ppl)p.gun=null}
  for(const p of ppl){if(p.sleep||p.kid&&rf()<.5)continue;const T=p.tr;
    // a rough day: a drink, if there's one
    if(p.mood<30&&itemCount("alcohol")>0&&rf()<.06*(1-T.faith*.5)&&!protectedFor("alcohol",p)){takeItem("alcohol",1);p.mood+=12;stores(`${p.name} drank the ${ITEMS.alcohol}.`);if(rf()<.5)log(`${p.name} finished off a bottle of vodka by the fire.`)}
    // hurt with nobody tending them: they patch themselves up with what's there
    if(p.hp<45&&!lead("medic")&&S.res.meds>=1&&rf()<.15){const last=S.res.meds<2&&members().some(q=>q!==p&&q.sick);if(!last||T.kind<-.35){S.res.meds--;p.hp+=15;stores(`${p.name} used some medicine on ${pronoun(p,"p")} own wounds.`)}}
    // someone selfish helps themself to what another person needs to live
    if(T.kind<-.35&&rf()<.02*(-T.kind)*(p.mood<40||p.hp<60||S.rival?1.6:1)){
      const tgt=Object.keys(SELFISH_USE).find(k=>itemCount(k)>0&&protectedFor(k,p)&&(k!=="insulin"||S.rival&&!S.rival.gone));
      if(tgt){const owner=protectedFor(tgt,p);takeItem(tgt,1);S.flags.missing=S.flags.missing||{};S.flags.missing[tgt]={by:p.id,from:owner.id,t:S.t};stores(`Someone took ${owner.name}'s ${ITEMS[tgt]}.`,"bad");
        mem(p,`I took ${owner.name}'s ${ITEMS[tgt]} ${SELFISH_USE[tgt]}. Nobody needs to know.`,-1);
        const saw=ppl.find(q=>q!==p&&!q.sleep&&dist(q.x,q.z,p.x,p.z)<8&&rf()<.45);
        if(saw){S.flags.missing[tgt].seen=saw.id;log(`${saw.name} saw ${p.name} pocket ${owner.name}'s ${ITEMS[tgt]}.`,"bad");queueCard("theft",{who:p.id,owner:owner.id,item:tgt,saw:saw.id})}}}}}
// medicine people need to stay alive, every morning
function needsDawn(){for(const p of members()){if(!p.cond)continue;const C=CONDS[p.cond];if(C.emergency)continue;p.medDays=(p.medDays||0)+1;if(p.medDays<C.every)continue;

// ================= crafting, in your own words =================
function craftList(){return Object.entries(S.items).filter(([k,n])=>n>0).map(([k,n])=>`${ITEMS[k]} ×${n}${ownerOf(k)?` (${ownerOf(k).name}'s, needed to stay alive)`:""}`)}
function recipeCraft(text){const t=text.toLowerCase();
  for(const [re,why] of NOPE)if(re.test(t))return{ok:false,reason:why};
  for(const r of RECIPES){if(!r.w.every(re=>re.test(t)))continue;const miss=Object.entries(r.need).filter(([k,n])=>itemCount(k)<n);
    if(miss.length)return{ok:false,reason:`You'd need ${listAnd(miss.map(([k,n])=>`${n} × ${ITEMS[k]}`))}, and the camp doesn't have enough.`};
    return{ok:true,uses:r.need,makes:{name:r.make,use:r.use,v:r.v,size:[1,r.v>1?2:1]},hours:1,say:r.say}}
  return{ok:false,reason:"You turn it over in your hands, but you can't work out how to make that from what's here.",hint:true}}
function applyCraft(res){if(!res||!res.ok)return null;const harm=[];
  for(const [k,n] of Object.entries(res.uses||{})){if(RES[k])S.res[k]=Math.max(0,S.res[k]-n);else{const o=protectedFor(k,null);if(o)harm.push(o);takeItem(k,n)}}
  const m=res.makes;const id=String(S.nid++);S.crafted.push({id,n:String(m.name).slice(0,40),use:USES[m.use]?m.use:"none",v:clamp(Math.round(m.v||1),1,3),size:[clamp(m.size?.[0]||1,1,3),clamp(m.size?.[1]||1,1,3)],d:S.t});
  for(const o of harm){o.trust-=15;o.mood-=10;mem(o,`${S.player.name} used my medicine to make something.`,-6)}
  syncInv();step(Math.min(4,res.hours||1)*HOUR);stores(`You made ${m.name.toLowerCase()}.`);return{harm}}
function craftedIn(useKey){return S.crafted.filter(c=>c.use===useKey)}
// ================= what people decide when you ask something of them =================
// Every ask is weighed against who they are: trust in you, their nature, their motive and their family.
// The reasons come back with the answer, so you can see why someone said no.

function danger(k){const L=LOCS[k];if(!L)return 1;let d=dangerAt(k);if(S.rival&&!S.rival.gone&&S.rival.site===k)d+=3;return d}
function weigh(p,kind,ctx){ctx=ctx||{};const R=[];const add=(v,t)=>{if(Math.abs(v)>=.15)R.push({v:Math.round(v*10)/10,t})};const T=p.tr;

  if(kind==="join"){add(1.6,"Wants somewhere safe");if(fam.length)add(.6,`Needs a roof for ${listAnd(fam.slice(0,2).map(q=>q.name))}`);add(trust*.6,trust>0?"Likes the look of you":"Doesn't know you");
    if(p.motive==="freedom")add(-1,"Doesn't like being told what to do");if(T.social<-.5)add(-.5,"Doesn't trust crowds");}
  else if(kind==="job"){const j=JOBS[ctx.job];const sk=p.sk[j.sk];
    if(p.kid&&!["farm","water","cook"].includes(ctx.job))return{yes:false,reasons:[{v:-9,t:`${p.name} is ${p.age}. That's not a job for a kid`}],score:-9};
    add(1,"You run this camp, and somebody has to");add(trust*.6,trust>0?"Trusts you":"Doesn't trust you yet");add(sk*.45,sk>=2?`Good at ${j.n.toLowerCase()}`:sk>=1?`Knows a little about ${j.n.toLowerCase()}`:"");if(sk===0)add(-.25,`Has never done ${j.n.toLowerCase()}`);

function face(t){const pl=pl_();pl.dir=Math.atan2(t.x-pl.x,t.z-pl.z);if(t.id&&t.id!=="you"&&t.x!=null)t.dir=Math.atan2(pl.x-t.x,pl.z-t.z)}
function here_(p){if(!p)return false;if(p.loc!==pl_().loc||p.away&&p.away.out){toast(`${p.name} isn't here.`);return false}return true}

// ---------- talking ----------
async function speak(p,text){if(!here_(p))return;approach(p,async()=>{const pl=pl_();say(pl,text);p.chat.push({w:"you",x:text});p.lastTalk=S.t;
    const cmd=orderIn(text,p);if(cmd){await cmd();return}
    const r=chatReply(p,text);p.busyTalk=true;let out=null;
    if(aiReady()){thinking(p);out=await aiTalk(p,text,"",false,s=>sayLive(p,s))}
    p.busyTalk=false;const line=out?.say||r.line;let dt=r.dt;if(out){dt=dt*.4+out.feel*1.6;if(out.note)mem(p,out.note,Math.round(out.feel))}
    p.trust=clamp(p.trust+talkGain(p,dt),0,100);p.chat.push({w:"them",x:line});say(p,line,true);if(typeof renderTalk==="function")renderTalk();save()})}
// small talk only moves someone so far in a day
function talkGain(p,v){const d=dayOf(S.t);if(!p.tg||p.tg.d!==d)p.tg={d,n:0};if(v<=0)return v;const left=Math.max(0,8-p.tg.n);const g=Math.min(v,left)+Math.max(0,v-left)*.2;p.tg.n+=g;return g}
// an order inside something you say to one person ("come with me", "can you farm?")
function orderIn(text,p){const t=text.toLowerCase();
  if(/come with me|follow me|tag along|you're with me|let's go/.test(t))return()=>ask(p,"come",{to:null});
  if(/stay (here|put|behind)|wait here|stop following|go back to camp|head home/.test(t))return()=>ask(p,"stay");
  if(p.status==="stranger"&&/join|come in|stay with us|welcome|you can stay|let you in/.test(t))return()=>invite(p);
  if(/(fight|war|attack).*(pruitt|them|boyd)|go to war/.test(t))return()=>rally();
  if(p.status==="member"&&!JOBBY.test(t)){const tk=taskIn(orderCore(t,[p]));if(tk&&tk.k!=="perim")return()=>{runOrder(tk,[p],null,orderCore(t,[p]))}}
  const lead=/in charge|run the|manage|lead the|head of/.test(t);for(const [j,re] of Object.entries(JWORDS))if(re.test(t)&&/(can you|could you|will you|i need you|you're on|take|work|start|handle|help with|do the|be our|on (the )?\w+ duty)/.test(t))return()=>ask(p,lead?"lead":"job",{job:j});
  return null}
function thinking(p){say(p,"...",false,true)}

// ---------- asking things of people ----------
async function ask(p,kind,ctx){ctx=ctx||{};if(!here_(p))return;
  if((kind==="job"||kind==="lead")&&p.status!=="member"){say(p,"I don't even live here.");return}
  const r=weigh(p,kind,ctx);let gist=answerLine(p,kind,r,ctx);
  if(r.yes)applyOrder(p,kind,ctx);
  p.lastTalk=S.t;showWhy(p,kind,r,ctx);
  let line=gist;if(aiReady()){thinking(p);const out=await aiTalk(p,orderWords(kind,ctx),gist,true,s=>sayLive(p,s));if(out){line=out.say;if(out.note)mem(p,out.note,0)}}
  p.chat.push({w:"them",x:line});say(p,line,true);if(typeof renderTalk==="function")renderTalk();save();return r}
function orderWords(kind,ctx){return{come:"Come with me.",war:"I need you to fight the Pruitts with me.",job:`I need you on ${JOBS[ctx.job||"farm"].n.toLowerCase()}.`,lead:`I want you in charge of ${JOBS[ctx.job||"farm"].lead}.`,stay:"Stay here.",join:"You can join us.",leave:"You need to leave camp."}[kind]||"Will you?"}
function applyOrder(p,kind,ctx){
  if(kind==="job"){p.job=ctx.job==="none"?null:ctx.job;p.wp=null;p.chose=false;if(p.leads&&p.leads!==p.job)p.leads=null;log(`${p.name} is on ${p.job?JOBS[p.job].n.toLowerCase():"nothing in particular"} now.`);if(S.camp&&atCamp(p))planHour(p,hourOf(S.t))}
  if(kind==="lead"){for(const q of members())if(q.leads===ctx.job)q.leads=null;p.leads=ctx.job;p.job=ctx.job;log(`${p.name} is in charge of ${JOBS[ctx.job].lead} now. Small problems there go to ${pronoun(p,"o")} first.`,"good");mem(p,`${S.player.name} put me in charge of ${JOBS[ctx.job].lead}.`,4);p.trust=Math.min(100,p.trust+4)}

  if(kind==="stay"){p.follow=false;p.act=p.loc===campK()?"back at camp":"waiting here";if(p.loc!==campK()){p.away={kind:"wait",at:p.loc}}}
  if(kind==="leave"){p.status="left";p.follow=false;moveTo(p,ENTRY.x,ENTRY.z+4);log(`${p.name} packs a bag and walks out of camp.`,"warn");for(const q of famOf(p))if(q.status==="member"){q.trust-=20;q.mood-=20}}}

  if(typeof whyPanel==="function")whyPanel(p,head,r);log(head+(r.reasons[0]?` (${r.reasons.slice(0,2).map(x=>x.t.toLowerCase()).join("; ")})`:""),r.yes?"":"warn")}
async function askMany(L,kind,ctx){for(const p of L){await ask(p,kind,ctx);await new Promise(r=>setTimeout(r,250))}}
function invite(p){if(!p||p.status!=="stranger")return;approach(p,async()=>{say(pl_(),pick(["You can stay with us.","Come on in. We'll find you a spot.","Welcome to camp."]));
    const r=weigh(p,"join");if(!r.yes){showWhy(p,"join",r,{});say(p,"I... no. We'll manage on our own.",true);p.status="left";moveTo(p,ENTRY.x,ENTRY.z+4);return}
    const g=admit(p);if(!S.camp)for(const q of g)q.follow=true;say(p,answerLine(p,"join",r),true);if(typeof renderAll==="function")renderAll()})}

// ---------- the war ----------
function rally(){if(!S.rival||S.rival.gone){toast("There's nobody to fight. Not yet.");return}
  const L=members().filter(p=>!p.kid&&(atCamp(p)&&pl_().loc===campK()||p.loc===pl_().loc));if(!L.length){toast("There's nobody here to ask.");return}
  const out=L.map(p=>({p,r:weigh(p,"war")}));for(const o of out){o.p.lastTalk=S.t;if(o.r.yes){o.p.follow=true;o.p.away=null}}
  if(typeof warCard==="function")warCard(out)}
function battle(){const R=S.rival;const pl=pl_();const party=withYou().filter(p=>!p.kid);let us=2+party.reduce((a,p)=>a+1.5+p.sk.fight*.8,0)+Math.min(4,S.res.ammo/6)+useVal("weapon")*.4+(pl.gun&&pl.rounds>0?1.5:0);const them=rivalStr();
  if(pl.gun)pl.rounds=Math.max(0,(pl.rounds||0)-ri(3,8));
  if(S.res.ammo>0)S.res.ammo=Math.max(0,S.res.ammo-party.length*2);
  const roll=us*(.75+rf()*.5)-them*(.75+rf()*.5);const beats=[];const foes=S.people.filter(p=>p.status==="rival");const hurtUs=[];
  beats.push(`You come at ${LOCS[R.site].n} ${hourOf(S.t)>=20||hourOf(S.t)<5?"in the dark":"in broad daylight"}, ${party.length?listAnd(party.map(p=>p.name))+" beside you":"alone"}.`);
  for(const p of party){if(rf()<.35+(roll<0?.25:0)){const dmg=ri(10,35);p.hp-=dmg;hurtUs.push(p);if(p.hp<=0)die(p,"was killed fighting the Pruitts")}}
  if(roll>0){const killed=foes.filter(()=>rf()<.5);for(const f of killed){f.status="dead";S.stats.deaths++}const left=foes.filter(f=>f.status==="rival");
    beats.push(pick(["It's fast and ugly. Doors kicked in, shouting, a shot that goes wide.","Boyd sees you coming too late. His people scatter."]));
    beats.push(killed.length?`${killed.length} of them don't get up.`:"Nobody dies. They just break and run.");
    R.gone=true;for(const f of left){f.status="stranger";f.trust=10;f.waitTill=S.t+6*HOUR;f.scened=true;f.met=true}
    const loot={food:ri(8,20),water:ri(6,14),ammo:ri(4,12),scrap:ri(2,6),"i:rope":1};addLoot(loot);beats.push(`You take their stores home: ${lootWords(loot)}.`);
    if(left.length)beats.push(`${listAnd(left.map(f=>f.name))} ${left.length>1?"throw down their weapons and ask":"throws down a weapon and asks"} to come with you. You could let them.`);
    for(const p of party){mem(p,"We beat the Pruitts.",4);p.trust+=4}log("The Pruitt crew is finished.","big")}
  else{beats.push(pick(["They were ready. Somebody shouts your name from a window, and then the shooting starts.","It goes wrong almost at once."]));beats.push("You pull back and run for home.");R.angry+=2;R.raidAt=S.t+ri(20,40)*HOUR;
    const pl=pl_();pl.hp=Math.max(20,pl.hp-ri(15,30));for(const p of party)mem(p,"We lost against the Pruitts.",-5)}
  for(const p of hurtUs)if(p.status!=="dead")beats.push(`${p.name} is hurt.`);for(const p of party)if(p.status==="dead")beats.push(`${p.name} doesn't come home.`);
  syncInv();return{won:roll>0,beats}}

// ---------- places ----------
function travelTo(k){const pl=pl_();if(S.flags.traveling||k===pl.loc||!LOCS[k])return;armUp(true);const hrs=travelHours(pl.loc,k);const party=withYou();
  S.flags.traveling={to:k,from:pl.loc,hrs,start:S.t};for(const p of party){p.loc="road";p.tx=null;p.path=null;p.onArrive=null}pl.loc="road";pl.tx=null;pl.path=null;pl.onArrive=null;if(UI.loot)closeLoot();
  log(`You set out for ${LOCS[k].n}${party.length?" with "+listAnd(party.map(p=>p.name)):""}. About ${hrs} hour${hrs>1?"s":""} on foot.`);if(typeof onTravel==="function")onTravel(hrs)}
function travelTick(){const T=S.flags.traveling;if(!T)return true;step(HOUR/2);if(S.t-T.start<T.hrs*HOUR)return false;
  const party=S.people.filter(p=>p.loc==="road");if(rf()<.12+dangerAt(T.to)*.04){const f=[pl_(),...party].reduce((a,b)=>fightOf(b)>fightOf(a)?b:a);const fx=f===pl_()?"You":f.name;
    if(rf()<.75)log(`On the road, a few of the dead stagger out of a ditch. ${fx} ${f===pl_()?"deal":"deals"} with them.`);else{const v=pick([pl_(),...party]);v.hp-=ri(6,16);log(`Walkers on the road. ${v===pl_()?"You":v.name} took a nasty knock getting past them.`,"warn")}}

function arriveAt(k,silent){const pl=pl_();const party=S.people.filter(p=>p.loc==="road"||p.follow&&p.loc===pl.loc);pl.loc=k;pl.x=ENTRY.x;pl.z=ENTRY.z-2;pl.tx=null;pl.path=null;
  party.forEach((p,i)=>{p.loc=k;p.x=ENTRY.x+(i%3-1)*1.6;p.z=ENTRY.z-.5+Math.floor(i/3);p.tx=null;p.path=null;p.away=k===campK()?null:{kind:"party"}});
  const pl2=place(k);const first=!pl2.seen;pl2.seen=true;topUpWalkers(k);topUpAnimals(k);
  if(k===campK()){unloadHaul();for(const p of party){p.follow=false;p.away=null;p.act="back at camp"}if(!silent&&party.length)log(`You're home. ${listAnd(party.map(p=>p.name))} go back to what they were doing.`)}
  else if(!silent){const L=LOCS[k];log(`${L.n}. ${first?L.d:""} ${walkersAt(k).length>4?"There are a lot of the dead here.":walkersAt(k).length?"Some of the dead are moving around.":"It's quiet."}`,"big");
    // sometimes someone's hiding here
    if(first&&k!=="start"&&rf()<.4&&!(S.rival&&S.rival.site===k)){const hh=mkHousehold(null,k,{x:rf()*12-6,z:rf()*6});for(const q of hh){q.status="stranger";q.trust=ri(5,25);q.waitTill=S.t+9999*HOUR;q.act="hiding";S.people.push(q)}if(typeof maybeHiddenBite==="function")maybeHiddenBite(hh);log(`Someone's here: ${hh.length>1?`${hh.length} people`:hh[0].sex==="F"?"a woman":"a man"}, hiding and watching you.`,"warn")}
    if(S.rival&&S.rival.site===k&&!S.rival.gone)log("The Pruitt crew lives here now. They're watching you.","warn")}
  armUp(true);
  if(typeof onScene==="function")onScene();save();
  if(S.flags.moveIn){const m=S.flags.moveIn;S.flags.moveIn=null;if(m===k&&!S.camp&&!silent)doCamp()}}
function goHome(){if(S.camp)travelTo(S.camp.site)}
function burnPlace(){const pl=pl_();const k=pl.loc;if(k===campK()){toast("That's your camp.");return}if(k==="road")return;const P2=place(k);if(P2.burned){toast("It's already burned.");return}
  const R=S.rival;const theirs=R&&!R.gone&&R.site===k;const h=hourOf(S.t);
  if(theirs&&!(h>=22||h<5)){toast("Not in daylight, with all of them watching. Come back at night, or fight them.");return}

  for(const w of walkersAt(k))if(rf()<.6)putDown(w);place(k).heat=(place(k).heat||0)+6;
  if(theirs){R.weak=true;R.angry+=2;R.raidAt=S.t+ri(18,36)*HOUR;const f=S.people.filter(p=>p.status==="rival");const v=f.length&&rf()<.3?pick(f):null;if(v)die(v,"burned in the fire");log(`You set fire to the Pruitts' place in the dark and get out before anyone's awake enough to shoot. Their stores go up with it.${v?" "+v.name+" didn't get out.":""} They'll want blood.`,"big")}
  else log(`You set ${LOCS[k].n} on fire. Whatever was inside burns with it, and so do the dead that were in there.`,"big");
  step(HOUR);if(typeof onScene==="function")onScene();save()}
function waitHours(h){h=clamp(h|0||1,1,12);for(let i=0;i<h*2;i++){step(HOUR/2);if(S.cards.length)break}log(`You wait ${h} hour${h>1?"s":""}.`)}

// ---------- reading what you typed ----------
function youFy(t){t=t.trim().replace(/^i\s+/i,"you ").replace(/^i'm\s+/i,"you're ").replace(/\bmy\b/gi,"your").replace(/\bme\b/gi,"you").replace(/\bmyself\b/gi,"yourself").replace(/\bi\b/g,"you");if(!/^you/i.test(t))t="You "+t;return cap1(t.replace(/[.!]*$/,"."))}
const VERB3={say:"say",tell:"tell",ask:"ask",yell:"yell",shout:"shout",whisper:"whisper"};
async function doCommand(raw){const text=raw.trim();if(!text)return;if(!S)return;if(S.flags.traveling){toast("You're on the road.");return}const t=text.toLowerCase().replace(/^(i|i'll|i will|let's|lets|we)\s+/,"").trim();

    if(m[1]==="greet"||m[1]==="wave"||!words)words=m[1]==="wave"?"*waves*":"Hi.";
    if(!target){say(pl,cap1(words));return}return speak(target,cap1(words))}
  if(/^(hi|hey|hello|howdy)\b/.test(t)){const target=who||nearestPerson();if(target)return speak(target,cap1(text));say(pl,cap1(text));return}

  // living inside: move in, go in, step out
  const tt=t.replace(/[.!?]+$/,"").replace(/\s+(now|please|quick(ly)?|fast|together)$/,"").trim();
  if(LIVE_RE.test(tt)&&!/\b(tent|cabin|wall|tower)\b/.test(tt))return moveIn(tt);
  if(INSIDE_RE.test(tt)||/^(everyone|everybody|all of you|y'all)\b.*\b(inside|indoors)\b|^get (everyone|everybody) (inside|indoors|in)\b/.test(tt))return goInside(tt,everyoneIn(tt));
  if(OUTSIDE_RE.test(tt))return goOutside();
  // fire: the bodies, the place itself (only when you say so plainly, and you're asked first), or a fire to sit by
  if(/\b(burn|torch|set fire|on fire|ablaze|cremate|bury)\b/.test(tt)&&BODY_RE.test(tt))return clearBodies(/\bbury\b/.test(tt));
  if(/\b(burn|torch|set fire|on fire|ablaze)\b/.test(tt)&&BURN_RE.test(tt))return askBurn();
  // camp, map, travel
  if(/(make|set up|pitch|start|build|found) (our |a |the )?(camp|base|home)( here)?\b/.test(t)&&!/(tent|cabin|wall|tower)/.test(t)){return doCamp()}
  if(FIRE_RE.test(tt)&&!(/^(build|construct|put up|set up|dig|make)\b/.test(tt)&&PIT_RE.test(tt)))return lightFire();
  if(/^(open )?(the )?map$/.test(t))return openMap();
  m=/^(go|head|travel|walk|drive|run|get|move|hike|return)\s+(back\s+)?(to|over to|toward|towards|home|back)\b\s*(.*)$/.exec(t);
  if(m){const rest=(m[4]||"")+" "+(m[3]==="home"?"home":"");if(/\b(home|camp|base)\b/.test(rest)&&S.camp)return goHome();const k=locIn(rest);if(k)return travelTo(k);const tgt=namedIn(rest)[0];if(tgt){if(here_(tgt))approach(tgt);return}const c=contIn(rest);if(c)return approach(c)}
  // hunting: "shoot the deer", "go hunting", "butcher it"

  // guns are for the dead, never the living
  if(/^(shoot|open fire|aim|take a shot|blast|snipe|pick off|gun down)\b|^fire\b(?! up)/.test(t)||/\b(shoot|take a shot at)\b/.test(t)||/\bfire (at|on) (the |that |those |a |an )?(dead|walkers?|zombies?|biters?|them|it|one)\b/.test(t)){
    const living=who||/\b(pruitts?|boyd|stranger|strangers|person|people|guy|man|woman|kid|kids|survivors?)\b/.test(t);
    if(living&&!/\b(dead|walkers?|zombies?|biters?|corpses?)\b/.test(t)){toast("You won't point a gun at the living. If it comes to the Pruitts, that's a war, and it needs your people behind you.");return}
    return shootNearest()}
  if(/^(kill|take out|put down|stab|hit|fight|smash|attack)\b.*\b(dead|walkers?|zombies?|biters?|one of them)\b/.test(t)){const w=nearestWalker();if(!w){toast("There's none of the dead here.");return}
    if(pl.gun&&((pl.rounds||0)>0||loadUp()))return closeAndShoot(w);return approach(w,()=>clash(pl,w))}
  // orders: "Maya, cut some wood", "everyone board up the windows", "push that car", "stop"
  if(orderCmd(t,names,text))return;
  if(/(come with me|follow me|with me|tag along|let's go)/.test(t)){const L=everyoneIn(t)?localPeople().filter(p=>p.status==="member"&&!p.kid):names.filter(p=>p.status==="member");if(!L.length&&who)L.push(who);if(!L.length){toast("Who do you want to come with you? Use a name.");return}return askMany(L,"come")}
  if(/(stay (here|put|behind)|wait here|stop following|go (back )?home|go back to camp)/.test(t)){const L=everyoneIn(t)?withYou():names;if(!L.length)return toast("Who should stay?");return askMany(L,"stay")}
  if(/(war|attack|fight|raid|hit|go after|kill).*(pruitt|boyd|them|rival|the other camp)/.test(t)||/go to war/.test(t))return rally();
  if(/(let|bring|take|invite|welcome)\b.*\b(in|join|stay|with us)|^invite/.test(t)){const s=names.find(p=>p.status==="stranger")||nearestPerson(p=>p.status==="stranger");if(s)return invite(s);toast("There's nobody waiting to be let in.");return}
  if(/(turn .* away|send .* away|tell .* (to )?leave|no room|go away)/.test(t)){const s=names.find(p=>p.status==="stranger")||nearestPerson(p=>p.status==="stranger");if(s)return sendAway(s);if(who&&who.status==="member")return ask(who,"leave");return}
  if(who&&who.status==="member"){const lead=/(in charge|run(s|ning)? the|manag|lead|boss|head of|charge of)/.test(t);for(const [j,re] of Object.entries(JWORDS))if(re.test(t.replace(new RegExp("\\b"+who.name.toLowerCase()+"\\b"),""))){return here_(who)&&approach(who,()=>{say(pl,lead?`I want you running ${JOBS[j].lead}.`:`I need you on ${JOBS[j].n.toLowerCase()}.`);ask(who,lead?"lead":"job",{job:j})})}
    if(/(nothing|no job|take a break|rest|day off)/.test(t))return approach(who,()=>{say(pl,"Take a break.");ask(who,"job",{job:"none"})})}
  // building, crafting, searching, burning
  if(/^(build|construct|put up|set up|raise|erect|dig|plant)\b/.test(t)||/^make (a|an|some|the) /.test(t)&&Object.values(BWORDS).some(re=>re.test(t))){for(const [k,re] of Object.entries(BWORDS))if(re.test(t))return startPlace(k);if(/^(build|construct|put up|raise|erect)/.test(t)){openBuild();return}}
  if(/^(craft|make|tie|sew|carve|whittle|fashion|rig|assemble|knot|weave|sharpen|combine|put|attach|tape|nail|turn)\b/.test(t)&&(Object.keys(S.items).some(k=>t.includes(ITEMS[k].split(" ").pop()))||/^(craft|make|tie|sew|carve|whittle|fashion|weave|knot)\b/.test(t)))return craft(text);

function locIn(t){t=t.toLowerCase();for(const [k,L] of Object.entries(LOCS)){const n=L.n.toLowerCase().replace(/['.]/g,"");if(t.includes(k)||t.includes(n)||n.split(" ").some(w=>w.length>4&&t.includes(w)))return k}return null}

async function runAction(a){const nm=x=>namedIn(String(x||""))[0];const pl=pl_();

    case"walk":{const p=nm(a.to);if(p&&here_(p)){approach(p);break}const c=contIn(String(a.to||"").toLowerCase());if(c)approach(c);break}
    case"travel":if(a.to===campK()||/camp|home/.test(a.to)){goHome();break}if(LOCS[a.to])travelTo(a.to);else{const k=locIn(String(a.to||""));if(k)travelTo(k)}break;

        for(const [n,v] of Object.entries(a.trust||{})){const q=nm(n);if(q){q.trust=clamp(q.trust+clamp(+v||0,-10,10),0,100);mem(q,String(a.text||"").replace(/^You /,S.player.name+" ").slice(0,120),Math.sign(+v||0)*2)}}

function bldAt(loc,x,z){return LOCS[loc]?layout(loc).b.find(r=>x>r.x-r.w/2&&x<r.x+r.w/2&&z>r.z-r.d/2&&z<r.z+r.d/2)||null:null}
function pickBld(t){const pl=pl_();if(!LOCS[pl.loc])return null;const B=layout(pl.loc).b;if(!B.length)return null;t=t||"";
  if(/\bbarn\b/.test(t)){const b=B.find(r=>r.barn);if(b)return b}
  if(/\b(house|farmhouse|home|cabin|church|chapel|store|shop|school|station|motel|mill|office)\b/.test(t)){const b=B.find(r=>!r.barn);if(b)return b}
  const H=B.filter(r=>!r.barn);return(H.length?H:B).slice().sort((a,b)=>dist(a.x,a.z,pl.x,pl.z)-dist(b.x,b.z,pl.x,pl.z))[0]}
// walk in through the door (the walls do the rest: you can only get in through the doorway)
function goInside(t,all){const pl=pl_();if(pl.ko>0||S.flags.traveling)return;const r=pickBld(t);if(!r){toast("There's no building here to go into.");return}

// a place named in so many words ("the church", "Harlan Farm"), not a word that could mean anywhere ("the store")
function locStrict(t){for(const [k,L] of Object.entries(LOCS)){if(k==="start")continue;if(new RegExp("\\b"+k+"\\b").test(t)||t.includes(L.n.toLowerCase().replace(/['.]/g,"")))return k}return null}
// "move in", "we live here now", "make this place our home": make camp here and go inside, or set off for the place you named

// lighting a fire or the stove is something you do, not something you build, and it never burns anything down
function lightFire(){const pl=pl_();const k=pl.loc;const st=S.blds.find(b=>b.loc===k&&b.type==="fire"&&b.done);const ppl=localPeople().filter(p=>p.status==="member");
  const warm=()=>{const fresh=!S.flags.warmAt||S.t-S.flags.warmAt>6*HOUR;S.flags.warmAt=S.t;if(fresh)for(const q of ppl)q.mood=clamp(q.mood+2,0,100)};

function clearBodies(bury){const pl=pl_();const dead=S.walkers.filter(w=>w.loc===pl.loc&&w.dead);const n=dead.length;if(!n){toast(`There are no bodies here to ${bury?"bury":"burn"}.`);return}

// Once you find a gun you keep it on you. Rounds come out of what you're carrying, or out of camp stores when you're home
// (before there's a camp, the stores are just what the group has with them).
function loadUp(){const pl=pl_();if(!pl.gun)return 0;const cap=GUNS[pl.gun].carry;let need=cap-(pl.rounds||0),got=0;if(need<=0)return 0;
  const h=S.haul;for(const o of [...h.items]){if(o.k!=="ammo"||need<=0)continue;const d=Math.min(o.n,need);o.n-=d;need-=d;got+=d;if(o.n<=0)h.items.splice(h.items.indexOf(o),1)}
  if(need>0&&(!S.camp||pl.loc===campK())){const d=Math.min(need,Math.floor(S.res.ammo+1e-6));if(d>0){S.res.ammo-=d;need-=d;got+=d;syncInv()}}
  pl.rounds=(pl.rounds||0)+got;return got}
// pick up a gun you've just found (not one someone else brought into camp), and keep it loaded
function armUp(quiet,looted){if(!S)return;const pl=pl_();if(!LOCS[pl.loc])return;
  if(!pl.gun){const h=S.haul;const hg=h.items.filter(o=>GUNS[o.k]).sort((a,b)=>GUN_RANK[b.k]-GUN_RANK[a.k])[0];let k=null;
    if(hg){k=hg.k;hg.n--;if(hg.n<=0)h.items.splice(h.items.indexOf(hg),1)}
    else if(looted&&looted.length){k=[...looted].sort((a,b)=>GUN_RANK[b]-GUN_RANK[a]).find(k=>itemCount(k)>0)||null;if(k){takeItem(k,1);syncInv()}}
    if(k){pl.gun=k;pl.rounds=pl.rounds||0;loadUp();log(`You keep the ${ITEMS[k]} on you${pl.rounds?`, with ${pl.rounds} rounds`:", but there's no ammo for it yet"}. Click one of the dead to shoot it.`,"good");return}}
  if(pl.gun&&(pl.rounds||0)<GUNS[pl.gun].carry){const got=loadUp();if(got&&!quiet)log(`You load up: ${pl.rounds} rounds for the ${ITEMS[pl.gun]}.`)}}
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
function nearestWalker(){const pl=pl_();return walkersAt(pl.loc).sort((a,b)=>dist(a.x,a.z,pl.x,pl.z)-dist(b.x,b.z,pl.x,pl.z))[0]||null}
function inSight(w){const pl=pl_();return pl.gun&&dist(pl.x,pl.z,w.x,w.z)<=GUNS[pl.gun].range&&clearLine(pl.loc,pl.x,pl.z,w.x,w.z)}
function shoot(w){const pl=pl_();const G=GUNS[pl.gun];if(!G||!w||w.dead||w.loc!==pl.loc||pl.ko>0)return false;
  const now=typeof performance!=="undefined"?performance.now():Date.now();if(now<(pl.gunReady||0))return true;
  if((pl.rounds||0)<=0&&!loadUp()){toast(`The ${ITEMS[pl.gun]} is empty. ${S.camp&&pl.loc!==campK()?"There may be ammo back at camp.":"Cars and the police station might have ammo."}`);return false}
  const d=dist(pl.x,pl.z,w.x,w.z);pl.rounds--;pl.gunReady=now+G.cool;pl.aim=now;pl.tx=null;pl.tz=null;pl.path=null;pl.onArrive=null;pl.dir=Math.atan2(w.x-pl.x,w.z-pl.z);
  // closer is surer, hurt and shaking is worse, and a shotgun can drop more than one
  const p=clamp(G.hit*(1-.5*(d/G.range)**2)-(pl.hp<40?.12:0),.15,.95);const hits=rf()<p?[w]:[];
  if(G.spread)for(const o of walkersAt(pl.loc)){if(o===w||dist(pl.x,pl.z,o.x,o.z)>G.range)continue;if(Math.abs(angDiff(Math.atan2(o.x-pl.x,o.z-pl.z),pl.dir))<.3&&rf()<G.spread)hits.push(o)}
  for(const o of hits)putDown(o);S.stats.shot=(S.stats.shot||0)+hits.length;
  if(typeof shotFx==="function")shotFx(pl,w,hits.includes(w));noiseAt(pl.loc,pl.x,pl.z,G.noise);
  if(!hits.length)say(pl,pick(["Missed.","Damn it.","Hold still...","Come on."]));
  else if(hits.length>1)log(`One blast from the shotgun drops ${hits.length} of them.`,"good");
  else if(rf()<.25)log(pick([`You drop one of the dead with the ${ITEMS[pl.gun]}.`,"One shot. It goes down and stays down.","The shot rolls away across the empty lot. One less of them."]));
  if(pl.rounds===0)toast("That was your last round.");

// walk until you have a clear shot, then take it
function closeAndShoot(w,tries){const pl=pl_();if(!pl.gun||!w||w.dead)return;tries=tries||0;const R=GUNS[pl.gun].range*.7;const d=dist(pl.x,pl.z,w.x,w.z);
  if(d<=GUNS[pl.gun].range&&clearLine(pl.loc,pl.x,pl.z,w.x,w.z)){shoot(w);return}
  if(tries>1){approach(w,()=>{if(!w.dead)shoot(w)});return}
  const f=Math.max(0,(d-R)/Math.max(d,.01));moveTo(pl,pl.x+(w.x-pl.x)*f,pl.z+(w.z-pl.z)*f,()=>{if(!w.dead&&w.loc===pl.loc)closeAndShoot(w,tries+1)})}
function shootNearest(){const pl=pl_();if(!pl.gun){toast("You don't have a gun. Try the police station's armory, or that trooper's cruiser on the highway.");return}
  const L=walkersAt(pl.loc).sort((a,b)=>dist(a.x,a.z,pl.x,pl.z)-dist(b.x,b.z,pl.x,pl.z));const w=L.find(inSight)||L[0];
  if(!w){toast("There's nothing to shoot here.");return}closeAndShoot(w)}

// The same work the menus hand out, said in words: "Maya, cut some wood", "everyone board up the windows",
// "have someone build the fence", "push that car", "shoot the deer", "stop". Nobody named means you do it yourself.
const ORD_FILL=/^(please|tell|ask|have|get|make|order|can|could|would|will|you're|you are|you|to|and|i|we|want|need|should|both|of|them|then|now|okay|ok|hey|just|go ahead and|start)\b[\s,]*/;
const JOBBY=/\b(jobs?|duty|from now on|every ?day|all day|full ?time|in charge|for good|permanently|daily|from here on|regular(ly)?|be (our|the) \w+|run(s|ning)? the|head of|manage|boss)\b/;
function orderCore(t,names){let s=" "+t.toLowerCase().replace(/[,.!?;:]/g," ")+" ";
  for(const p of names)s=s.replace(new RegExp("\\b"+p.name.toLowerCase()+"('s)?\\b","g")," ");

function clickWorld(cx,cy){if(UI.grab)return;if(UI.scene){sceneNext();return}if(UI.pushPick){tryPushPick();return}if(UI.place){tryPlace();return}const h=pickAt(cx,cy);if(!h)return;const pl=S.player;if(S.flags.traveling||pl.ko>0)return;
  if(h.kind==="ground"){if(pl.order){pl.order.queue=null;endOrder(pl,true)}if(S.push)endPush(false);moveTo(pl,h.o.x,h.o.z);W.free=false;return}
  if(h.kind==="person")return personMenu(h.o,cx,cy);
  if(h.kind==="walker"){if(pl.gun&&((pl.rounds||0)>0||loadUp()>0))closeAndShoot(h.o);else attackWalker(h.o);W.free=false;return}
